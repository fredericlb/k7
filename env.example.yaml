common:
  # Signs the session cookie. SHARED on purpose: st0.priv.frediver.se (and
  # studio.frediver.se) is ONE origin serving every service under a path, so
  # st0, pl8, k7 and z0 carry one `studio.sid` between them. The ST0 backend owns
  # /auth/* at the origin root and mints it — it is the service that HAS no path,
  # so its redirect_uri is the prefixless one the IdP has registered. The others
  # mount no auth routes and only verify it, which needs this same secret. The
  # merge is common-then-service, so a section CAN override this — but on the
  # studio origin only a service with its own /auth/login (z0) may, and no value
  # is dropped for being empty: `SESSION_SECRET: ""` overrides just as loudly.
  SESSION_SECRET: ""
  OIDC_ISSUER: ""
  OIDC_CLIENT_ID: ""
  OIDC_CLIENT_SECRET: ""
  OIDC_SCOPES: ""
  GRIST_API_URL: ""
  GRIST_API_KEY: ""

k7-backend:
  PORT: 8787
  # No SESSION_SECRET, exactly as in pl8: k7 is served at /k7 on the studio
  # origin and mounts no auth routes, so it only VERIFIES the `studio.sid` cookie
  # st0 mints — which needs st0's key. Set one here (even "", which the merge does
  # NOT drop) and every /k7/api call 401s while the SPA still looks logged in,
  # because /auth/me is answered by st0. setupAuth warns at startup if you do.
  API_TOKEN_SECRET: ""
  GRIST_DOC_ID: ""
  # Où vont les octets d'une séance : la zone RECORDINGS de la médiathèque.
  # Les deux lignes sont écrites par `npm run tokens` — ne rien taper ici :
  #   MEDIATEK_TOKEN  signé avec l'API_TOKEN_SECRET de la médiathèque, que ce
  #                   même script génère. Sans lui la bibliothèque refuse l'envoi.
  #   MEDIATEK_URL    l'adresse d'un service est FIXE — pour pl8 c'est l'ORIGINE
  #                   elle-même (https://studio.frediver.se), puisqu'il sert la
  #                   racine — et c'est le défaut du code. Un checkout est
  #                   l'exception : cet appel de serveur à serveur passe par le
  #                   port en loopback plutôt que de ressortir jusqu'au proxy du
  #                   LAN pour revenir aussitôt.
  # Voir docs/tokens.md et apps/k7/docs/audio.md.

st0-backend:
  # Every section here is named after its service's PACKAGE. A stale section name is not an
  # error — `loadServiceEnv` returns {} for a section it cannot find — so a deployment
  # carrying a spelling this file no longer uses silently falls back to `common` alone.
  #
  # This backend MINTS the session every other studio service verifies: it owns /auth/*
  # for the whole origin, being the service served at the origin root.
  #
  # OIDC_* come from `common`; unset there, the backend runs a "Dev User" stub. And
  # OIDC_SCOPES must keep `groups` — z0 gates its admin surfaces on group membership, and
  # a session minted without that scope carries an empty array and 403s them all with
  # nothing anywhere saying why.
  # SESSION_SECRET comes from `common` too, and must NOT be overridden here: the others
  # read it from `common` to verify what this one signs.

pl8-backend:
  PORT: 8795
  # No SESSION_SECRET: it comes from `common`, because this backend only VERIFIES
  # the cookie st0 mints. Overriding it here would check a signature nobody wrote —
  # every /pl8/api call would 401 while the SPA still looked logged in.
  #
  # Signs the tokens a machine uses to sync its cache, and the ones the other
  # studio services call this one with (neither has a cookie jar). Rotating it
  # revokes every token at once — they carry no server state. Leave it empty and
  # `npm run tokens` generates one: unset, the backend falls back to
  # SESSION_SECRET + a suffix, so rotating the session secret would log everyone
  # out AND revoke every sync in one move. See docs/tokens.md.
  API_TOKEN_SECRET: ""
  # The library volume. REQUIRED — the service refuses to start without it, rather
  # than falling back to ~/.studio/mediatek and serving an empty directory nobody
  # mounted. No GRIST_*: the library is a folder, not a database.
  STUDIO_MEDIATEK: "/data/mediatek"
  # Optional, all three default to a DOT-DIRECTORY under STUDIO_MEDIATEK, which is
  # what keeps them out of every family scan and unreachable through the file API.
  #   STUDIO_PREFS_DIR     what this service remembers about a person (.prefs)
  #   STUDIO_PROJECTS_DIR  the REGISTER of their git repositories, plus the deploy
  #                        key (.projects) — no clone of any repository lives here;
  #                        see apps/pl8/docs/projects.md
  #   STUDIO_HUNTS_DIR     the search history « Trouver des morceaux » draws under
  #                        its field (.hunts) — see apps/pl8/docs/hunt.md
  # Set them only to put one on a different disk.
  # STUDIO_PROJECTS_DIR: "/data/projects"
  #
  # « Trouver des morceaux » — finding a song on the Soulseek network through a
  # slskd daemon. ALL OPTIONAL, and the feature is off until they are set: the
  # screen opens and NAMES what is missing rather than failing on every query,
  # because an unconfigured deployment is the ordinary state of a new one.
  # Full rationale in apps/pl8/docs/hunt.md.
  #
  # The daemon's REST API. slskd can restrict a key by CIDR — worth doing, since
  # this reaches it across the network rather than over a loopback.
  # SLSKD_URL: "https://slskd.lan:5031"
  # SLSKD_API_KEY: ""
  #
  # The same machine over SSH, because slskd's API cannot serve the bytes: its
  # FilesController lists and deletes a completed download but has no route that
  # returns one. So pl8 PULLS the file rather than that machine pushing it, which
  # is also why nothing has to run over there.
  # SLSKD_SFTP_HOST: "slskd.lan"
  # SLSKD_SFTP_PORT: 22
  # SLSKD_SFTP_USER: ""
  # The key ITSELF, not a path to one — a container gets its secrets as
  # environment. Use a DIFFERENT key from the git deploy key above: reaching a git
  # host and opening a shell on that machine are two different trusts.
  # SLSKD_SFTP_KEY: ""
  # SLSKD_SFTP_PASSPHRASE: ""
  # SLSKD_SFTP_PASSWORD: ""
  # Where slskd drops a finished download, as that machine sees it.
  # SLSKD_DOWNLOADS_DIR: "/downloads"
  #
  # MusicBrainz names the song before slskd looks for it. Their terms ask for a
  # client that identifies itself and says how to reach whoever runs it; the code
  # defaults to a studio-pl8 string, so set this only to put a real contact in it.
  # MUSICBRAINZ_USER_AGENT: "studio-pl8/0.1 ( vous@exemple.org )"
  #
  # « DL sur YouTube », the fallback offered on a hunt Soulseek could not satisfy.
  # There is NOTHING to configure for it: it needs yt-dlp and ffmpeg on the PATH of
  # whatever runs this backend, which the Dockerfile installs — so in production it
  # is a rebuild, not a setting. In dev the two have to be on the machine Tilt runs
  # the backend on. The button greys out and says so when the binary is absent.
  # Set this only to point at a binary that is not simply called `yt-dlp`.
  # YTDLP_BIN: "/usr/local/bin/yt-dlp"

# The LOCAL file service caches the hosted library. Neither half is set here — they
# belong to one machine, not to a deployment, and the supervisor passes both down:
#   MEDIATEK_URL    DERIVED. Every service sits at a fixed path under one origin, and
#                   pl8's path is empty — so this is simply the registry's ORIGIN
#                   (see mediatekUrlFor). Nothing to configure, and no setting for it.
#   MEDIATEK_TOKEN  <state>/engine-host.json (mediatekToken), written by
#                   `npm run tokens` on a checkout — see docs/tokens.md.

z0-backend:
  BACKEND_PORT: 8080
  GRIST_DOC_ID: ""
  # NOT set here on purpose: z0 must inherit `common`'s SESSION_SECRET, like
  # pl8 and k7. It signs z0's own guest cookie AND verifies the `studio.sid`
  # st0 mints, since the account login is st0's — only the prefixless callback
  # is registered at the IdP. Give this service a secret of its own and account
  # logins stop working with no error anywhere: the cookie simply never
  # verifies and the gate appears to loop. apps/z0/docs/auth.md.
  AUTH_ADMIN_GROUPS: ""
  # Playlist mode. Deezer needs nothing; these only unlock *reading* public
  # Spotify playlists (metadata + ISRC) — the audio always comes from Deezer.
  SPOTIFY_CLIENT_ID: ""
  SPOTIFY_CLIENT_SECRET: ""
