common:
  # Signs the session cookie. SHARED on purpose: studio.test (and
  # studio.frediver.se) is ONE origin serving every service under a path, so
  # pistes, mediatek and platines carry one `studio.sid` between them. The pistes
  # backend owns /auth/* at the origin root and mints it; the others mount no auth
  # routes and only verify it, which needs this same secret. A service section may
  # still override it — the yaml merge is common-then-service.
  SESSION_SECRET: ""
  OIDC_ISSUER: ""
  OIDC_CLIENT_ID: ""
  OIDC_CLIENT_SECRET: ""
  OIDC_SCOPES: ""
  GRIST_API_URL: ""
  GRIST_API_KEY: ""

k7-backend:
  PORT: 8787
  SESSION_SECRET: ""
  API_TOKEN_SECRET: ""
  GRIST_DOC_ID: ""
  # Où vont les octets d'une séance : la zone RECORDINGS de la médiathèque.
  # L'URL a une valeur par défaut (le backend médiathèque en local) ; le JETON n'en a
  # pas, et sans lui la bibliothèque refuse l'envoi. Il se frappe une fois, connecté :
  #   curl -X POST https://studio.test/mediatek/api/token -b "studio.sid=…"
  # Voir apps/k7/docs/audio.md.
  MEDIATEK_URL: "http://127.0.0.1:8795"
  MEDIATEK_TOKEN: ""

pistes-web-backend:
  # OIDC_* come from `common`; unset there, the backend runs a "Dev User" stub.
  # SESSION_SECRET comes from `common` too — this backend owns /auth/* for the
  # whole origin, so overriding it here would sign a cookie the others can't read.

mediatek-backend:
  PORT: 8795
  # No SESSION_SECRET: it comes from `common`, because this backend only VERIFIES
  # the cookie the pistes backend mints. Overriding it here breaks that check.
  #
  # Signs the personal access tokens a machine uses to sync its cache (it has no
  # cookie jar). Rotating it revokes every token at once — they carry no server
  # state. Defaults to SESSION_SECRET + a suffix, which is fine for dev only.
  API_TOKEN_SECRET: ""
  # The library volume. REQUIRED — the service refuses to start without it, rather
  # than falling back to ~/.studio/mediatek and serving an empty directory nobody
  # mounted. No GRIST_*: the library is a folder, not a database.
  STUDIO_MEDIATEK: "/data/mediatek"

# The LOCAL file service caches the hosted library. Both are set by the supervisor
# from ~/.studio/engine-tray.json (mediatekUrl / mediatekToken), not from this file —
# they belong to one machine, not to a deployment. Listed here for the record:
#   MEDIATEK_URL    https://media.studio.frediver.se
#   MEDIATEK_TOKEN  minted from the library's UI, pasted once

obscura-backend:
  BACKEND_PORT: 8080
  GRIST_DOC_ID: ""
  SESSION_SECRET: ""
  AUTH_ADMIN_GROUPS: ""
  # Playlist mode. Deezer needs nothing; these only unlock *reading* public
  # Spotify playlists (metadata + ISRC) — the audio always comes from Deezer.
  SPOTIFY_CLIENT_ID: ""
  SPOTIFY_CLIENT_SECRET: ""
