common:
  # Signs the session cookie. SHARED on purpose: studio.test (and
  # studio.frediver.se) is ONE origin serving every service under a path, so
  # l8, st0 and m9 carry one `studio.sid` between them. The ST0 backend owns
  # /auth/* at the origin root and mints it — it is the service that HAS no path,
  # so its redirect_uri is the prefixless one the IdP has registered. The others
  # mount no auth routes and only verify it, which needs this same secret. A
  # service section may still override it — the yaml merge is common-then-service.
  SESSION_SECRET: ""
  OIDC_ISSUER: ""
  OIDC_CLIENT_ID: ""
  OIDC_CLIENT_SECRET: ""
  OIDC_SCOPES: ""
  GRIST_API_URL: ""
  GRIST_API_KEY: ""

k7-backend:
  PORT: 8787
  SESSION_SECRET: ""
  API_TOKEN_SECRET: ""
  GRIST_DOC_ID: ""
  # Où vont les octets d'une séance : la zone RECORDINGS de la médiathèque.
  # Les deux lignes sont écrites par `npm run tokens` — ne rien taper ici :
  #   MEDIATEK_TOKEN  signé avec l'API_TOKEN_SECRET de la médiathèque, que ce
  #                   même script génère. Sans lui la bibliothèque refuse l'envoi.
  #   MEDIATEK_URL    l'adresse d'un service est FIXE — pour st0 c'est l'ORIGINE
  #                   elle-même (https://studio.frediver.se), puisqu'il sert la
  #                   racine — et c'est le défaut du code. Un checkout est
  #                   l'exception : tout y est derrière le `tls internal` de Caddy,
  #                   dont node ne connaît pas l'autorité, donc cet appel de serveur
  #                   à serveur passe par le port en loopback.
  # Voir docs/tokens.md et apps/k7/docs/audio.md.

l8-backend:
  # Was `l8-web-backend` (and `pistes-web-backend` before the rename). Every section here
  # is its service's PACKAGE name; this one was the exception. A stale section name is not
  # an error — `loadServiceEnv` returns {} for a section it cannot find — so a deployment
  # still carrying the old spelling silently falls back to `common` alone.
  #
  # OIDC_* come from `common`; unset there, the backend runs a "Dev User" stub.
  # SESSION_SECRET comes from `common` too — st0 owns /auth/* for the whole origin
  # and mints the cookie this backend only VERIFIES, so overriding it here would
  # check a signature nobody wrote.

st0-backend:
  PORT: 8795
  # No SESSION_SECRET: it comes from `common`, because this backend MINTS the
  # cookie every other studio service verifies. Overriding it here would sign one
  # they cannot read — it owns /auth/* for the whole origin, being the service
  # served at the origin root.
  #
  # Signs the tokens a machine uses to sync its cache, and the ones the other
  # studio services call this one with (neither has a cookie jar). Rotating it
  # revokes every token at once — they carry no server state. Leave it empty and
  # `npm run tokens` generates one: unset, the backend falls back to
  # SESSION_SECRET + a suffix, so rotating the session secret would log everyone
  # out AND revoke every sync in one move. See docs/tokens.md.
  API_TOKEN_SECRET: ""
  # The library volume. REQUIRED — the service refuses to start without it, rather
  # than falling back to ~/.studio/mediatek and serving an empty directory nobody
  # mounted. No GRIST_*: the library is a folder, not a database.
  STUDIO_MEDIATEK: "/data/mediatek"
  # Optional, both default to a DOT-DIRECTORY under STUDIO_MEDIATEK, which is what
  # keeps them out of every family scan and unreachable through the file API.
  #   STUDIO_PREFS_DIR     what this service remembers about a person (.prefs)
  #   STUDIO_PROJECTS_DIR  their git repositories, the deploy key, and the bare
  #                        blobless mirrors this service reads them through
  #                        (.projects) — see apps/st0/docs/projects.md
  # Set them only to put either on a different disk; the mirrors are the half that
  # grows, and they are swept after a fortnight unread.
  # STUDIO_PROJECTS_DIR: "/data/projects"

# The LOCAL file service caches the hosted library. Neither half is set here — they
# belong to one machine, not to a deployment, and the supervisor passes both down:
#   MEDIATEK_URL    DERIVED. Every service sits at a fixed path under one origin, and
#                   st0's path is empty — so this is simply the registry's ORIGIN
#                   (see mediatekUrlFor). Nothing to configure, and no setting for it.
#   MEDIATEK_TOKEN  ~/.studio/engine-tray.json (mediatekToken), written by
#                   `npm run tokens` on a checkout — see docs/tokens.md.

z0-backend:
  BACKEND_PORT: 8080
  GRIST_DOC_ID: ""
  SESSION_SECRET: ""
  AUTH_ADMIN_GROUPS: ""
  # Playlist mode. Deezer needs nothing; these only unlock *reading* public
  # Spotify playlists (metadata + ISRC) — the audio always comes from Deezer.
  SPOTIFY_CLIENT_ID: ""
  SPOTIFY_CLIENT_SECRET: ""
