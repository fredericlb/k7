common:
  # Signs the session cookie. SHARED on purpose: st0, pl8 and k7 each answer their
  # own subdomain of st0.app now, but still carry ONE `studio.sid` between them —
  # see COOKIE_DOMAIN below for how. The ST0 backend owns /auth/* and mints it,
  # being the one app the OIDC provider's redirect_uri names. The others mount
  # no auth routes and only verify it, which needs this same secret. The
  # merge is common-then-service, so a section CAN override this — but only a
  # service with its own /auth/login (z0) may, and no value is dropped for being
  # empty: `SESSION_SECRET: ""` overrides just as loudly.
  SESSION_SECRET: ""
  # `Domain=` for the shared cookie, so it crosses st0.app/play.st0.app/k7.st0.app:
  # ".st0.app" in prod, ".priv.st0.app" in dev. Read directly by every setupAuth()
  # call (commons/packages/oidc) — no code change needed per service. A service
  # that must NOT share it (z0's own guest cookie) passes `cookieDomain: ""` in
  # code to opt out, rather than this being unset here.
  COOKIE_DOMAIN: ""
  # The sibling app origins: comma-separated, e.g. "https://play.st0.app,https://k7.st0.app"
  # (prod) or the priv.st0.app equivalents (dev). Two different jobs read this SAME
  # list, so it lives here rather than in either section: st0's post-login redirect
  # allowlist (without an origin listed here, a login begun from k7 lands on st0's
  # home page instead of bouncing back to k7), and pl8's CORS allowlist (st0 and k7
  # both call pl8's API directly now that it's a different origin).
  TRUSTED_ORIGINS: ""
  OIDC_ISSUER: ""
  OIDC_CLIENT_ID: ""
  OIDC_CLIENT_SECRET: ""
  OIDC_SCOPES: ""
  GRIST_API_URL: ""
  GRIST_API_KEY: ""

k7-backend:
  PORT: 8787
  # No SESSION_SECRET, exactly as in pl8: k7 answers its own subdomain
  # (k7.st0.app) and mounts no auth routes, so it only VERIFIES the `studio.sid`
  # cookie st0 mints — which needs st0's key, and COOKIE_DOMAIN above to even see
  # it. Set a SESSION_SECRET here (even "", which the merge does NOT drop) and
  # every k7 api call 401s while the SPA still looks logged in, because
  # /auth/me is answered by st0. setupAuth warns at startup if you do.
  API_TOKEN_SECRET: ""
  # Data + song-sheet attachments live in PocketBase, not Grist — apps/k7/docs/pocketbase.md.
  POCKETBASE_URL: "http://pocketbase:8090"
  POCKETBASE_EMAIL: ""
  POCKETBASE_PASSWORD: ""
  # Only read by migratePocketbaseData.ts, the one-off copy out of the old Grist
  # doc. Safe to drop once that has run and the doc is decommissioned.
  GRIST_DOC_ID: ""
  # Where a session's bytes live: the RECORDINGS zone of the library.
  # Written by `npm run tokens` — nothing to type here:
  #   MEDIATEK_TOKEN  signed with the library's API_TOKEN_SECRET, which that
  #                   same script generates. Without it the library refuses the push.
  #   MEDIATEK_URL    a service's address is FIXED — for pl8 that's its own
  #                   subdomain origin (https://play.st0.app), the code's
  #                   default. A checkout is the exception: that server-to-server
  #                   call goes over the loopback port instead of leaving for the
  #                   LAN proxy only to come straight back.
  # See docs/tokens.md and apps/k7/docs/audio.md.

st0-backend:
  # Every section here is named after its service's PACKAGE. A stale section name is not an
  # error — `loadServiceEnv` returns {} for a section it cannot find — so a deployment
  # carrying a spelling this file no longer uses silently falls back to `common` alone.
  #
  # This backend MINTS the session every other studio app verifies: every app's
  # "sign in" link sends the browser here, so only ONE redirect_uri is ever
  # registered at the OIDC provider no matter how many subdomains studio grows.
  #
  # OIDC_* come from `common`; unset there, the backend runs a "Dev User" stub. And
  # OIDC_SCOPES must keep `groups` — z0 gates its admin surfaces on group membership, and
  # a session minted without that scope carries an empty array and 403s them all with
  # nothing anywhere saying why.
  # SESSION_SECRET comes from `common` too, and must NOT be overridden here: the others
  # read it from `common` to verify what this one signs. TRUSTED_ORIGINS also comes from
  # `common` — see its comment there for why this backend reads it.

pl8-backend:
  PORT: 8795
  # No SESSION_SECRET: it comes from `common`, because this backend only VERIFIES
  # the cookie st0 mints. Overriding it here would check a signature nobody wrote —
  # every pl8 api call would 401 while the SPA still looked logged in.
  #
  # Signs the tokens a machine uses to sync its cache, and the ones the other
  # studio services call this one with (neither has a cookie jar). Rotating it
  # revokes every token at once — they carry no server state. Leave it empty and
  # `npm run tokens` generates one: unset, the backend falls back to
  # SESSION_SECRET + a suffix, so rotating the session secret would log everyone
  # out AND revoke every sync in one move. See docs/tokens.md.
  API_TOKEN_SECRET: ""
  # The library volume. Optional — absence just means the default
  # (`~/.st0/mediatek`, same as every other backend), see apps/pl8/docs/config.md.
  # No GRIST_*: the library is a folder, not a database.
  STUDIO_MEDIATEK: "/data/mediatek"
  # The accounts' workspaces, one file service per account under this folder — the ONLY place a
  # workspace lives (packages/file-hub/docs/fileHub.md). REQUIRED: pl8 refuses to start without it.
  STUDIO_FILES_ROOT: "/data/workspaces"
  # Optional, all four default to a DOT-DIRECTORY under STUDIO_MEDIATEK, which is
  # what keeps them out of every family scan and unreachable through the file API.
  #   STUDIO_PREFS_DIR     what this service remembers about a person (.prefs)
  #   STUDIO_PROJECTS_DIR  the REGISTER of their git repositories, plus the deploy
  #                        key (.projects) — no clone of any repository lives here;
  #                        see apps/pl8/docs/projects.md
  #   STUDIO_HUNTS_DIR     the search history « Trouver des morceaux » draws under
  #                        its field (.hunts) — see apps/pl8/docs/hunt.md
  #   STUDIO_SETTINGS_DIR  the instance's slskd settings (.settings) — see
  #                        apps/pl8/docs/settings.md
  # Set them only to put one on a different disk.
  # STUDIO_PROJECTS_DIR: "/data/projects"
  #
  # « Trouver des morceaux » — finding a song on the Soulseek network through a
  # slskd daemon. The daemon's address, its API key and the SFTP access are NOT
  # here: they are typed once on pl8's settings page, stored sealed on
  # the volume (.settings) — see apps/pl8/docs/settings.md.
  #
  # MusicBrainz names the song before slskd looks for it. Their terms ask for a
  # client that identifies itself and says how to reach whoever runs it; the code
  # defaults to a studio-pl8 string, so set this only to put a real contact in it.
  # MUSICBRAINZ_USER_AGENT: "studio-pl8/0.1 ( vous@exemple.org )"
  #
  # « DL sur YouTube », the fallback offered on a hunt Soulseek could not satisfy.
  # There is NOTHING to configure for it: it needs yt-dlp and ffmpeg on the PATH of
  # whatever runs this backend, which the Dockerfile installs — so in production it
  # is a rebuild, not a setting. In dev the two have to be on the machine Tilt runs
  # the backend on. The button greys out and says so when the binary is absent.
  # Set this only to point at a binary that is not simply called `yt-dlp`.
  # YTDLP_BIN: "/usr/local/bin/yt-dlp"

# The LOCAL file service caches the hosted library. Neither half is set here — they
# belong to one machine, not to a deployment, and the supervisor passes both down:
#   MEDIATEK_URL    DERIVED. Every service has a fixed address, and pl8's IS its own
#                   subdomain origin (see mediatekUrlFor). Nothing to configure, and
#                   no setting for it.
#   MEDIATEK_TOKEN  <state>/engine-host.json (mediatekToken), written by
#                   `npm run tokens` on a checkout — see docs/tokens.md.

z0-backend:
  BACKEND_PORT: 8080
  GRIST_DOC_ID: ""
  # NOT set here on purpose: z0 must inherit `common`'s SESSION_SECRET, like
  # pl8 and k7. It signs z0's own guest cookie AND verifies the `studio.sid`
  # st0 mints, since the account login is st0's — only the prefixless callback
  # is registered at the IdP. Give this service a secret of its own and account
  # logins stop working with no error anywhere: the cookie simply never
  # verifies and the gate appears to loop. apps/z0/docs/auth.md.
  AUTH_ADMIN_GROUPS: ""
  # Playlist mode. Deezer needs nothing; these only unlock *reading* public
  # Spotify playlists (metadata + ISRC) — the audio always comes from Deezer.
  SPOTIFY_CLIENT_ID: ""
  SPOTIFY_CLIENT_SECRET: ""
