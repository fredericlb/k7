common:
  # Signs the session cookie. SHARED on purpose: k7 and z0 (deployed beside it, configured in
  # its own repository) verify ONE `studio.sid` between them, and the play./k7. aliases answer under st0.app —
  # see COOKIE_DOMAIN below for how. The K7 backend owns /auth/* and mints it,
  # being the one app the OIDC provider's redirect_uri names. The others mount
  # no auth routes and only verify it, which needs this same secret. The
  # merge is common-then-service, so a section CAN override this — but none here
  # may, and no value is dropped for being empty: `SESSION_SECRET: ""` overrides just as loudly.
  SESSION_SECRET: ""
  # `Domain=` for the shared cookie, so the play. and k7. aliases' API still sees it:
  # ".st0.app" in prod, ".priv.st0.app" in dev. Read directly by every setupAuth()
  # call (commons/packages/oidc) — no code change needed per service. A cookie
  # that must NOT be shared passes `cookieDomain: ""` in code to opt out,
  # rather than this being unset here.
  COOKIE_DOMAIN: ""
  # The other origins a login may start from, comma-separated, e.g. "https://other.example";
  # empty while every studio app answers k7's own origin. It is k7's post-login redirect
  # allowlist: a login begun from an origin not listed lands on k7's home page instead of
  # bouncing back. The media API's CORS answers every origin (apps/k7/backend/docs/media/cors.md).
  TRUSTED_ORIGINS: ""
  OIDC_ISSUER: ""
  OIDC_CLIENT_ID: ""
  OIDC_CLIENT_SECRET: ""
  OIDC_SCOPES: ""

k7-backend:
  # Every section here is named after its service's PACKAGE. A stale section name is not an
  # error — `loadServiceEnv` returns {} for a section it cannot find — so a deployment
  # carrying a spelling this file no longer uses silently falls back to `common` alone.
  #
  # This backend MINTS the session every other studio app verifies: every app's
  # "sign in" link sends the browser here, so only ONE redirect_uri is ever
  # registered at the OIDC provider no matter how many subdomains studio grows.
  #
  # OIDC_* come from `common`; unset there, the backend runs a "Dev User" stub. And
  # OIDC_SCOPES must keep `groups` — the library admins below and the deployed z0's admin
  # surfaces gate on group membership, and a session minted without that scope carries an
  # empty array and 403s them all with nothing anywhere saying why.
  # SESSION_SECRET comes from `common` too, and must NOT be overridden here: the others
  # read it from `common` to verify what this one signs. TRUSTED_ORIGINS also comes from
  # `common` — see its comment there for why this backend reads it.
  #
  # It also serves the MEDIA LIBRARY (apps/k7/backend/src/media/): everything below is that side's.
  # Signs the tokens a machine uses to sync its cache, and the one the rehearsal
  # recorder below calls the library with (neither has a cookie jar). Rotating it
  # revokes every token at once — they carry no server state. Leave it empty and
  # `npm run tokens` generates one: unset, the backend falls back to
  # SESSION_SECRET + a suffix, so rotating the session secret would log everyone
  # out AND revoke every sync in one move. See docs/tokens.md.
  API_TOKEN_SECRET: ""
  # The library volume. Optional — absence just means the default
  # (`~/.k7/mediatek`, same as every other backend), see apps/k7/backend/docs/media/config.md.
  # No GRIST_*: the library is a folder, not a database.
  STUDIO_MEDIATEK: "/data/mediatek"
  # The accounts' workspaces, one file service per account under this folder — the ONLY place a
  # workspace lives (packages/file-hub/docs/fileHub.md). REQUIRED: the backend refuses to start without it.
  STUDIO_FILES_ROOT: "/data/workspaces"
  # The OIDC groups whose members edit the origin's LIBRARIES, comma-separated; empty, nobody
  # can (packages/file-hub/docs/fileHub.md). Needs `groups` in OIDC_SCOPES.
  AUTH_ADMIN_GROUPS: ""
  # What this service remembers about a person; defaults to ~/.studio/prefs/k7 (/data/prefs in the image).
  # STUDIO_PREFS_DIR: "/data/prefs"
  #
  # The REHEARSAL recorder (@studio/rehearsal-server), mounted in this same process.
  # k7's old personal-token secret, under a name of its own: the tokens users saved in their
  # settings were signed with it, and API_TOKEN_SECRET above must NOT leak into it. Unset, it
  # falls back to SESSION_SECRET + ":api-token", the secret those tokens carry when none is set.
  K7_API_TOKEN_SECRET: ""
  # The PocketBase the rehearsal store is imported from ONCE, while K7_DATA_DIR's k7.db is still
  # empty — packages/rehearsal-server/docs/store.md. Unset on a new deployment.
  # POCKETBASE_URL: "http://pocketbase:8090"
  # POCKETBASE_EMAIL: ""
  # POCKETBASE_PASSWORD: ""
  # The rehearsal store (k7.db, its sheets), the audio cache and the uploads in flight; defaults to ~/.studio/k7; a volume in the image.
  # K7_DATA_DIR: "/rehearsal-data"
  # The cache is trimmed oldest-first past this many GB; the library can refill it. Defaults to 20.
  # CACHE_MAX_GB: "20"
  # AUTH_ADMIN_GROUPS above also names who deletes a PUBLIC song in the songbook.
  # Optional, all three default to a DOT-DIRECTORY under STUDIO_MEDIATEK, which is
  # what keeps them out of every family scan and unreachable through the file API.
  #   STUDIO_PROJECTS_DIR  the REGISTER of their git repositories, plus the deploy
  #                        key (.projects) — no clone of any repository lives here;
  #                        see apps/k7/backend/docs/media/projects.md
  #   STUDIO_HUNTS_DIR     the search history « Trouver des morceaux » draws under
  #                        its field (.hunts) — see apps/k7/backend/docs/media/hunt.md
  #   STUDIO_SETTINGS_DIR  the instance's slskd settings (.settings) — see
  #                        apps/k7/backend/docs/media/settings.md
  # Set them only to put one on a different disk.
  # STUDIO_PROJECTS_DIR: "/data/projects"
  #
  # « Trouver des morceaux » — finding a song on the Soulseek network through a
  # slskd daemon. The daemon's address, its API key and the SFTP access are NOT
  # here: they are typed once on the library's settings page, stored sealed on
  # the volume (.settings) — see apps/k7/backend/docs/media/settings.md.
  #
  # MusicBrainz names the song before slskd looks for it. Their terms ask for a
  # client that identifies itself and says how to reach whoever runs it; the code
  # defaults to a studio-pl8 string, so set this only to put a real contact in it.
  # MUSICBRAINZ_USER_AGENT: "studio-pl8/0.1 ( vous@exemple.org )"
  #
  # « DL sur YouTube », the fallback offered on a hunt Soulseek could not satisfy.
  # There is NOTHING to configure for it: it needs yt-dlp and ffmpeg on the PATH of
  # whatever runs this backend, which the Dockerfile installs — so in production it
  # is a rebuild, not a setting. In dev the two have to be on the machine Tilt runs
  # the backend on. The button greys out and says so when the binary is absent.
  # Set this only to point at a binary that is not simply called `yt-dlp`.
  # YTDLP_BIN: "/usr/local/bin/yt-dlp"

# The file service reaches the library with MEDIATEK_URL and MEDIATEK_TOKEN, and neither is
# set here: k7's backend starts it, one per account, and hands both down minted for that account
# — see packages/file-service/docs/mediatekLink.md.

