common:
  OIDC_ISSUER: ""
  OIDC_CLIENT_ID: ""
  OIDC_CLIENT_SECRET: ""
  OIDC_SCOPES: ""
  GRIST_API_URL: ""
  GRIST_API_KEY: ""

radiok7-backend:
  PORT: 8787
  SESSION_SECRET: ""
  API_TOKEN_SECRET: ""
  GRIST_DOC_ID: ""

lanes-web-backend:
  # OIDC_* come from `common`; unset there, the backend runs a "Dev User" stub.
  # Set a real SESSION_SECRET (signs the session cookie) in any deployment.
  SESSION_SECRET: ""

obscura-backend:
  BACKEND_PORT: 8080
  GRIST_DOC_ID: ""
  SESSION_SECRET: ""
  AUTH_ADMIN_GROUPS: ""
  # Playlist mode. Deezer needs nothing; these only unlock *reading* public
  # Spotify playlists (metadata + ISRC) — the audio always comes from Deezer.
  SPOTIFY_CLIENT_ID: ""
  SPOTIFY_CLIENT_SECRET: ""
