# lead — one USE of the "synth" module.
#
# A node is a `<name>.yaml` in the project's flat `nodes/` folder, and the FILE
# NAMES IT: chains say "lead" (see chains.yaml). It does not sit under the module it uses
# and does not mirror its folders — which module it uses is what `extends` says, and that
# is the only place the relationship is written down.
#
# So state only what THIS voice changes — the 4OSC plugin, the UI and the two automation
# curves all come from the synth module (which in turn extends @workspace/instruments/fourosc).
# The merge order is: fourosc -> synth -> this file, each winning per key.
extends: "@workspace/instruments/synth"
params:
  Filter Freq: 90 # brighter than the shared default — this one has to cut through
