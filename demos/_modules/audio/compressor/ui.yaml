# panel for the compressor — the screen is drawn by widgets.js, under the id `screen`
cols: 6
rows: 4
widgets:
  screen: { type: lcdscreen, col: 0, row: 0, colSpan: 6, rowSpan: 3 }
  threshold: { type: knob, col: 0, row: 3, label: Thresh, bind: Threshold, min: 0.01, max: 1, curve: log }
  ratio: { type: knob, col: 1, row: 3, label: Ratio, bind: Ratio, min: 0, max: 0.95 }
  attack: { type: knob, col: 2, row: 3, label: Attack, bind: Attack, min: 0.3, max: 200, curve: log }
  release: { type: knob, col: 3, row: 3, label: Release, bind: Release, min: 10, max: 300 }
  makeup: { type: knob, col: 4, row: 3, label: Makeup, bind: Output gain, min: -10, max: 24 }
  sidechain: { type: knob, col: 5, row: 3, label: SC gain, bind: Sidechain gain, min: -24, max: 24 }
