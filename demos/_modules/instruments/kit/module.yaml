# "kit" extends the drumrack, adding the snare and hi-hat to its default kick.
# A module file is a flat struct with no `package` clause. A rack module's `symbols`
# map merges OVER the base's, per symbol.
extends: "@workspace/instruments/drumrack"
type: rack
rack:
  rack_type: samples
  symbols:
    SN:
      note: 38
      clip: snare
    HH:
      note: 42
      clip: hat
