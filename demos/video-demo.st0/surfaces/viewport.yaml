# The FRAME — this song's three video lanes composited with WebGL, drawn against the
# engine's playhead.
#
# `split` is the only layout it draws in: it owns a GL context and one <video> per layer,
# which a screen you opened and closed would rebuild every time. Press its number key or
# `ui viewport` to give it the whole window instead.
#
# Take this file away and the lanes still compile and still draw on the timeline — nothing
# composites them, and `surfaceIssues` says so. See packages/song/docs/surfaces.md.
type: viewport
layout: split
