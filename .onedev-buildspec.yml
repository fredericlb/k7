version: 47
jobs:
- name: lint and test
  steps:
  - type: CheckoutStep
    name: checkout
    cloneCredential:
      type: HttpCredential
      accessTokenSecret: submodule-token
    withLfs: false
    withSubmodules: true
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: lint and test
    runInContainer: true
    image: node:22-alpine
    interpreter:
      type: DefaultInterpreter
      commands: |
        npm ci
        npm run lint
        npm run lint:bytes
        npm run typecheck
        npx turbo run test
    runAs: 1000:1000
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  triggers:
  - type: BranchUpdateTrigger
    branches: master
    userMatch: anyone
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 3600
- name: build and publish studio image
  steps:
  - type: CheckoutStep
    name: checkout
    cloneCredential:
      type: HttpCredential
      accessTokenSecret: submodule-token
    withLfs: false
    withSubmodules: true
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: compute build version
    runInContainer: true
    image: node:22-alpine
    interpreter:
      type: DefaultInterpreter
      commands: |
        # YY.MMDDHHmm in Europe/Paris — becomes the image tag and the stamp every
        # SPA header shows. Falls back to UTC if the image lacks timezone data.
        node -e "const f=t=>new Date().toLocaleString('sv-SE',{timeZone:t});let d;try{d=f('Europe/Paris')}catch{d=f('UTC')}process.stdout.write(d.slice(2,4)+'.'+d.slice(5,7)+d.slice(8,10)+d.slice(11,13)+d.slice(14,16))" > build_version
    runAs: 1000:1000
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: SetBuildVersionStep
    name: set build version
    buildVersion: '@file:build_version@'
    condition: SUCCESSFUL
    optional: false
  - type: BuildImageStep
    name: build and push image
    buildPath: .
    dockerfile: docker/Dockerfile
    output:
      type: RegistryOutput
      tags: dev.frediver.se/frediverse/studio/studio:latest dev.frediver.se/frediverse/studio/studio:@commit_hash@ dev.frediver.se/frediverse/studio/studio:@build_version@
    moreOptions: --build-arg BASE_IMAGE=dev.frediver.se/frediverse/base:latest --build-arg APP_VERSION=@build_version@
    condition: SUCCESSFUL
    optional: false
  triggers:
  - type: BranchUpdateTrigger
    branches: master
    userMatch: anyone
  jobDependencies:
  - jobName: lint and test
    requireSuccessful: true
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 3600
