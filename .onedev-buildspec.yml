version: 47
jobs:
- name: lint and test
  steps:
  - type: CheckoutStep
    name: checkout
    cloneCredential:
      type: HttpCredential
      accessTokenSecret: submodule-token
    withLfs: false
    withSubmodules: true
    condition: SUCCESSFUL
    optional: false
  - type: SetupCacheStep
    name: set up npm cache
    key: npm-cache
    paths:
    - /root/.npm
    uploadStrategy: UPLOAD_IF_CHANGED
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: lint and test
    runInContainer: true
    image: node:22-alpine
    interpreter:
      type: DefaultInterpreter
      commands: |
        apk add --no-cache python3 make g++ git ffmpeg
        npm ci
        npm run lint
        npm run lint:bytes
        npm run typecheck
        npm run test
    runAs: 0:0
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  triggers:
  - type: BranchUpdateTrigger
    branches: master
    userMatch: anyone
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 3600
- name: build and publish studio images
  steps:
  - type: CheckoutStep
    name: checkout
    cloneCredential:
      type: HttpCredential
      accessTokenSecret: submodule-token
    withLfs: false
    withSubmodules: true
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: compute build version
    runInContainer: true
    image: node:22-alpine
    interpreter:
      type: DefaultInterpreter
      commands: |
        # YY.MMDDHHmm in Europe/Paris — becomes the image tag and the stamp every
        # SPA header shows. Falls back to UTC if the image lacks timezone data.
        node -e "const f=t=>new Date().toLocaleString('sv-SE',{timeZone:t});let d;try{d=f('Europe/Paris')}catch{d=f('UTC')}process.stdout.write(d.slice(2,4)+'.'+d.slice(5,7)+d.slice(8,10)+d.slice(11,13)+d.slice(14,16))" > build_version
    runAs: 1000:1000
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: SetBuildVersionStep
    name: set build version
    buildVersion: '@file:build_version@'
    condition: SUCCESSFUL
    optional: false
  # Four images now, not one: st0/pl8/k7 each their own (no nginx, no BASE_IMAGE — see
  # apps/<app>/docker/Dockerfile), z0 still built on the shared base image since it hasn't
  # moved off st0's own hostname and still needs nginx internally.
  - type: BuildImageStep
    name: build and push st0 image
    buildPath: .
    dockerfile: apps/st0/docker/Dockerfile
    output:
      type: RegistryOutput
      tags: dev.frediver.se/frediverse/studio/st0:latest dev.frediver.se/frediverse/studio/st0:@commit_hash@ dev.frediver.se/frediverse/studio/st0:@build_version@
    moreOptions: --build-arg APP_VERSION=@build_version@
    condition: SUCCESSFUL
    optional: false
  - type: BuildImageStep
    name: build and push pl8 image
    buildPath: .
    dockerfile: apps/pl8/docker/Dockerfile
    output:
      type: RegistryOutput
      tags: dev.frediver.se/frediverse/studio/pl8:latest dev.frediver.se/frediverse/studio/pl8:@commit_hash@ dev.frediver.se/frediverse/studio/pl8:@build_version@
    moreOptions: --build-arg APP_VERSION=@build_version@
    condition: SUCCESSFUL
    optional: false
  - type: BuildImageStep
    name: build and push k7 image
    buildPath: .
    dockerfile: apps/k7/docker/Dockerfile
    output:
      type: RegistryOutput
      tags: dev.frediver.se/frediverse/studio/k7:latest dev.frediver.se/frediverse/studio/k7:@commit_hash@ dev.frediver.se/frediverse/studio/k7:@build_version@
    moreOptions: --build-arg APP_VERSION=@build_version@
    condition: SUCCESSFUL
    optional: false
  - type: BuildImageStep
    name: build and push z0 image
    buildPath: .
    dockerfile: apps/z0/docker/Dockerfile
    output:
      type: RegistryOutput
      tags: dev.frediver.se/frediverse/studio/z0:latest dev.frediver.se/frediverse/studio/z0:@commit_hash@ dev.frediver.se/frediverse/studio/z0:@build_version@
    moreOptions: --build-arg BASE_IMAGE=dev.frediver.se/frediverse/base:latest --build-arg APP_VERSION=@build_version@
    condition: SUCCESSFUL
    optional: false
  triggers:
  - type: BranchUpdateTrigger
    branches: master
    userMatch: anyone
  jobDependencies:
  - jobName: lint and test
    requireSuccessful: true
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 3600
# Manual-only (no triggers): a cheap, fast stand-in for the desktop build's real archive —
# run this from the OneDev UI BEFORE the first "build linux desktop" to find a too-low upload limit
# in seconds rather than after a 30+ minute compile. Raise PROBE_MB and re-run if it passes
# at 250 but the real archive turns out bigger; check both OneDev's own Administration ->
# Performance Settings and any reverse proxy in front of it (nginx's client_max_body_size)
# if it is refused.
- name: check artifact upload size (probe)
  steps:
  - type: CommandStep
    name: probe size
    runInContainer: true
    image: alpine:3
    interpreter:
      type: DefaultInterpreter
      commands: |
        dd if=/dev/zero of=probe.bin bs=1M count=${PROBE_MB:-250}
    runAs: 0:0
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: PublishArtifactStep
    name: publish probe
    artifacts: probe.bin
    condition: SUCCESSFUL
    optional: false
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 600
# NIGHTLY, at 02:00 server time: mirrors .github/workflows/desktop.yml's linux-x64 leg — same
# presets, same apt list, same build-engine.mjs / package-release.mjs pair — but publishes the
# archive as a OneDev build artifact instead of a GitHub release. The archive holds both Linux
# deliverables: the tray (.deb and .AppImage, supervisor inside) and the headless engine,
# st0-engine on its own. Not on BranchUpdateTrigger like the two jobs above: a cold configure
# fetches JUCE, Tracktion, Faust, Eigen and NAM and then compiles them, tens of minutes. OneDev
# makes a new build at EVERY firing, so the first command skips the night when master took no
# commit in the last 24 hours. Run "check artifact upload size" first if you have not already
# confirmed the limit.
- name: build linux desktop (engine + supervisor + tray)
  steps:
  - type: CheckoutStep
    name: checkout
    cloneCredential:
      type: HttpCredential
      accessTokenSecret: submodule-token
    withLfs: false
    withSubmodules: true
    condition: SUCCESSFUL
    optional: false
  - type: SetupCacheStep
    name: set up npm cache
    key: npm-cache
    paths:
    - /root/.npm
    uploadStrategy: UPLOAD_IF_CHANGED
    condition: SUCCESSFUL
    optional: false
  # What makes a push minutes rather than tens of them: every C/C++ object (JUCE, Tracktion,
  # Faust, NAM, the supervisor's TLS and WebRTC stacks) through ccache, and the tray's Rust
  # dependencies through a kept target/. Neither changes from one push to the next.
  - type: SetupCacheStep
    name: set up ccache
    key: ccache-linux
    paths:
    - /root/.ccache
    uploadStrategy: UPLOAD_IF_CHANGED
    condition: SUCCESSFUL
    optional: false
  # The dependency SOURCES — Tracktion and JUCE, Faust, Eigen, NAM, QuickJS, the supervisor's stacks —
  # kept in STUDIO_FETCHCONTENT_DIR, so a run clones nothing; what gets built there is deleted at exit.
  - type: SetupCacheStep
    name: set up dependency sources cache
    key: fetch-linux
    paths:
    - /root/.cache/st0-fetch
    uploadStrategy: UPLOAD_IF_CHANGED
    condition: SUCCESSFUL
    optional: false
  - type: SetupCacheStep
    name: set up rust cache
    key: rust-linux
    paths:
    - /root/.rustup
    - /root/.cargo
    - /root/.cache/st0-tray-target
    uploadStrategy: UPLOAD_IF_CHANGED
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: build and package
    runInContainer: true
    image: node:22-bookworm
    interpreter:
      type: DefaultInterpreter
      commands: |
        # A quiet day builds nothing; a git that cannot answer (no repo, dubious ownership) builds anyway.
        git config --global --add safe.directory '*'
        if LAST=$(git log -1 --since='24 hours ago' --format=%H) && [ -z "$LAST" ]; then
          echo "no commit on this branch in the last 24 hours — nothing to build"
          exit 0
        fi

        # Two dep sets, same as the GitHub workflow: Tauri's GTK/appindicator set for the
        # tray, JUCE's ALSA/JACK/X11 set for the engine — plus the ordinary toolchain
        # (cmake/ninja/build-essential/git/python3) a bare node image carries none of.
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y --no-install-recommends \
          build-essential cmake ninja-build ccache git curl ca-certificates pkg-config python3 \
          libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf \
          libayatana-appindicator3-dev libssl-dev \
          libasound2-dev libjack-jackd2-dev libfreetype6-dev libfontconfig1-dev \
          libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
          libxrandr-dev libxrender-dev libglu1-mesa-dev mesa-common-dev \
          libcurl4-openssl-dev ladspa-sdk

        # A cached toolchain is kept, and moved to the latest stable only when one exists.
        if [ -x "$HOME/.cargo/bin/rustup" ]; then
          "$HOME/.cargo/bin/rustup" update stable
        else
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
        fi
        . "$HOME/.cargo/env"

        # CMake takes the launcher from the environment for every build tree it configures,
        # nested ones included. BASEDIR and NOHASHDIR keep a hit from depending on where the workspace is.
        export CMAKE_C_COMPILER_LAUNCHER=ccache CMAKE_CXX_COMPILER_LAUNCHER=ccache
        # The fetch cache keeps SOURCES only, however the build ends: what CMake built inside it is per preset.
        export STUDIO_FETCHCONTENT_DIR=/root/.cache/st0-fetch
        trap 'find "$STUDIO_FETCHCONTENT_DIR" -mindepth 2 -maxdepth 2 -type d -name "*-build" -exec rm -rf {} +; rm -rf "$STUDIO_FETCHCONTENT_DIR"/st0-engine/faust-src/build/lib' EXIT
        export CCACHE_DIR=/root/.ccache CCACHE_BASEDIR="$PWD" CCACHE_NOHASHDIR=true CCACHE_MAXSIZE=4G
        ccache --zero-stats

        # build-engine.mjs reads the bundles from src-tauri/target, so the cached one is linked
        # there; last push's bundles go first, or they would ride into this push's archive.
        mkdir -p /root/.cache/st0-tray-target
        rm -rf /root/.cache/st0-tray-target/release/bundle
        ln -sfn /root/.cache/st0-tray-target engine/st0-tray/src-tauri/target

        npm ci

        # Same YY.MMDDHHmm stamp as "compute build version" above, computed inline here
        # since this job has no image tag needing the buildspec's own build version. (No
        # at-sign placeholders in this text, comments included: OneDev substitutes them all.)
        STAMP=$(node -e "const f=t=>new Date().toLocaleString('sv-SE',{timeZone:t});let d;try{d=f('Europe/Paris')}catch{d=f('UTC')}process.stdout.write(d.slice(2,4)+'.'+d.slice(5,7)+d.slice(8,10)+d.slice(11,13)+d.slice(14,16))")

        # Release presets for both native programs, as the GitHub leg names them: the supervisor
        # otherwise takes its host default, dev-gcc. linuxdeploy cannot strip inside its own
        # AppImage staging tree on a container image — docs/desktop-release.md.
        STUDIO_ENGINE_PRESET=release-gcc STUDIO_SUPERVISOR_PRESET=release-gcc NO_STRIP=true \
          node engine/st0-tray/scripts/build-engine.mjs
        node engine/st0-tray/scripts/package-release.mjs --stamp "$STAMP"
        ccache --show-stats
    runAs: 0:0
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: PublishArtifactStep
    name: publish linux desktop archive
    artifacts: dist/release/*.tar.gz
    condition: SUCCESSFUL
    optional: false
  triggers:
  - type: ScheduleTrigger
    cronExpression: 0 0 2 * * ?
  jobDependencies:
  - jobName: lint and test
    requireSuccessful: true
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 5400
# NIGHTLY, at 02:00 like the desktops, and skipped the same way on a day without commits: the
# Android app, engine/st0-android — the engine as libst0engine.so, built by its android-arm64 preset,
# with the supervisor, inside a DEBUG-signed APK (there is no release key). Gradle builds the
# engine itself through scripts/build.mjs with the SDK's pinned NDK; engine/st0-engine/docs/android.md.
# The SDK is fetched and pinned like every other dependency and kept in a cache keyed by its
# versions, so a bump of any of them is a new key rather than a stale SDK.
- name: build android app
  steps:
  - type: CheckoutStep
    name: checkout
    cloneCredential:
      type: HttpCredential
      accessTokenSecret: submodule-token
    withLfs: false
    withSubmodules: true
    condition: SUCCESSFUL
    optional: false
  - type: SetupCacheStep
    name: set up android sdk cache
    key: android-sdk-cmdline23.0-platform36-build36.0.0-ndk29.0.14206865
    paths:
    - /opt/android-sdk
    uploadStrategy: UPLOAD_IF_CHANGED
    condition: SUCCESSFUL
    optional: false
  - type: SetupCacheStep
    name: set up gradle cache
    key: gradle-cache
    paths:
    - /root/.gradle
    uploadStrategy: UPLOAD_IF_CHANGED
    condition: SUCCESSFUL
    optional: false
  # Its own key, never the linux job's: the same sources compile to arm64 objects here.
  - type: SetupCacheStep
    name: set up ccache
    key: ccache-android
    paths:
    - /root/.ccache
    uploadStrategy: UPLOAD_IF_CHANGED
    condition: SUCCESSFUL
    optional: false
  # The dependency SOURCES — Tracktion and JUCE, Faust, Eigen, NAM, QuickJS, the supervisor's stacks —
  # kept in STUDIO_FETCHCONTENT_DIR, so a run clones nothing; what gets built there is deleted at exit.
  - type: SetupCacheStep
    name: set up dependency sources cache
    key: fetch-android
    paths:
    - /root/.cache/st0-fetch
    uploadStrategy: UPLOAD_IF_CHANGED
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: build apk
    runInContainer: true
    # trixie, not bookworm: it carries JDK 21, which the command-line tools and AGP run on.
    image: node:22-trixie
    interpreter:
      type: DefaultInterpreter
      commands: |
        # A quiet day builds nothing; a git that cannot answer (no repo, dubious ownership) builds anyway.
        git config --global --add safe.directory '*'
        if LAST=$(git log -1 --since='24 hours ago' --format=%H) && [ -z "$LAST" ]; then
          echo "no commit on this branch in the last 24 hours — nothing to build"
          exit 0
        fi

        set -e
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        # The C++ toolchain is for the HOST half of the build: JUCE compiles juceaide for the
        # machine running the build, whatever the target.
        apt-get install -y --no-install-recommends \
          openjdk-21-jdk-headless build-essential cmake ninja-build ccache pkg-config \
          git curl ca-certificates unzip

        # Gradle hands its environment to the engine's CMake, so this reaches the NDK's clang too.
        export CMAKE_C_COMPILER_LAUNCHER=ccache CMAKE_CXX_COMPILER_LAUNCHER=ccache
        # The fetch cache keeps SOURCES only, however the build ends: what CMake built inside it is per preset.
        export STUDIO_FETCHCONTENT_DIR=/root/.cache/st0-fetch
        trap 'find "$STUDIO_FETCHCONTENT_DIR" -mindepth 2 -maxdepth 2 -type d -name "*-build" -exec rm -rf {} +; rm -rf "$STUDIO_FETCHCONTENT_DIR"/st0-engine/faust-src/build/lib' EXIT
        export CCACHE_DIR=/root/.ccache CCACHE_BASEDIR="$PWD" CCACHE_NOHASHDIR=true CCACHE_MAXSIZE=3G
        ccache --zero-stats

        export ANDROID_HOME=/opt/android-sdk
        SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
        if [ ! -x "$SDKMANAGER" ]; then
          curl -sfL -o /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip
          echo "0877a1d048fe4a24efe2eff536ca4223f7adeb58648bb81909d33c446918cfa8  /tmp/cmdline-tools.zip" \
            | sha256sum -c -
          rm -rf /tmp/cmdline-tools && unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          mv /tmp/cmdline-tools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
        fi
        yes | "$SDKMANAGER" --licenses > /dev/null
        # The versions engine/st0-android/app/build.gradle.kts names: compileSdk and ndkVersion.
        "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"

        # Same YY.MMDDHHmm stamp as the linux desktop archive, so the night's artifacts match.
        STAMP=$(node -e "const f=t=>new Date().toLocaleString('sv-SE',{timeZone:t});let d;try{d=f('Europe/Paris')}catch{d=f('UTC')}process.stdout.write(d.slice(2,4)+'.'+d.slice(5,7)+d.slice(8,10)+d.slice(11,13)+d.slice(14,16))")

        cd engine/st0-android
        ./gradlew --no-daemon assembleDebug
        mkdir -p ../../dist/release
        cp app/build/outputs/apk/debug/app-debug.apk "../../dist/release/st0-android_${STAMP}_arm64.apk"
        ccache --show-stats
    runAs: 0:0
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: PublishArtifactStep
    name: publish android apk
    artifacts: dist/release/*.apk
    condition: SUCCESSFUL
    optional: false
  triggers:
  - type: ScheduleTrigger
    cronExpression: 0 0 2 * * ?
  jobDependencies:
  - jobName: lint and test
    requireSuccessful: true
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 5400
# The Windows leg of .github/workflows/desktop.yml, on the Windows AGENT — a Remote Shell Executor,
# so no container: the steps run in cmd on the machine itself, with whatever it has installed
# (Node, Git, Rust via rustup, CMake, Ninja, Visual Studio Build Tools). Nightly at 02:00 and
# skipped on a day without commits, like the Linux build above. It names no executor: the Remote Shell Executor whose JOB MATCH takes this job
# runs it, on an agent its AGENT SELECTOR picks by OS — docs/desktop-release.md.
#
# No preset override: the agent builds with the host default, windows-msvc (Visual Studio 2026), as
# a developer does. windows-msvc-2022 is GitHub's runner's, and fails where VS 2022 is absent.
#
# cmd does not stop on a failing line, so every command carries its own `|| exit /b 1`, and npm
# is `call`ed because it is npm.cmd: without `call` a batch file never comes back from it.
- name: build windows desktop (engine + tray + file-service)
  steps:
  - type: CheckoutStep
    name: checkout
    cloneCredential:
      type: HttpCredential
      accessTokenSecret: submodule-token
    withLfs: false
    withSubmodules: true
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: build and package
    runInContainer: false
    interpreter:
      type: DefaultInterpreter
      commands: |
        git log -1 --since="24 hours ago" --oneline > last_commit || echo unknown> last_commit
        findstr . last_commit >nul || (echo no commit on this branch in the last 24 hours - nothing to build & exit /b 0)
        git config core.longpaths true || exit /b 1
        call npm ci || exit /b 1
        node -e "const f=t=>new Date().toLocaleString('sv-SE',{timeZone:t});let d;try{d=f('Europe/Paris')}catch{d=f('UTC')}process.stdout.write(d.slice(2,4)+'.'+d.slice(5,7)+d.slice(8,10)+d.slice(11,13)+d.slice(14,16))" > build_version || exit /b 1
        set /p STUDIO_RELEASE_STAMP=<build_version
        node engine/st0-tray/scripts/build-engine.mjs || exit /b 1
        node engine/st0-tray/scripts/package-release.mjs || exit /b 1
    useTTY: false
    condition: SUCCESSFUL
    optional: false
  - type: PublishArtifactStep
    name: publish windows desktop archive
    artifacts: dist/release/*.zip
    condition: SUCCESSFUL
    optional: false
  triggers:
  - type: ScheduleTrigger
    cronExpression: 0 0 2 * * ?
  jobDependencies:
  - jobName: lint and test
    requireSuccessful: true
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 7200
