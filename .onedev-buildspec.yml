version: 47
jobs:
# Runs WHILE "build studio images" builds; "publish studio images" waits for both — docs/images.md.
- name: lint and test
  steps:
  - type: CheckoutStep
    name: checkout
    cloneCredential:
      type: HttpCredential
      accessTokenSecret: submodule-token
    withLfs: false
    withSubmodules: true
    condition: SUCCESSFUL
    optional: false
  - type: SetupCacheStep
    name: set up npm cache
    key: npm-cache
    paths:
    - /root/.npm
    uploadStrategy: UPLOAD_IF_CHANGED
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: lint and test
    runInContainer: true
    image: node:24-alpine
    interpreter:
      type: DefaultInterpreter
      commands: |
        # Without it sh answers with the LAST command's status, and an earlier failure passes.
        set -e
        # No C toolchain: ssh2's crypto binding is optional, and node-pty is out of the workspace (docs/remote.md).
        apk add --no-cache git ffmpeg
        # 14s from the npm cache above; a cached node_modules (1.2 GB) would cost more to move than that.
        npm ci
        # The four checks at once, each one's output grouped, and red if any one is — docs/tests.md. Two test
        # workspaces at a time, not four: the image builds compile on the same host meanwhile, and starve disk tests past 30 s.
        npx concurrently --group --names lint,bytes,typecheck,test \
          "npm run lint" "npm run lint:bytes" "npm run typecheck -- --jobs 2" "npm run test -- --jobs 2"
    runAs: 0:0
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  triggers:
  - type: BranchUpdateTrigger
    branches: main
    userMatch: anyone
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 3600
# No trigger of its own: "publish studio images" runs it beside "lint and test". It pushes only the
# commit's tag, which nothing deploys; :latest and the version stamp wait for the tests.
- name: build studio images
  steps:
  - type: CheckoutStep
    name: checkout
    cloneCredential:
      type: HttpCredential
      accessTokenSecret: submodule-token
    withLfs: false
    withSubmodules: true
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: compute build version
    runInContainer: true
    image: node:24-alpine
    interpreter:
      type: DefaultInterpreter
      commands: |
        # YY.MMDDHHmm in Europe/Paris — becomes the image tag and the stamp every
        # SPA header shows. Falls back to UTC if the image lacks timezone data.
        node -e "const f=t=>new Date().toLocaleString('sv-SE',{timeZone:t});let d;try{d=f('Europe/Paris')}catch{d=f('UTC')}process.stdout.write(d.slice(2,4)+'.'+d.slice(5,7)+d.slice(8,10)+d.slice(11,13)+d.slice(14,16))" > build_version
    runAs: 1000:1000
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: SetBuildVersionStep
    name: set build version
    buildVersion: '@file:build_version@'
    condition: SUCCESSFUL
    optional: false
  # The publish job tags with this same stamp, the one baked into the SPAs.
  - type: PublishArtifactStep
    name: publish build version
    artifacts: build_version
    condition: SUCCESSFUL
    optional: false
  # One image: k7, the media library and the rehearsal recorder included. It keeps its layers in
  # the registry (cache:k7-webapp), so a fresh builder still finds the installs — docs/images.md.
  - type: BuildImageStep
    name: build and push k7-webapp image
    buildPath: .
    dockerfile: apps/k7/docker/Dockerfile
    output:
      type: RegistryOutput
      tags: dev.frediver.se/frediverse/k7/k7-webapp:@commit_hash@
    moreOptions: --build-arg APP_VERSION=@build_version@ --cache-from type=registry,ref=dev.frediver.se/frediverse/k7/cache:k7-webapp --cache-to type=registry,ref=dev.frediver.se/frediverse/k7/cache:k7-webapp,mode=max,image-manifest=true,oci-mediatypes=true
    condition: SUCCESSFUL
    optional: false
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 3600
# The server's engine (engine/docker/Dockerfile): a job of its own, because a cold build compiles
# Tracktion, JUCE and Faust and outlasts the k7-webapp image's hour. Its layers are kept in cache:k7-runtime,
# so a push that touches no native source finds the compile in the cache — docs/server-engine.md.
- name: build engine image
  steps:
  - type: CheckoutStep
    name: checkout
    cloneCredential:
      type: HttpCredential
      accessTokenSecret: submodule-token
    withLfs: false
    withSubmodules: false
    condition: SUCCESSFUL
    optional: false
  - type: BuildImageStep
    name: build and push k7-runtime image
    buildPath: .
    dockerfile: engine/docker/Dockerfile
    output:
      type: RegistryOutput
      tags: dev.frediver.se/frediverse/k7/k7-runtime:@commit_hash@
    moreOptions: --cache-from type=registry,ref=dev.frediver.se/frediverse/k7/cache:k7-runtime --cache-to type=registry,ref=dev.frediver.se/frediverse/k7/cache:k7-runtime,mode=max,image-manifest=true,oci-mediatypes=true
    condition: SUCCESSFUL
    optional: false
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 10800
# What a deployment pulls: the commit's k7 and engine images, tagged :latest and with its stamp once
# the tests pass. imagetools copies a manifest within the registry, so nothing is built or pulled here.
- name: publish studio images
  steps:
  - type: SetBuildVersionStep
    name: set build version
    buildVersion: '@file:build_version@'
    condition: SUCCESSFUL
    optional: false
  - type: RunImagetoolsStep
    name: tag k7-webapp image
    arguments: create -t dev.frediver.se/frediverse/k7/k7-webapp:latest -t dev.frediver.se/frediverse/k7/k7-webapp:@build_version@ dev.frediver.se/frediverse/k7/k7-webapp:@commit_hash@
    condition: SUCCESSFUL
    optional: false
  - type: RunImagetoolsStep
    name: tag k7-runtime image
    arguments: create -t dev.frediver.se/frediverse/k7/k7-runtime:latest -t dev.frediver.se/frediverse/k7/k7-runtime:@build_version@ dev.frediver.se/frediverse/k7/k7-runtime:@commit_hash@
    condition: SUCCESSFUL
    optional: false
  triggers:
  - type: BranchUpdateTrigger
    branches: main
    userMatch: anyone
  jobDependencies:
  - jobName: lint and test
    requireSuccessful: true
  - jobName: build studio images
    requireSuccessful: true
    artifacts: build_version
  - jobName: build engine image
    requireSuccessful: true
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 1800
# Manual-only (no triggers): a cheap, fast stand-in for the engine build's real archive —
# run this from the OneDev UI BEFORE the first "release" to find a too-low upload limit
# in seconds rather than after a 30+ minute compile. Raise PROBE_MB and re-run if it passes
# at 250 but the real archive turns out bigger; check both OneDev's own Administration ->
# Performance Settings and any reverse proxy in front of it (nginx's client_max_body_size)
# if it is refused.
- name: check artifact upload size (probe)
  steps:
  - type: CommandStep
    name: probe size
    runInContainer: true
    image: alpine:3
    interpreter:
      type: DefaultInterpreter
      commands: |
        dd if=/dev/zero of=probe.bin bs=1M count=${PROBE_MB:-250}
    runAs: 0:0
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: PublishArtifactStep
    name: publish probe
    artifacts: probe.bin
    condition: SUCCESSFUL
    optional: false
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 600
# The release graph, GitHub's (.github/workflows/release.yml) minus Linux and macOS, which only GitHub builds
# (docs/release.md): the command-line engine — engine/k7-runtime and engine/k7-supervisor compiled and archived — and
# the APK, both on the Windows agent; the tray is GitHub's alone (.github/workflows/tray.yml); and "release", which the
# triggers name and which gathers every file into one build. Both wait for "lint and test": a release must not ship
# what the tests refuse.
# The Windows jobs, on the Windows AGENT — a Remote Shell Executor, so no container: the steps run in cmd on the
# machine itself, with what it has installed (Node, Git, CMake, Ninja, Visual Studio Build Tools). No job names
# an executor: the shell executor whose JOB MATCH takes them runs them, on an agent its AGENT SELECTOR picks by OS
# (docs/release.md). cmd does not stop on a failing line, so every command carries its own `|| exit /b 1`,
# and npm is `call`ed because it is npm.cmd. commons by hand: the checkout takes no submodule.
- name: engine windows
  steps:
  - type: CheckoutStep
    name: checkout
    cloneCredential:
      type: HttpCredential
      accessTokenSecret: submodule-token
    withLfs: false
    withSubmodules: false
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: build the engine
    runInContainer: false
    interpreter:
      type: DefaultInterpreter
      commands: |
        rem The dependency SOURCES stay on the agent's disk; what the last run BUILT there goes first, cmd having no trap.
        if not defined STUDIO_FETCHCONTENT_DIR set "STUDIO_FETCHCONTENT_DIR=%LOCALAPPDATA%\k7-ci\fetch"
        for /d %%P in ("%STUDIO_FETCHCONTENT_DIR%\*") do for /d %%B in ("%%P\*-build") do rmdir /s /q "%%B"
        if exist "%STUDIO_FETCHCONTENT_DIR%\k7-runtime\faust-src\build\lib" rmdir /s /q "%STUDIO_FETCHCONTENT_DIR%\k7-runtime\faust-src\build\lib"
        git config core.longpaths true || exit /b 1
        rem The token in the environment, not on the command line, where any process listing would show it.
        set "GIT_CONFIG_COUNT=1"
        set "GIT_CONFIG_KEY_0=http.extraHeader"
        set "GIT_CONFIG_VALUE_0=OneDevAuthorization: Bearer @secret:submodule-token@"
        git submodule update --init commons || exit /b 1
        set "GIT_CONFIG_COUNT="
        set "GIT_CONFIG_KEY_0="
        set "GIT_CONFIG_VALUE_0="
        call npm ci || exit /b 1
        git describe --tags --exact-match --match "v*" > build_version 2>nul || (for /f %%H in ('git rev-parse --short HEAD') do echo snapshot-%%H> build_version)
        set /p STUDIO_RELEASE_STAMP=<build_version
        node engine/scripts/build-engine.mjs || exit /b 1
        node engine/scripts/package-release.mjs --kind engine || exit /b 1
    useTTY: false
    condition: SUCCESSFUL
    optional: false
  - type: PublishArtifactStep
    name: publish the engine archive
    artifacts: dist/release/k7-runtime_*
    condition: SUCCESSFUL
    optional: false
  jobDependencies:
  - jobName: lint and test
    requireSuccessful: true
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 7200
# The phone: engine/k7-android's release APK, signed with the key in the android-* job secrets — the engine as
# libk7runtime.so, built by its android-arm64 preset, with the supervisor and the Capacitor page (web/) — as GitHub's
# android job builds it, on the Windows agent with what it has installed: the Android SDK (platform 36, some build
# tools, NDK 29.0.14206865), Android Studio's JDK 21, and the Visual Studio Build Tools, whose vcvars64 puts cl.exe on
# the path for juceaide, which JUCE compiles for the HOST under Ninja (engine/k7-runtime/docs/android.md).
# A secret is set in cmd between quotes, so it must hold no `"` and no `%`.
- name: android
  steps:
  - type: CheckoutStep
    name: checkout
    cloneCredential:
      type: HttpCredential
      accessTokenSecret: submodule-token
    withLfs: false
    withSubmodules: false
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: build apk
    runInContainer: false
    interpreter:
      type: DefaultInterpreter
      commands: |
        rem Its own sources folder: the engine job deletes its builds there while this one may be building.
        if not defined STUDIO_FETCHCONTENT_DIR set "STUDIO_FETCHCONTENT_DIR=%LOCALAPPDATA%\k7-ci\fetch-android"
        for /d %%P in ("%STUDIO_FETCHCONTENT_DIR%\*") do for /d %%B in ("%%P\*-build") do rmdir /s /q "%%B"
        if exist "%STUDIO_FETCHCONTENT_DIR%\k7-runtime\faust-src\build\lib" rmdir /s /q "%STUDIO_FETCHCONTENT_DIR%\k7-runtime\faust-src\build\lib"
        git config core.longpaths true || exit /b 1
        rem The token in the environment, not on the command line, where any process listing would show it.
        set "GIT_CONFIG_COUNT=1"
        set "GIT_CONFIG_KEY_0=http.extraHeader"
        set "GIT_CONFIG_VALUE_0=OneDevAuthorization: Bearer @secret:submodule-token@"
        git submodule update --init commons || exit /b 1
        set "GIT_CONFIG_COUNT="
        set "GIT_CONFIG_KEY_0="
        set "GIT_CONFIG_VALUE_0="
        rem The app's page (engine/k7-android/web) and Capacitor's Android runtime come from the root install.
        call npm ci || exit /b 1
        rem The release's name, as GitHub's names it: the tag on a tag, snapshot-<commit> on main.
        git describe --tags --exact-match --match "v*" > build_version 2>nul || (for /f %%H in ('git rev-parse --short HEAD') do echo snapshot-%%H> build_version)
        set /p STAMP=<build_version
        if not defined ANDROID_HOME set "ANDROID_HOME=%LOCALAPPDATA%\Android\Sdk"
        if not defined JAVA_HOME set "JAVA_HOME=%ProgramFiles%\Android\Android Studio\jbr"
        rem The versions engine/k7-android/app/build.gradle.kts names: compileSdk and ndkVersion.
        for %%D in ("platforms\android-36" "ndk\29.0.14206865") do if not exist "%ANDROID_HOME%\%%~D" (echo the agent's Android SDK has no %%~D & exit /b 1)
        rem apksigner and aapt2 from the newest build tools the agent has: only they are read here, AGP picks its own.
        set "TOOLS="
        for /f "delims=" %%T in ('dir /b /ad /o:n "%ANDROID_HOME%\build-tools" 2^>nul') do set "TOOLS=%ANDROID_HOME%\build-tools\%%T"
        if not defined TOOLS (echo the agent's Android SDK has no build tools & exit /b 1)
        if not exist "%JAVA_HOME%\bin\java.exe" (echo no JDK 21 at %JAVA_HOME% & exit /b 1)
        for /f "usebackq delims=" %%V in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set "VSDIR=%%V"
        call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat" > nul || exit /b 1
        rem Windows' own tar first: the Termux tools step runs tar on C:\ paths, which GNU tar reads as a host.
        set "PATH=%SystemRoot%\System32;%PATH%"
        rem The release key, written to a folder of this run's own and deleted whatever Gradle answers.
        set "SIGN=%TEMP%\k7-signing-@build_number@"
        if exist "%SIGN%" rmdir /s /q "%SIGN%"
        mkdir "%SIGN%" || exit /b 1
        > "%SIGN%\keystore.b64" echo @secret:android-keystore-b64@
        certutil -f -decode "%SIGN%\keystore.b64" "%SIGN%\release.jks" > nul || (rmdir /s /q "%SIGN%" & exit /b 1)
        set "K7_ANDROID_KEYSTORE_FILE=%SIGN%\release.jks"
        set "K7_ANDROID_KEYSTORE_PASSWORD=@secret:android-keystore-password@"
        set "K7_ANDROID_KEY_ALIAS=@secret:android-key-alias@"
        set "K7_ANDROID_KEY_PASSWORD=@secret:android-key-password@"
        cd engine\k7-android
        call gradlew.bat --no-daemon assembleRelease
        set "BUILT=%ERRORLEVEL%"
        rmdir /s /q "%SIGN%"
        if not "%BUILT%"=="0" exit /b %BUILT%
        set "APK=app\build\outputs\apk\release\app-release.apk"
        rem Refuses an unsigned or debuggable APK before it can reach the release.
        call "%TOOLS%\apksigner.bat" verify --print-certs "%APK%" || exit /b 1
        "%TOOLS%\aapt2.exe" dump badging "%APK%" | findstr /c:"application-debuggable" > nul && (echo the release APK is debuggable & exit /b 1)
        if not exist ..\..\dist\release mkdir ..\..\dist\release
        copy /y "%APK%" "..\..\dist\release\k7-android_%STAMP%_arm64.apk" > nul || exit /b 1
    useTTY: false
    condition: SUCCESSFUL
    optional: false
  - type: PublishArtifactStep
    name: publish android apk
    artifacts: dist/release/*.apk
    condition: SUCCESSFUL
    optional: false
  jobDependencies:
  - jobName: lint and test
    requireSuccessful: true
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 5400
# What a push or a tag starts: the Windows engine and the APK, run through the dependencies below, and their
# files gathered into this one build — OneDev's release page. Red when any of them is. The paths are GitHub's gate:
# a push that touched only docs builds nothing (docs/release.md).
- name: release
  steps:
  # One SHA256SUMS over every file, published beside them: `sha256sum -c SHA256SUMS` in the download folder.
  - type: CommandStep
    name: checksums
    runInContainer: true
    image: alpine:3
    interpreter:
      type: DefaultInterpreter
      commands: |
        set -e
        cd dist/release
        sha256sum -- * > /tmp/SHA256SUMS
        mv /tmp/SHA256SUMS SHA256SUMS
        cat SHA256SUMS
    runAs: 0:0
    useTTY: false
    condition: SUCCESSFUL
    optional: false
  - type: PublishArtifactStep
    name: publish every file
    artifacts: dist/release/*
    condition: SUCCESSFUL
    optional: false
  triggers:
  - type: BranchUpdateTrigger
    branches: main
    paths: engine/** apps/** packages/** commons package-lock.json .onedev-buildspec.yml
    userMatch: anyone
  - type: TagCreateTrigger
    tags: v*
  jobDependencies:
  - jobName: engine windows
    requireSuccessful: true
    artifacts: dist/release/*
  - jobName: android
    requireSuccessful: true
    artifacts: dist/release/*
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 600
# The files "release" gathered, sent to k7.rocks/app_downloads by the script GitHub's release.yml runs
# (.github/scripts/publish-app-release.sh): one PUT per file, then publish switches the stamp's channel at once
# (docs/app-downloads.md). Its dependency is the "release" build of THIS build's commit, which OneDev reuses when
# the push or the tag already started it; a hand-run republishes its commit. No macOS or Linux leg runs here, so a
# build sent from OneDev carries the Windows engine and the APK only, and it is not sent over the same stamp's
# build already served, which GitHub's is when it got there first.
# The token is the project's job secret app-release-token, the value of the server's APP_RELEASE_TOKEN.
- name: publish on /app_downloads
  steps:
  - type: CheckoutStep
    name: checkout
    cloneCredential:
      type: HttpCredential
      accessTokenSecret: submodule-token
    withLfs: false
    withSubmodules: false
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: upload and publish
    runInContainer: true
    image: alpine:3
    interpreter:
      type: DefaultInterpreter
      commands: |
        set -e
        apk add --no-cache bash curl coreutils > /dev/null
        # The stamp the APK was named with, the tag on a tag and snapshot-<commit> on main, as GitHub's.
        APK=$(ls dist/release/k7-android_*_arm64.apk | head -1)
        STAMP=$(basename "$APK" | sed 's/^k7-android_//; s/_arm64\.apk$//')
        # A publish replaces its stamp's whole folder: GitHub's build of this commit, with every platform, stays.
        case "$STAMP" in v*) CHANNEL=release ;; *) CHANNEL=snapshot ;; esac
        SERVED=$(curl -fsS --max-time 20 "https://app.k7.rocks/app_downloads/$CHANNEL.json" | grep -o '"stamp":"[^"]*"' || true)
        if [ "$SERVED" = "\"stamp\":\"$STAMP\"" ]; then
          echo "$STAMP is published already - the page keeps that build"
          exit 0
        fi
        echo "publishing $STAMP:"
        ls dist/release
        APP_RELEASE_TOKEN="@secret:app-release-token@" bash .github/scripts/publish-app-release.sh \
          https://app.k7.rocks/api/app-releases "$STAMP" dist/release
    runAs: 0:0
    useTTY: false
    condition: SUCCESSFUL
    optional: false
  triggers:
  - type: BranchUpdateTrigger
    branches: main
    paths: engine/** apps/** packages/** commons package-lock.json .onedev-buildspec.yml
    userMatch: anyone
  - type: TagCreateTrigger
    tags: v*
  jobDependencies:
  - jobName: release
    requireSuccessful: true
    artifacts: dist/release/*
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 1800
# On every push to main: cancels the builds of older commits still waiting or running, as GitHub's
# cancel-in-progress does. The engine build is long, and a superseded one would hold the Windows agent for
# nothing. The token is the project's job secret onedev-api-token: an access token of a user who may run k7's jobs.
- name: cancel superseded builds
  steps:
  - type: CommandStep
    name: cancel older builds of main
    runInContainer: true
    image: alpine:3
    interpreter:
      type: DefaultInterpreter
      commands: |
        set -e
        apk add --no-cache curl jq > /dev/null
        API="@server_url@/~api"
        TOKEN="@secret:onedev-api-token@"
        QUERY='"Project" is "@project_path@" and "Branch" is "main" and (running or pending or waiting)'
        curl -fsS -G -H "Authorization: Bearer $TOKEN" --data-urlencode "query=$QUERY" -d offset=0 -d count=100 "$API/builds" > builds.json
        # Older pushes only: a lower number and another commit, so this push's builds and any newer one's stay.
        jq -r --argjson n "@build_number@" --arg c "@commit_hash@" \
          '.[] | select(.number < $n and .commitHash != $c) | "\(.id) #\(.number) \(.jobName)"' builds.json |
        while read -r id what; do
          echo "cancelling $what"
          curl -fsS -X DELETE -H "Authorization: Bearer $TOKEN" "$API/job-runs/$id"
        done
    runAs: 0:0
    useTTY: false
    condition: SUCCESSFUL
    optional: false
  triggers:
  - type: BranchUpdateTrigger
    branches: main
    userMatch: anyone
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 600
