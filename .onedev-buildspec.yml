version: 47
jobs:
# Runs WHILE "build studio images" builds; "publish studio images" waits for both — docs/images.md.
- name: lint and test
  steps:
  - type: CheckoutStep
    name: checkout
    cloneCredential:
      type: HttpCredential
      accessTokenSecret: submodule-token
    withLfs: false
    withSubmodules: true
    condition: SUCCESSFUL
    optional: false
  - type: SetupCacheStep
    name: set up npm cache
    key: npm-cache
    paths:
    - /root/.npm
    uploadStrategy: UPLOAD_IF_CHANGED
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: lint and test
    runInContainer: true
    image: node:22-alpine
    interpreter:
      type: DefaultInterpreter
      commands: |
        # Without it sh answers with the LAST command's status, and an earlier failure passes.
        set -e
        # No C toolchain: ssh2's crypto binding is optional, and node-pty is out of the workspace (docs/remote.md).
        apk add --no-cache git ffmpeg
        # 14s from the npm cache above; a cached node_modules (1.2 GB) would cost more to move than that.
        npm ci
        # The four checks at once, each one's output grouped, and red if any one is — docs/tests.md.
        npx concurrently --group --names lint,bytes,typecheck,test \
          "npm run lint" "npm run lint:bytes" "npm run typecheck -- --jobs 2" "npm run test -- --jobs 4"
    runAs: 0:0
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  triggers:
  - type: BranchUpdateTrigger
    branches: main
    userMatch: anyone
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 3600
# No trigger of its own: "publish studio images" runs it beside "lint and test". It pushes only the
# commit's tag, which nothing deploys; :latest and the version stamp wait for the tests.
- name: build studio images
  steps:
  - type: CheckoutStep
    name: checkout
    cloneCredential:
      type: HttpCredential
      accessTokenSecret: submodule-token
    withLfs: false
    withSubmodules: true
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: compute build version
    runInContainer: true
    image: node:22-alpine
    interpreter:
      type: DefaultInterpreter
      commands: |
        # YY.MMDDHHmm in Europe/Paris — becomes the image tag and the stamp every
        # SPA header shows. Falls back to UTC if the image lacks timezone data.
        node -e "const f=t=>new Date().toLocaleString('sv-SE',{timeZone:t});let d;try{d=f('Europe/Paris')}catch{d=f('UTC')}process.stdout.write(d.slice(2,4)+'.'+d.slice(5,7)+d.slice(8,10)+d.slice(11,13)+d.slice(14,16))" > build_version
    runAs: 1000:1000
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: SetBuildVersionStep
    name: set build version
    buildVersion: '@file:build_version@'
    condition: SUCCESSFUL
    optional: false
  # The publish job tags with this same stamp, the one baked into the SPAs.
  - type: PublishArtifactStep
    name: publish build version
    artifacts: build_version
    condition: SUCCESSFUL
    optional: false
  # One image: k7, the media library and the rehearsal recorder included. It keeps its layers in
  # the registry (cache:k7), so a fresh builder still finds the installs — docs/images.md.
  - type: BuildImageStep
    name: build and push k7 image
    buildPath: .
    dockerfile: apps/k7/docker/Dockerfile
    output:
      type: RegistryOutput
      tags: dev.frediver.se/frediverse/k7/k7:@commit_hash@
    moreOptions: --build-arg APP_VERSION=@build_version@ --cache-from type=registry,ref=dev.frediver.se/frediverse/k7/cache:k7 --cache-to type=registry,ref=dev.frediver.se/frediverse/k7/cache:k7,mode=max,image-manifest=true,oci-mediatypes=true
    condition: SUCCESSFUL
    optional: false
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 3600
# The server's engine (engine/docker/Dockerfile): a job of its own, because a cold build compiles
# Tracktion, JUCE and Faust and outlasts the k7 image's hour. Its layers are kept in cache:k7-runtime,
# so a push that touches no native source finds the compile in the cache — docs/server-engine.md.
- name: build engine image
  steps:
  - type: CheckoutStep
    name: checkout
    cloneCredential:
      type: HttpCredential
      accessTokenSecret: submodule-token
    withLfs: false
    withSubmodules: false
    condition: SUCCESSFUL
    optional: false
  - type: BuildImageStep
    name: build and push k7-runtime image
    buildPath: .
    dockerfile: engine/docker/Dockerfile
    output:
      type: RegistryOutput
      tags: dev.frediver.se/frediverse/k7/k7-runtime:@commit_hash@
    moreOptions: --cache-from type=registry,ref=dev.frediver.se/frediverse/k7/cache:k7-runtime --cache-to type=registry,ref=dev.frediver.se/frediverse/k7/cache:k7-runtime,mode=max,image-manifest=true,oci-mediatypes=true
    condition: SUCCESSFUL
    optional: false
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 10800
# What a deployment pulls: the commit's k7 and engine images, tagged :latest and with its stamp once
# the tests pass. imagetools copies a manifest within the registry, so nothing is built or pulled here.
- name: publish studio images
  steps:
  - type: SetBuildVersionStep
    name: set build version
    buildVersion: '@file:build_version@'
    condition: SUCCESSFUL
    optional: false
  - type: RunImagetoolsStep
    name: tag k7 image
    arguments: create -t dev.frediver.se/frediverse/k7/k7:latest -t dev.frediver.se/frediverse/k7/k7:@build_version@ dev.frediver.se/frediverse/k7/k7:@commit_hash@
    condition: SUCCESSFUL
    optional: false
  - type: RunImagetoolsStep
    name: tag k7-runtime image
    arguments: create -t dev.frediver.se/frediverse/k7/k7-runtime:latest -t dev.frediver.se/frediverse/k7/k7-runtime:@build_version@ dev.frediver.se/frediverse/k7/k7-runtime:@commit_hash@
    condition: SUCCESSFUL
    optional: false
  triggers:
  - type: BranchUpdateTrigger
    branches: main
    userMatch: anyone
  jobDependencies:
  - jobName: lint and test
    requireSuccessful: true
  - jobName: build studio images
    requireSuccessful: true
    artifacts: build_version
  - jobName: build engine image
    requireSuccessful: true
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 1800
# Manual-only (no triggers): a cheap, fast stand-in for the desktop build's real archive —
# run this from the OneDev UI BEFORE the first "engine linux" to find a too-low upload limit
# in seconds rather than after a 30+ minute compile. Raise PROBE_MB and re-run if it passes
# at 250 but the real archive turns out bigger; check both OneDev's own Administration ->
# Performance Settings and any reverse proxy in front of it (nginx's client_max_body_size)
# if it is refused.
- name: check artifact upload size (probe)
  steps:
  - type: CommandStep
    name: probe size
    runInContainer: true
    image: alpine:3
    interpreter:
      type: DefaultInterpreter
      commands: |
        dd if=/dev/zero of=probe.bin bs=1M count=${PROBE_MB:-250}
    runAs: 0:0
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: PublishArtifactStep
    name: publish probe
    artifacts: probe.bin
    condition: SUCCESSFUL
    optional: false
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 600
# The release graph, as .github/workflows/desktop.yml draws it (docs/desktop-release.md): per platform an
# ENGINE job — engine/k7-runtime and engine/k7-supervisor compiled and archived as the command-line
# engine — then a DESKTOP job packaging apps/k7-standalone around that archive, compiling nothing, and
# run only when its own engine built; beside them the APK; and "release", which the triggers name and
# which gathers every file into one build. A failed platform skips its own desktop job and nothing else. The
# engines and the APK wait for "lint and test": they share its machine, and three C++ compiles beside it time it out.
- name: engine linux
  steps:
  - type: CheckoutStep
    name: checkout
    cloneCredential:
      type: HttpCredential
      accessTokenSecret: submodule-token
    withLfs: false
    withSubmodules: true
    condition: SUCCESSFUL
    optional: false
  - type: SetupCacheStep
    name: set up npm cache
    key: npm-cache
    paths:
    - /root/.npm
    uploadStrategy: UPLOAD_IF_CHANGED
    condition: SUCCESSFUL
    optional: false
  # Every C/C++ object (JUCE, Tracktion, Faust, NAM, the supervisor's TLS and WebRTC stacks) through ccache.
  - type: SetupCacheStep
    name: set up ccache
    key: ccache-linux
    paths:
    - /root/.ccache
    uploadStrategy: UPLOAD_IF_CHANGED
    condition: SUCCESSFUL
    optional: false
  # The dependency SOURCES, kept in STUDIO_FETCHCONTENT_DIR so a run clones nothing; what gets built there is deleted at exit.
  - type: SetupCacheStep
    name: set up dependency sources cache
    key: fetch-linux
    paths:
    - /root/.cache/k7-fetch
    uploadStrategy: UPLOAD_IF_CHANGED
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: build the engine
    runInContainer: true
    image: node:22-bookworm
    interpreter:
      type: DefaultInterpreter
      commands: |
        # Any failing command fails the step: sh otherwise answers with the LAST command's status.
        set -e
        git config --global --add safe.directory '*'
        # JUCE's ALSA/JACK/X11 set, and the toolchain a bare node image carries none of.
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y --no-install-recommends \
          build-essential cmake ninja-build ccache git curl ca-certificates pkg-config python3 \
          libssl-dev \
          libasound2-dev libjack-jackd2-dev libfreetype6-dev libfontconfig1-dev \
          libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
          libxrandr-dev libxrender-dev libglu1-mesa-dev mesa-common-dev \
          libcurl4-openssl-dev ladspa-sdk

        # The presets read the launcher from STUDIO_COMPILER_LAUNCHER (docs/desktop-release.md).
        export STUDIO_COMPILER_LAUNCHER=ccache
        export STUDIO_FETCHCONTENT_DIR=/root/.cache/k7-fetch
        trap 'find "$STUDIO_FETCHCONTENT_DIR" -mindepth 2 -maxdepth 2 -type d -name "*-build" -exec rm -rf {} +; rm -rf "$STUDIO_FETCHCONTENT_DIR"/k7-runtime/faust-src/build/lib' EXIT
        # BASEDIR and NOHASHDIR keep a hit from depending on where the workspace is.
        export CCACHE_DIR=/root/.ccache CCACHE_BASEDIR="$PWD" CCACHE_NOHASHDIR=true CCACHE_MAXSIZE=4G
        ccache --zero-stats
        npm ci
        # The release's name, as GitHub's names it: the tag on a tag, snapshot-<commit> on main.
        STAMP=$(git describe --tags --exact-match --match 'v*' 2>/dev/null || echo "snapshot-$(git rev-parse --short HEAD)")
        STUDIO_ENGINE_PRESET=release-gcc STUDIO_SUPERVISOR_PRESET=release-gcc node engine/scripts/build-engine.mjs
        node engine/scripts/package-release.mjs --kind engine --stamp "$STAMP"
        ccache --show-stats
    runAs: 0:0
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: PublishArtifactStep
    name: publish the engine archive
    artifacts: dist/release/k7-runtime_*
    condition: SUCCESSFUL
    optional: false
  jobDependencies:
  - jobName: lint and test
    requireSuccessful: true
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 5400
- name: desktop linux
  steps:
  - type: CheckoutStep
    name: checkout
    cloneCredential:
      type: HttpCredential
      accessTokenSecret: submodule-token
    withLfs: false
    withSubmodules: true
    condition: SUCCESSFUL
    optional: false
  - type: SetupCacheStep
    name: set up npm cache
    key: npm-cache
    paths:
    - /root/.npm
    uploadStrategy: UPLOAD_IF_CHANGED
    condition: SUCCESSFUL
    optional: false
  # The Electron runtime and electron-builder's tools (appimagetool), which the packaging downloads.
  - type: SetupCacheStep
    name: set up electron cache
    key: electron-linux
    paths:
    - /root/.cache/electron
    - /root/.cache/electron-builder
    uploadStrategy: UPLOAD_IF_CHANGED
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: package the desktop app
    runInContainer: true
    image: node:22-bookworm
    interpreter:
      type: DefaultInterpreter
      commands: |
        set -e
        git config --global --add safe.directory '*'
        npm ci
        # The engine job's archive, retrieved by the dependency below, unpacked where stageEngine takes it from.
        mkdir -p /tmp/engine
        tar -xzf dist/release/k7-runtime_*.tar.gz -C /tmp/engine
        export STUDIO_PREBUILT_BIN=/tmp/engine/k7-runtime
        # The release's name, as GitHub's names it: the tag on a tag, snapshot-<commit> on main.
        STAMP=$(git describe --tags --exact-match --match 'v*' 2>/dev/null || echo "snapshot-$(git rev-parse --short HEAD)")
        npm run package --workspace k7-standalone
        node engine/scripts/package-release.mjs --kind desktop --stamp "$STAMP"
    runAs: 0:0
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: PublishArtifactStep
    name: publish the AppImage
    artifacts: dist/release/*.AppImage
    condition: SUCCESSFUL
    optional: false
  jobDependencies:
  - jobName: engine linux
    requireSuccessful: true
    artifacts: dist/release/k7-runtime_*
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 3600
# The phone: engine/k7-android's debug-signed APK — the engine as libk7runtime.so, built by its android-arm64
# preset, with the supervisor and the Capacitor page (web/) — as GitHub's android job builds it. Gradle builds the
# engine itself with the SDK's pinned NDK (engine/k7-runtime/docs/android.md). The SDK is fetched and pinned like
# every other dependency, in a cache keyed by its versions, so a bump of any of them is a new key.
- name: android
  steps:
  - type: CheckoutStep
    name: checkout
    cloneCredential:
      type: HttpCredential
      accessTokenSecret: submodule-token
    withLfs: false
    withSubmodules: true
    condition: SUCCESSFUL
    optional: false
  - type: SetupCacheStep
    name: set up android sdk cache
    key: android-sdk-cmdline23.0-platform36-build36.0.0-ndk29.0.14206865
    paths:
    - /opt/android-sdk
    uploadStrategy: UPLOAD_IF_CHANGED
    condition: SUCCESSFUL
    optional: false
  - type: SetupCacheStep
    name: set up gradle cache
    key: gradle-cache
    paths:
    - /root/.gradle
    uploadStrategy: UPLOAD_IF_CHANGED
    condition: SUCCESSFUL
    optional: false
  # Its own key, never the linux job's: the same sources compile to arm64 objects here.
  - type: SetupCacheStep
    name: set up ccache
    key: ccache-android
    paths:
    - /root/.ccache
    uploadStrategy: UPLOAD_IF_CHANGED
    condition: SUCCESSFUL
    optional: false
  # The dependency SOURCES — Tracktion and JUCE, Faust, Eigen, NAM, QuickJS, the supervisor's stacks —
  # kept in STUDIO_FETCHCONTENT_DIR, so a run clones nothing; what gets built there is deleted at exit.
  - type: SetupCacheStep
    name: set up dependency sources cache
    key: fetch-android
    paths:
    - /root/.cache/k7-fetch
    uploadStrategy: UPLOAD_IF_CHANGED
    condition: SUCCESSFUL
    optional: false
  - type: SetupCacheStep
    name: set up debug signing key
    key: android-debug-keystore
    paths:
    - /root/.android-user
    uploadStrategy: UPLOAD_IF_CHANGED
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: build apk
    runInContainer: true
    # trixie, not bookworm: it carries JDK 21, which the command-line tools and AGP run on.
    image: node:22-trixie
    interpreter:
      type: DefaultInterpreter
      commands: |
        git config --global --add safe.directory '*'

        set -e
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        # The C++ toolchain and the X11 and font headers are for the HOST half of the build: JUCE
        # compiles juceaide, its GUI module included, for the machine running the build, whatever the target.
        apt-get install -y --no-install-recommends \
          openjdk-21-jdk-headless build-essential cmake ninja-build ccache pkg-config \
          git curl ca-certificates unzip \
          libfreetype-dev libfontconfig-dev libx11-dev libxcomposite-dev libxcursor-dev \
          libxext-dev libxinerama-dev libxrandr-dev libxrender-dev

        # Gradle hands its environment to the engine's CMake, whose presets read this, so it reaches the NDK's clang too.
        export STUDIO_COMPILER_LAUNCHER=ccache
        # The fetch cache keeps SOURCES only, however the build ends: what CMake built inside it is per preset.
        export STUDIO_FETCHCONTENT_DIR=/root/.cache/k7-fetch
        trap 'find "$STUDIO_FETCHCONTENT_DIR" -mindepth 2 -maxdepth 2 -type d -name "*-build" -exec rm -rf {} +; rm -rf "$STUDIO_FETCHCONTENT_DIR"/k7-runtime/faust-src/build/lib' EXIT
        export CCACHE_DIR=/root/.ccache CCACHE_BASEDIR="$PWD" CCACHE_NOHASHDIR=true CCACHE_MAXSIZE=3G
        ccache --zero-stats

        # A UTF-8 locale for the JVM: without one Gradle reads file names as ASCII and loses k7-core's µcomputer.fxp.
        export LANG=C.UTF-8 LC_ALL=C.UTF-8
        export ANDROID_HOME=/opt/android-sdk
        SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
        if [ ! -x "$SDKMANAGER" ]; then
          curl -sfL -o /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip
          echo "0877a1d048fe4a24efe2eff536ca4223f7adeb58648bb81909d33c446918cfa8  /tmp/cmdline-tools.zip" \
            | sha256sum -c -
          rm -rf /tmp/cmdline-tools && unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          mv /tmp/cmdline-tools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
        fi
        yes | "$SDKMANAGER" --licenses > /dev/null
        # The versions engine/k7-android/app/build.gradle.kts names: compileSdk and ndkVersion.
        "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"

        # The release's name, as GitHub's names it: the tag on a tag, snapshot-<commit> on main.
        STAMP=$(git describe --tags --exact-match --match 'v*' 2>/dev/null || echo "snapshot-$(git rev-parse --short HEAD)")

        # The app's page (engine/k7-android/web) is a workspace, and Capacitor's Android runtime,
        # which settings.gradle.kts includes, is one of its packages: both come from the root install.
        npm ci

        cd engine/k7-android
        # One debug key across runs (the cache above): Android refuses an update signed by another.
        export ANDROID_USER_HOME=/root/.android-user
        mkdir -p "$ANDROID_USER_HOME"
        ./gradlew --no-daemon assembleDebug
        mkdir -p ../../dist/release
        cp app/build/outputs/apk/debug/app-debug.apk "../../dist/release/k7-android_${STAMP}_arm64.apk"
        ccache --show-stats
    runAs: 0:0
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: PublishArtifactStep
    name: publish android apk
    artifacts: dist/release/*.apk
    condition: SUCCESSFUL
    optional: false
  jobDependencies:
  - jobName: lint and test
    requireSuccessful: true
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 5400
# The Windows pair, on the Windows AGENT — a Remote Shell Executor, so no container: the steps run in cmd on the
# machine itself, with what it has installed (Node, Git, CMake, Ninja, Visual Studio Build Tools). Neither job names
# an executor: the shell executor whose JOB MATCH takes them runs them, on an agent its AGENT SELECTOR picks by OS
# (docs/desktop-release.md). cmd does not stop on a failing line, so every command carries its own `|| exit /b 1`,
# and npm is `call`ed because it is npm.cmd. commons by hand: the checkout takes no submodule.
- name: engine windows
  steps:
  - type: CheckoutStep
    name: checkout
    cloneCredential:
      type: HttpCredential
      accessTokenSecret: submodule-token
    withLfs: false
    withSubmodules: false
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: build the engine
    runInContainer: false
    interpreter:
      type: DefaultInterpreter
      commands: |
        rem The dependency SOURCES stay on the agent's disk; what the last run BUILT there goes first, cmd having no trap.
        if not defined STUDIO_FETCHCONTENT_DIR set "STUDIO_FETCHCONTENT_DIR=%LOCALAPPDATA%\k7-ci\fetch"
        for /d %%P in ("%STUDIO_FETCHCONTENT_DIR%\*") do for /d %%B in ("%%P\*-build") do rmdir /s /q "%%B"
        if exist "%STUDIO_FETCHCONTENT_DIR%\k7-runtime\faust-src\build\lib" rmdir /s /q "%STUDIO_FETCHCONTENT_DIR%\k7-runtime\faust-src\build\lib"
        git config core.longpaths true || exit /b 1
        git -c "http.extraHeader=OneDevAuthorization: Bearer @secret:submodule-token@" submodule update --init commons || exit /b 1
        call npm ci || exit /b 1
        git describe --tags --exact-match --match "v*" > build_version 2>nul || (for /f %%H in ('git rev-parse --short HEAD') do echo snapshot-%%H> build_version)
        set /p STUDIO_RELEASE_STAMP=<build_version
        node engine/scripts/build-engine.mjs || exit /b 1
        node engine/scripts/package-release.mjs --kind engine || exit /b 1
    useTTY: false
    condition: SUCCESSFUL
    optional: false
  - type: PublishArtifactStep
    name: publish the engine archive
    artifacts: dist/release/k7-runtime_*
    condition: SUCCESSFUL
    optional: false
  jobDependencies:
  - jobName: lint and test
    requireSuccessful: true
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 7200
- name: desktop windows
  steps:
  - type: CheckoutStep
    name: checkout
    cloneCredential:
      type: HttpCredential
      accessTokenSecret: submodule-token
    withLfs: false
    withSubmodules: false
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: package the desktop app
    runInContainer: false
    interpreter:
      type: DefaultInterpreter
      commands: |
        git config core.longpaths true || exit /b 1
        git -c "http.extraHeader=OneDevAuthorization: Bearer @secret:submodule-token@" submodule update --init commons || exit /b 1
        call npm ci || exit /b 1
        git describe --tags --exact-match --match "v*" > build_version 2>nul || (for /f %%H in ('git rev-parse --short HEAD') do echo snapshot-%%H> build_version)
        set /p STUDIO_RELEASE_STAMP=<build_version
        rem The engine job's archive, retrieved by the dependency below; System32's tar reads a .zip.
        if exist "%TEMP%\k7-runtime-bin" rmdir /s /q "%TEMP%\k7-runtime-bin"
        mkdir "%TEMP%\k7-runtime-bin" || exit /b 1
        for %%A in (dist\release\k7-runtime_*.zip) do "%SystemRoot%\System32\tar.exe" -xf "%%A" -C "%TEMP%\k7-runtime-bin" || exit /b 1
        set "STUDIO_PREBUILT_BIN=%TEMP%\k7-runtime-bin\k7-runtime"
        call npm run package --workspace k7-standalone || exit /b 1
        node engine/scripts/package-release.mjs --kind desktop || exit /b 1
    useTTY: false
    condition: SUCCESSFUL
    optional: false
  - type: PublishArtifactStep
    name: publish the installer
    artifacts: dist/release/*.exe
    condition: SUCCESSFUL
    optional: false
  jobDependencies:
  - jobName: engine windows
    requireSuccessful: true
    artifacts: dist/release/k7-runtime_*
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 3600
# The macOS pair, for a Mac AGENT behind a Remote Shell Executor, as Windows has: the agent brings Xcode's command-line
# tools, Node, CMake and Ninja (`brew install cmake ninja`), and ccache when it has one. MANUAL until that agent
# exists: a job no executor takes waits forever, and "release" would wait with it. With the agent in place, add both
# to "release"'s dependencies (docs/desktop-release.md).
- name: engine macos
  steps:
  - type: CheckoutStep
    name: checkout
    cloneCredential:
      type: HttpCredential
      accessTokenSecret: submodule-token
    withLfs: false
    withSubmodules: true
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: build the engine
    runInContainer: false
    interpreter:
      type: DefaultInterpreter
      commands: |
        set -e
        # The dependency SOURCES stay on the agent's disk; what the last run BUILT there goes first.
        export STUDIO_FETCHCONTENT_DIR="${STUDIO_FETCHCONTENT_DIR:-$HOME/Library/Caches/k7-ci/fetch}"
        find "$STUDIO_FETCHCONTENT_DIR" -mindepth 2 -maxdepth 2 -type d -name "*-build" -exec rm -rf {} + 2>/dev/null || true
        rm -rf "$STUDIO_FETCHCONTENT_DIR"/k7-runtime/faust-src/build/lib
        if command -v ccache >/dev/null; then export STUDIO_COMPILER_LAUNCHER=ccache CCACHE_BASEDIR="$PWD" CCACHE_NOHASHDIR=true; fi
        npm ci
        STAMP=$(git describe --tags --exact-match --match 'v*' 2>/dev/null || echo "snapshot-$(git rev-parse --short HEAD)")
        STUDIO_ENGINE_PRESET=macos-clang STUDIO_SUPERVISOR_PRESET=macos-clang node engine/scripts/build-engine.mjs
        node engine/scripts/package-release.mjs --kind engine --stamp "$STAMP"
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: PublishArtifactStep
    name: publish the engine archive
    artifacts: dist/release/k7-runtime_*
    condition: SUCCESSFUL
    optional: false
  jobDependencies:
  - jobName: lint and test
    requireSuccessful: true
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 5400
- name: desktop macos
  steps:
  - type: CheckoutStep
    name: checkout
    cloneCredential:
      type: HttpCredential
      accessTokenSecret: submodule-token
    withLfs: false
    withSubmodules: true
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: package the desktop app
    runInContainer: false
    interpreter:
      type: DefaultInterpreter
      commands: |
        set -e
        npm ci
        engine="$(mktemp -d)"
        tar -xzf dist/release/k7-runtime_*.tar.gz -C "$engine"
        export STUDIO_PREBUILT_BIN="$engine/k7-runtime"
        STAMP=$(git describe --tags --exact-match --match 'v*' 2>/dev/null || echo "snapshot-$(git rev-parse --short HEAD)")
        npm run package --workspace k7-standalone
        node engine/scripts/package-release.mjs --kind desktop --stamp "$STAMP"
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: PublishArtifactStep
    name: publish the dmg
    artifacts: dist/release/*.dmg
    condition: SUCCESSFUL
    optional: false
  jobDependencies:
  - jobName: engine macos
    requireSuccessful: true
    artifacts: dist/release/k7-runtime_*
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 3600
# What a push or a tag starts: every platform's two jobs and the APK, run through the dependencies below, and their
# files gathered into this one build — OneDev's release page. Red when any of them is. The paths are GitHub's gate:
# a push that touched only docs builds nothing (docs/desktop-release.md).
- name: release
  steps:
  - type: PublishArtifactStep
    name: publish every file
    artifacts: dist/release/*
    condition: SUCCESSFUL
    optional: false
  triggers:
  - type: BranchUpdateTrigger
    branches: main
    paths: engine/** apps/** packages/** commons package-lock.json .onedev-buildspec.yml
    userMatch: anyone
  - type: TagCreateTrigger
    tags: v*
  jobDependencies:
  - jobName: engine linux
    requireSuccessful: true
    artifacts: dist/release/*
  - jobName: desktop linux
    requireSuccessful: true
    artifacts: dist/release/*
  - jobName: engine windows
    requireSuccessful: true
    artifacts: dist/release/*
  - jobName: desktop windows
    requireSuccessful: true
    artifacts: dist/release/*
  - jobName: android
    requireSuccessful: true
    artifacts: dist/release/*
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 600
