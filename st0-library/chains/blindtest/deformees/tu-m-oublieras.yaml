# Déformées — Tu m'oublieras — les effets de la question, en chaîne. Le sidecar du morceau la nomme comme
# variante ; l'ordre des modules et la correspondance des valeurs sont dans
# apps/z0/docs/effects.md du dépôt studio.

steps:
  - id: de72e8eb-75a7-450e-88ed-2067a5bfb267
    extends: "@st0/audio/zz_utility/pitch-shift"
    params:
      "semitones up": -12
  - id: 1656c284-716c-45d1-86b8-ecd29bade1f8
    extends: "@st0/audio/bitcrush"
    engine: de-rez
    engines:
      de-rez:
        params:
          Rez: 0.269
          Rate: 1
  - id: f9988e17-0742-4713-975c-2ac1c3309df6
    extends: "@st0/audio/chorus"
    # The one-knob chorus the blind test was tuned on, not the module's default.
    engine: one-knob
    engines:
      one-knob:
        params:
          Amount: 54
  - to: [ { chain: "@out" } ]
