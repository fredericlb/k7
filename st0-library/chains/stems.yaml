# Stems — découper un morceau en batterie, basse, reste et voix.
#
# Un seul pas, comme `process/normalize` à côté : une entrée, un module, une sortie. Ce que celle-ci
# a de différent est que son module est OFFLINE — il ne produit pas un signal mais quatre FICHIERS,
# écrits dans `stems/` à côté de la source. La passe tourne avant le rendu, jamais pendant.
#
# C'est la chaîne qu'on nomme dans :
#   • `playlist stems <playlist> @st0/stems`      — préparer toute une set list, la veille
#   • le `stems:` d'une surface `turntables`      — rattraper un disque posé non préparé
#   • `clip process <clip> @st0/stems`            — un seul fichier
#
# Elle ne peut pas contenir un second pas qui TRAITE : aplatie pour un rendu, une chaîne est une
# liste de noms sans ports, donc rien ne dirait lequel des quatre stems le pas suivant reprend.
# `resolveChain` le refuse par son nom. Une chaîne sépare ou elle traite.

steps:
  - id: 2980a2fd-0e79-42fe-ba6a-c2c28e95d147
    # Le séparateur de la médiathèque, sans réglage : ce module n'a pas de potard, sa seule
    # « valeur » est le MODÈLE, et celui-là est déclaré par le module lui-même (`onnx:`) parce que
    # 166 Mo ne voyagent pas dans un fork. Les octets sont dans ~/.studio/models sur la machine qui
    # calcule ; si elle ne les a pas, la chaîne est refusée avant qu'une seconde ne soit dépensée.
    extends: "@st0/cold/stemsplit"
  - to: [ { chain: "@out" } ]
