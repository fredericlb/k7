# naked-drums-room — an SFZ kit of st0-rack: Naked Drums again (Wilkinson Audio, CC BY 4.0), through its FULL stereo
# program, which adds the close room, far rooms and mid-side mics to the close mics and overheads the General MIDI
# one plays. A bigger, longer kit: the kick rings 2.3 s instead of 1.7, the cymbals 3 dB up. Same samples, ~1.2 GB.
#
# Its own notes, not General MIDI's for the cymbals and hats: kick 36, side-stick 37, snare 38/40, toms 48 47 45 43 41,
# hi-hat 39 (tight) 42 (closed) 44 (pedal) 46 (half) 49 (open), ride 51 (bell 53), crash 55 and 57 (bells 58 59),
# splash 54 and 56, china 50 and 52. The second splash and china are this program's alone.
extends: "@engine/sfz-player"
params:
  sfz: "@instruments/naked-drums/Wilkinson Audio/Naked Drums/Stereo/Naked Drums.sfz"
  # Its loudest hit at full velocity, the snare, peaks at 0 dBFS — the level a rack's normalised samples play at.
  Volume: 2.1
# The pads its panel draws, on the notes this program plays them on.
kit:
  Kick: 36
  SideStick: 37
  Snare: 38
  HatTight: 39
  Snare2: 40
  Tom5: 41
  HatClosed: 42
  Tom4: 43
  HatPedal: 44
  Tom3: 45
  HatHalf: 46
  Tom2: 47
  Tom1: 48
  HatOpen: 49
  China1: 50
  RideBow: 51
  China2: 52
  RideBell: 53
  Splash1: 54
  Crash1: 55
  Splash2: 56
  Crash2: 57
  Crash1Bell: 58
  Crash2Bell: 59

# Naked Drums through all its microphones, close, overhead and room: the same acoustic kit, bigger and longer, on its own notes for the cymbals — Wilkinson Audio (CC BY 4.0). Its samples, about 1.2 GB, are the Naked Drums download.
