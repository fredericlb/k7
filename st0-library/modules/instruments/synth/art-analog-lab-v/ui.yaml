# panel for @st0/instruments/synth/art-analog-lab-v
cols: 16
rows: 4
widgets: {}
tabs:
  - name: PLAY
    widgets:
      macros: { type: group, col: 0, row: 0, colSpan: 4, rowSpan: 4, label: MACRO, color: "#3d7dff26" }
      m_bright: { type: knob, col: 0, row: 0, colSpan: 2, rowSpan: 2, label: Bright, bind: P1 Brightness, min: 0, max: 1 }
      m_timbre: { type: knob, col: 2, row: 0, colSpan: 2, rowSpan: 2, label: Timbre, bind: P1 Timbre, min: 0, max: 1 }
      m_time: { type: knob, col: 0, row: 2, colSpan: 2, rowSpan: 2, label: Time, bind: P1 Time, min: 0, max: 1 }
      m_move: { type: knob, col: 2, row: 2, colSpan: 2, rowSpan: 2, label: Movement, bind: P1 Movement, min: 0, max: 1 }
      parts: { type: group, col: 4, row: 0, colSpan: 6, rowSpan: 4, label: PARTS, color: "#6b6b6b33" }
      p1_on: { type: dropdown, col: 4, row: 0, colSpan: 2, label: Part 1, bind: P1 Active, options: [ { label: Off, value: 0 }, { label: On, value: 1 } ] }
      p2_on: { type: dropdown, col: 6, row: 0, colSpan: 2, label: Part 2, bind: P2 Active, options: [ { label: Off, value: 0 }, { label: On, value: 1 } ] }
      p1_vol: { type: knob, col: 4, row: 1, colSpan: 2, rowSpan: 2, label: Vol 1, bind: P1 Volume (2), min: 0, max: 1 }
      p2_vol: { type: knob, col: 6, row: 1, colSpan: 2, rowSpan: 2, label: Vol 2, bind: P2 Volume, min: 0, max: 1 }
      glide: { type: knob, col: 8, row: 1, colSpan: 2, rowSpan: 2, label: Glide, bind: P1 Portamento, min: 0, max: 1 }
      eq: { type: group, col: 10, row: 0, colSpan: 3, rowSpan: 4, label: EQ, color: "#ff3b301f" }
      eq_bass: { type: fader, col: 10, row: 0, rowSpan: 4, label: Bass, bind: Master Bass, min: 0, max: 1 }
      eq_mid: { type: fader, col: 11, row: 0, rowSpan: 4, label: Mid, bind: Master Mid, min: 0, max: 1 }
      eq_treble: { type: fader, col: 12, row: 0, rowSpan: 4, label: Treble, bind: Master Treble, min: 0, max: 1 }
  - name: SYNTH
    widgets:
      vcf: { type: group, col: 0, row: 0, colSpan: 4, rowSpan: 4, label: VCF, color: "#ff6a1a22" }
      cutoff: { type: knob, col: 0, row: 0, colSpan: 2, rowSpan: 2, label: Cutoff, bind: P1 VCF Cutoff, min: 0, max: 1 }
      res: { type: knob, col: 2, row: 0, colSpan: 2, rowSpan: 2, label: Res, bind: P1 VCF Resonance, min: 0, max: 1 }
      vcf_env: { type: knob, col: 0, row: 2, colSpan: 2, rowSpan: 2, label: Env, bind: P1 VCF Env, min: 0, max: 1 }
      vcf_lfo: { type: knob, col: 2, row: 2, colSpan: 2, rowSpan: 2, label: LFO, bind: P1 VCF LFO, min: 0, max: 1 }
      vcf_screen: { type: lcdscreen, col: 4, row: 0, colSpan: 4, rowSpan: 4 }
      env: { type: group, col: 8, row: 0, colSpan: 4, rowSpan: 4, label: ENV, color: "#3ec96b22" }
      atk: { type: knob, col: 8, row: 0, colSpan: 2, rowSpan: 2, label: Attack, bind: P1 Attack, min: 0, max: 1 }
      dec: { type: knob, col: 10, row: 0, colSpan: 2, rowSpan: 2, label: Decay, bind: P1 Decay, min: 0, max: 1 }
      sus: { type: knob, col: 8, row: 2, colSpan: 2, rowSpan: 2, label: Sustain, bind: P1 Sustain, min: 0, max: 1 }
      rel: { type: knob, col: 10, row: 2, colSpan: 2, rowSpan: 2, label: Release, bind: P1 Release, min: 0, max: 1 }
      env_screen: { type: lcdscreen, col: 12, row: 0, colSpan: 4, rowSpan: 4 }
  - name: DELAY
    widgets:
      delay: { type: group, col: 0, row: 0, colSpan: 8, rowSpan: 3, label: DELAY, color: "#ffffff14" }
      dly_on: { type: dropdown, col: 0, row: 0, colSpan: 2, label: Delay, bind: Delay Active, options: [ { label: Off, value: 0 }, { label: On, value: 1 } ] }
      dly_div: { type: dropdown, col: 2, row: 0, colSpan: 2, label: Div, bind: Delay Synced, options: [ { label: 1/32, value: 0 }, { label: 1/16.t, value: 0.041666666666666664 }, { label: 1/32.d, value: 0.08333333333333333 }, { label: 1/16, value: 0.125 }, { label: 1/8.t, value: 0.16666666666666666 }, { label: 1/16.d, value: 0.20833333333333334 }, { label: 1/8, value: 0.25 }, { label: 1/4.t, value: 0.2916666666666667 }, { label: 1/8.d, value: 0.3333333333333333 }, { label: 1/4, value: 0.375 }, { label: 1/2.t, value: 0.4166666666666667 }, { label: 1/4.d, value: 0.4583333333333333 }, { label: 1/2, value: 0.5 }, { label: 1.t, value: 0.5416666666666666 }, { label: 1/2.d, value: 0.5833333333333334 }, { label: "1", value: 0.625 }, { label: 2.t, value: 0.6666666666666666 }, { label: 1.d, value: 0.7083333333333334 }, { label: "2", value: 0.75 }, { label: 4.t, value: 0.7916666666666666 }, { label: 2.d, value: 0.8333333333333334 }, { label: "4", value: 0.875 }, { label: 8.t, value: 0.9166666666666666 }, { label: 4.d, value: 0.9583333333333334 }, { label: "8", value: 1 } ] }
      dly_p1: { type: dropdown, col: 4, row: 0, colSpan: 2, label: Send 1, bind: P1 Send Delay, options: [ { label: Off, value: 0 }, { label: On, value: 1 } ] }
      dly_p2: { type: dropdown, col: 6, row: 0, colSpan: 2, label: Send 2, bind: P2 Send Delay, options: [ { label: Off, value: 0 }, { label: On, value: 1 } ] }
      dly_time: { type: knob, col: 0, row: 1, colSpan: 2, rowSpan: 2, label: Time, bind: Delay Time, min: 0, max: 1 }
      dly_fb: { type: knob, col: 2, row: 1, colSpan: 2, rowSpan: 2, label: Fdbk, bind: Delay Feedback, min: 0, max: 1 }
      dly_width: { type: knob, col: 4, row: 1, colSpan: 2, rowSpan: 2, label: Width, bind: Delay Stereo Width, min: 0, max: 1 }
      dly_ret: { type: knob, col: 6, row: 1, colSpan: 2, rowSpan: 2, label: Return, bind: Delay Volume, min: 0, max: 1 }
      delay_screen: { type: lcdscreen, col: 8, row: 0, colSpan: 8, rowSpan: 4 }
  - name: REVERB
    widgets:
      reverb: { type: group, col: 0, row: 0, colSpan: 8, rowSpan: 3, label: REVERB, color: "#ffffff14" }
      rev_on: { type: dropdown, col: 0, row: 0, colSpan: 2, label: Reverb, bind: Reverb Active, options: [ { label: Off, value: 0 }, { label: On, value: 1 } ] }
      rev_p1: { type: dropdown, col: 2, row: 0, colSpan: 2, label: Send 1, bind: P1 Send Reverb, options: [ { label: Off, value: 0 }, { label: On, value: 1 } ] }
      rev_p2: { type: dropdown, col: 4, row: 0, colSpan: 2, label: Send 2, bind: P2 Send Reverb, options: [ { label: Off, value: 0 }, { label: On, value: 1 } ] }
      rev_decay: { type: knob, col: 0, row: 1, colSpan: 2, rowSpan: 2, label: Decay, bind: Reverb Decay, min: 0, max: 1 }
      rev_size: { type: knob, col: 2, row: 1, colSpan: 2, rowSpan: 2, label: Size, bind: Reverb Size, min: 0, max: 1 }
      rev_damp: { type: knob, col: 4, row: 1, colSpan: 2, rowSpan: 2, label: Damp, bind: Reverb Damping, min: 0, max: 1 }
      rev_ret: { type: knob, col: 6, row: 1, colSpan: 2, rowSpan: 2, label: Return, bind: Reverb Volume, min: 0, max: 1 }
      reverb_screen: { type: lcdscreen, col: 8, row: 0, colSpan: 8, rowSpan: 4 }
