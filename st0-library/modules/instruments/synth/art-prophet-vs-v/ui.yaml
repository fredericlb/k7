# prophet-vs-v — four waves mixed by the joystick, the filter; the two DADSR envelopes, the LFOs, arp and voicing, and the chorus on later pages

cols: 16
rows: 4
widgets:
  vector_screen: { type: lcdscreen, col: 0, row: 0, colSpan: 4, rowSpan: 4 }
tabs:
  - name: Voice
    widgets:
      osc: { type: group, col: 4, row: 0, colSpan: 8, rowSpan: 2, label: OSC, color: "#3d7dff26" }
      wave_a: { type: knob, col: 4, row: 0, colSpan: 2, rowSpan: 2, label: Wave A, bind: Wave Osc A WaveIndex, min: 0, max: 1 }
      wave_b: { type: knob, col: 6, row: 0, colSpan: 2, rowSpan: 2, label: Wave B, bind: Wave Osc B WaveIndex, min: 0, max: 1 }
      wave_c: { type: knob, col: 8, row: 0, colSpan: 2, rowSpan: 2, label: Wave C, bind: Wave Osc C WaveIndex, min: 0, max: 1 }
      wave_d: { type: knob, col: 10, row: 0, colSpan: 2, rowSpan: 2, label: Wave D, bind: Wave Osc D WaveIndex, min: 0, max: 1 }
      mix: { type: group, col: 12, row: 0, colSpan: 4, rowSpan: 2, label: MIX, color: "#ffffff1a" }
      joy_x: { type: knob, col: 12, row: 0, colSpan: 2, rowSpan: 2, label: Joy X, bind: Joystick X, min: 0, max: 1 }
      joy_y: { type: knob, col: 14, row: 0, colSpan: 2, rowSpan: 2, label: Joy Y, bind: Joystick Y, min: 0, max: 1 }
      filter: { type: group, col: 4, row: 2, colSpan: 6, rowSpan: 2, label: VCF, color: "#ff6a1a26" }
      cutoff: { type: knob, col: 4, row: 2, colSpan: 2, rowSpan: 2, label: Cutoff, bind: Cutoff, min: 0, max: 1 }
      resonance: { type: knob, col: 6, row: 2, colSpan: 2, rowSpan: 2, label: Res, bind: Resonance, min: 0, max: 1 }
      env_amount: { type: knob, col: 8, row: 2, colSpan: 2, rowSpan: 2, label: Env Amt, bind: Filter Envelope Amount, min: 0, max: 1 }
      env_screen: { type: lcdscreen, col: 10, row: 2, colSpan: 6, rowSpan: 2 }
  - name: Env
    widgets:
      fenv: { type: group, col: 4, row: 0, colSpan: 8, rowSpan: 2, label: FENV, color: "#ff6a1a26" }
      f_attack: { type: knob, col: 4, row: 0, colSpan: 2, rowSpan: 2, label: Attack, bind: Filter Envelope DADSR Attack, min: 0, max: 1 }
      f_decay: { type: knob, col: 6, row: 0, colSpan: 2, rowSpan: 2, label: Decay, bind: Filter Envelope DADSR Decay, min: 0, max: 1 }
      f_sustain: { type: knob, col: 8, row: 0, colSpan: 2, rowSpan: 2, label: Sustain, bind: Filter Envelope DADSR Sustain, min: 0, max: 1 }
      f_release: { type: knob, col: 10, row: 0, colSpan: 2, rowSpan: 2, label: Release, bind: Filter Envelope DADSR Release, min: 0, max: 1 }
      aenv: { type: group, col: 4, row: 2, colSpan: 8, rowSpan: 2, label: AENV, color: "#3ec96b26" }
      a_attack: { type: knob, col: 4, row: 2, colSpan: 2, rowSpan: 2, label: Attack, bind: Amp Envelope DADSR Attack, min: 0, max: 1 }
      a_decay: { type: knob, col: 6, row: 2, colSpan: 2, rowSpan: 2, label: Decay, bind: Amp Envelope DADSR Decay, min: 0, max: 1 }
      a_sustain: { type: knob, col: 8, row: 2, colSpan: 2, rowSpan: 2, label: Sustain, bind: Amp Envelope DADSR Sustain, min: 0, max: 1 }
      a_release: { type: knob, col: 10, row: 2, colSpan: 2, rowSpan: 2, label: Release, bind: Amp Envelope DADSR Release, min: 0, max: 1 }
  - name: Mod
    widgets:
      lfo1: { type: group, col: 4, row: 0, colSpan: 6, rowSpan: 2, label: LFO1, color: "#3d7dff26" }
      lfo1_rate: { type: knob, col: 4, row: 0, colSpan: 2, rowSpan: 2, label: Rate, bind: LFO1 Rate (Unsynced), min: 0, max: 1 }
      lfo1_amt: { type: knob, col: 6, row: 0, colSpan: 2, rowSpan: 2, label: Amount, bind: LFO1 Amp, min: 0, max: 1 }
      lfo1_wave: { type: dropdown, col: 8, row: 0, colSpan: 2, label: Wave, bind: LFO1 Waveform, options: [ { label: Triangle, value: 0 }, { label: Square, value: 0.2 }, { label: Sawtooth, value: 0.4 }, { label: Ramp, value: 0.6 }, { label: Random, value: 0.8 }, { label: Sine, value: 1 } ] }
      lfo1_sync: { type: dropdown, col: 8, row: 1, colSpan: 2, label: Sync, bind: LFO1 Rate Type, options: [ { label: Hertz, value: 0 }, { label: Sync, value: 0.3333333333333333 }, { label: Sync Triplets, value: 0.6666666666666666 }, { label: Sync Dotted, value: 1 } ] }
      lfo2: { type: group, col: 4, row: 2, colSpan: 6, rowSpan: 2, label: LFO2, color: "#3d7dff26" }
      lfo2_rate: { type: knob, col: 4, row: 2, colSpan: 2, rowSpan: 2, label: Rate, bind: LFO2 Rate (Unsynced), min: 0, max: 1 }
      lfo2_amt: { type: knob, col: 6, row: 2, colSpan: 2, rowSpan: 2, label: Amount, bind: LFO2 Amp, min: 0, max: 1 }
      lfo2_wave: { type: dropdown, col: 8, row: 2, colSpan: 2, label: Wave, bind: LFO2 Waveform, options: [ { label: Triangle, value: 0 }, { label: Square, value: 0.2 }, { label: Sawtooth, value: 0.4 }, { label: Ramp, value: 0.6 }, { label: Random, value: 0.8 }, { label: Sine, value: 1 } ] }
      lfo2_sync: { type: dropdown, col: 8, row: 3, colSpan: 2, label: Sync, bind: LFO2 Rate Type, options: [ { label: Hertz, value: 0 }, { label: Sync, value: 0.3333333333333333 }, { label: Sync Triplets, value: 0.6666666666666666 }, { label: Sync Dotted, value: 1 } ] }
      arp: { type: group, col: 10, row: 0, colSpan: 6, rowSpan: 2, label: ARP, color: "#ffffff1a" }
      arp_on: { type: toggle, col: 10, row: 0, colSpan: 2, label: Arp, bind: Arp ON/OFF }
      arp_mode: { type: dropdown, col: 10, row: 1, colSpan: 2, label: Mode, bind: Arp Mode, options: [ { label: Up, value: 0 }, { label: Down, value: 0.2 }, { label: Up-Down, value: 0.4 }, { label: Order, value: 0.6 }, { label: Reverse, value: 0.8 }, { label: Random, value: 1 } ] }
      arp_rate: { type: dropdown, col: 12, row: 0, colSpan: 2, label: Rate, bind: Arp Rate (Synced), options: [ { label: "1", value: 0 }, { label: 1/2, value: 0.2 }, { label: 1/4, value: 0.4 }, { label: 1/8, value: 0.6 }, { label: 1/16, value: 0.8 }, { label: 1/32, value: 1 } ] }
      arp_oct: { type: dropdown, col: 12, row: 1, colSpan: 2, label: Octaves, bind: Arp Octave Range, options: [ { label: "1", value: 0 }, { label: "2", value: 0.3333333333333333 }, { label: "3", value: 0.6666666666666666 }, { label: "4", value: 1 } ] }
      arp_gate: { type: knob, col: 14, row: 0, colSpan: 2, rowSpan: 2, label: Gate, bind: Arp Gate, min: 0, max: 1 }
      voice: { type: group, col: 10, row: 2, colSpan: 6, rowSpan: 2, label: VOICE, color: "#ff6a1a26" }
      unison: { type: toggle, col: 10, row: 2, colSpan: 2, label: Unison, bind: Unison }
      detune: { type: dropdown, col: 10, row: 3, colSpan: 2, label: Detune, bind: Unison Detune, options: [ { label: "1", value: 0 }, { label: "2", value: 0.16666666666666666 }, { label: "3", value: 0.3333333333333333 }, { label: "4", value: 0.5 }, { label: "5", value: 0.6666666666666666 }, { label: "6", value: 0.8333333333333334 }, { label: "7", value: 1 } ] }
      glide: { type: knob, col: 12, row: 2, colSpan: 2, rowSpan: 2, label: Glide, bind: Glider Time, min: 0, max: 1 }
      legato: { type: toggle, col: 14, row: 2, colSpan: 2, label: Legato, bind: Legato }
      spread: { type: number, col: 14, row: 3, colSpan: 2, label: Spread, bind: Pan Spread, min: 0, max: 1 }
  - name: FX
    widgets:
      chorus: { type: group, col: 4, row: 0, colSpan: 6, rowSpan: 2, label: CHORUS, color: "#3ec96b26" }
      chorus_on: { type: toggle, col: 4, row: 0, colSpan: 2, rowSpan: 2, label: Chorus, bind: Chorus }
      chorus_rate: { type: knob, col: 6, row: 0, colSpan: 2, rowSpan: 2, label: Rate, bind: Chorus Rate, min: 0, max: 1 }
      chorus_depth: { type: knob, col: 8, row: 0, colSpan: 2, rowSpan: 2, label: Depth, bind: Chorus Depth, min: 0, max: 1 }
      disp: { type: group, col: 4, row: 2, colSpan: 8, rowSpan: 2, label: DISP, color: "#ffffff1a" }
      disp_amp: { type: knob, col: 4, row: 2, colSpan: 2, rowSpan: 2, label: Amp, bind: Dispersion Amp Amount, min: 0, max: 1 }
      disp_cutoff: { type: knob, col: 6, row: 2, colSpan: 2, rowSpan: 2, label: Cutoff, bind: Dispersion Cutoff Amount, min: 0, max: 1 }
      disp_res: { type: knob, col: 8, row: 2, colSpan: 2, rowSpan: 2, label: Res, bind: Dispersion Resonance Amount, min: 0, max: 1 }
      disp_pan: { type: knob, col: 10, row: 2, colSpan: 2, rowSpan: 2, label: Pan, bind: Dispersion Pan Amount, min: 0, max: 1 }
      tune: { type: knob, col: 10, row: 0, colSpan: 2, rowSpan: 2, label: Tune, bind: Master Tune, min: 0, max: 1 }
