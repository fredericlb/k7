# buchla-easel-v — Buchla Easel V: modulation osc into the complex osc, two lowpass gates, the 5-step sequencer, the envelope and the pulser.
cols: 16
rows: 4
widgets: {}
tabs:
  - name: OSC
    widgets:
      modosc: { type: group, col: 0, row: 0, colSpan: 6, rowSpan: 4, label: MOD, color: "#3d7dff26" }
      mod_freq: { type: knob, col: 0, row: 0, colSpan: 2, rowSpan: 2, label: Freq, bind: Mod Osc Freq, min: 0, max: 1 }
      mod_index: { type: knob, col: 2, row: 0, colSpan: 2, rowSpan: 2, label: Index, bind: Modulation, min: 0, max: 1 }
      mod_wave: { type: dropdown, col: 4, row: 0, colSpan: 2, bind: Mod Osc Waveshape, options: [ { label: Triangle, value: 0 }, { label: Square, value: 0.5 }, { label: Sawtooth, value: 1 } ] }
      mod_mode: { type: dropdown, col: 4, row: 1, colSpan: 2, bind: Modulation Mode, options: [ { label: F.M. Osc, value: 0 }, { label: A.M. Osc, value: 0.5 }, { label: Bal Ext., value: 1 } ] }
      mod_fine: { type: knob, col: 0, row: 2, colSpan: 2, rowSpan: 2, label: Fine, bind: Mod Osc Fine, min: 0, max: 1 }
      mod_cv: { type: knob, col: 2, row: 2, colSpan: 2, rowSpan: 2, label: Freq CV, bind: Mod Osc Freq CV, min: 0, max: 1 }
      mod_range: { type: dropdown, col: 4, row: 2, colSpan: 2, bind: Mod Osc Range, options: [ { label: Low, value: 0 }, { label: High, value: 1 } ] }
      mod_kbd: { type: toggle, col: 4, row: 3, colSpan: 2, label: Keys, bind: Mod Osc Keyboard }
      comp: { type: group, col: 6, row: 0, colSpan: 6, rowSpan: 4, label: OSC, color: "#ff6a1a26" }
      pitch: { type: knob, col: 6, row: 0, colSpan: 2, rowSpan: 2, label: Pitch, bind: Comp Osc Pitch, min: 0, max: 1 }
      timbre: { type: knob, col: 8, row: 0, colSpan: 2, rowSpan: 2, label: Timbre, bind: Comp Osc Timbre, min: 0, max: 1 }
      shape: { type: knob, col: 10, row: 0, colSpan: 2, rowSpan: 2, label: Shape, bind: Comp Osc Wave Mix, min: 0, max: 1 }
      osc_screen: { type: lcdscreen, col: 6, row: 2, colSpan: 4, rowSpan: 2 }
      comp_wave: { type: dropdown, col: 10, row: 2, colSpan: 2, bind: Comp Osc Waveshape, options: [ { label: Triangle, value: 0 }, { label: Square, value: 0.5 }, { label: Impulse, value: 1 } ] }
      comp_fine: { type: number, col: 10, row: 3, colSpan: 2, label: Fine, bind: Comp Osc Fine, min: 0, max: 1 }
      gates: { type: group, col: 12, row: 0, colSpan: 4, rowSpan: 4, label: LPG, color: "#ffffff14" }
      gate1: { type: knob, col: 12, row: 0, colSpan: 2, rowSpan: 2, label: Gate 1, bind: Gate 1 Level, min: 0, max: 1 }
      gate2: { type: knob, col: 14, row: 0, colSpan: 2, rowSpan: 2, label: Gate 2, bind: Gate 2 Level, min: 0, max: 1 }
      gate1_mode: { type: dropdown, col: 12, row: 2, colSpan: 2, bind: Gate 1 Mode, options: [ { label: VCA, value: 0 }, { label: Combination, value: 0.5 }, { label: LoPassFilter, value: 1 } ] }
      gate2_mode: { type: dropdown, col: 14, row: 2, colSpan: 2, bind: Gate 2 Mode, options: [ { label: VCA, value: 0 }, { label: Combination, value: 0.5 }, { label: LoPassFilter, value: 1 } ] }
      gate1_vac: { type: dropdown, col: 12, row: 3, colSpan: 2, bind: Gate 1 Vactrol Time, options: [ { label: Fast, value: 0 }, { label: Medium, value: 0.5 }, { label: Slow, value: 1 } ] }
      gate2_vac: { type: dropdown, col: 14, row: 3, colSpan: 2, bind: Gate 2 Vactrol Time, options: [ { label: Fast, value: 0 }, { label: Medium, value: 0.5 }, { label: Slow, value: 1 } ] }
  - name: SEQ
    widgets:
      seq: { type: group, col: 0, row: 0, colSpan: 8, rowSpan: 4, label: SEQ, color: "#3ec96b26" }
      step1: { type: knob, col: 0, row: 0, colSpan: 2, rowSpan: 2, label: Step 1, bind: Seq Voltage 1, min: 0, max: 1 }
      step2: { type: knob, col: 2, row: 0, colSpan: 2, rowSpan: 2, label: Step 2, bind: Seq Voltage 2, min: 0, max: 1 }
      step3: { type: knob, col: 4, row: 0, colSpan: 2, rowSpan: 2, label: Step 3, bind: Seq Voltage 3, min: 0, max: 1 }
      step4: { type: knob, col: 6, row: 0, colSpan: 2, rowSpan: 2, label: Step 4, bind: Seq Voltage 4, min: 0, max: 1 }
      step5: { type: knob, col: 0, row: 2, colSpan: 2, rowSpan: 2, label: Step 5, bind: Seq Voltage 5, min: 0, max: 1 }
      seq_stages: { type: dropdown, col: 2, row: 2, colSpan: 2, bind: Seq Stages, options: [ { label: "5", value: 0 }, { label: "4", value: 0.5 }, { label: "3", value: 1 } ] }
      seq_trig: { type: dropdown, col: 2, row: 3, colSpan: 2, bind: Seq Trig Select, options: [ { label: Clock, value: 0 }, { label: Pulser, value: 0.5 }, { label: Keyboard, value: 1 } ] }
      seq_screen: { type: lcdscreen, col: 4, row: 2, colSpan: 4, rowSpan: 2 }
      env: { type: group, col: 8, row: 0, colSpan: 6, rowSpan: 4, label: ENV, color: "#6b6b6b33" }
      attack: { type: knob, col: 8, row: 0, colSpan: 2, rowSpan: 2, label: Attack, bind: Env Attack Rate, min: 0, max: 1 }
      sustain: { type: knob, col: 10, row: 0, colSpan: 2, rowSpan: 2, label: Sustain, bind: Env Sustain Rate, min: 0, max: 1 }
      decay: { type: knob, col: 12, row: 0, colSpan: 2, rowSpan: 2, label: Decay, bind: Env Decay Rate, min: 0, max: 1 }
      env_screen: { type: lcdscreen, col: 8, row: 2, colSpan: 4, rowSpan: 2 }
      env_mode: { type: dropdown, col: 12, row: 2, colSpan: 2, bind: Env Mode Select, options: [ { label: Self, value: 0 }, { label: Transient, value: 0.5 }, { label: Sustained, value: 1 } ] }
      env_trig: { type: dropdown, col: 12, row: 3, colSpan: 2, bind: Env Trig Select, options: [ { label: Sequencer, value: 0 }, { label: Pulser, value: 0.5 }, { label: Keyboard, value: 1 } ] }
      pulser: { type: group, col: 14, row: 0, colSpan: 2, rowSpan: 4, label: PULSE, color: "#ff3b3026" }
      period: { type: knob, col: 14, row: 0, colSpan: 2, rowSpan: 2, label: Period, bind: Pulser Period, min: 0, max: 1 }
      pulse_mode: { type: dropdown, col: 14, row: 2, colSpan: 2, bind: Pulser Mode, options: [ { label: Clock, value: 0 }, { label: Free, value: 0.5 }, { label: Sync, value: 1 } ] }
      pulse_trig: { type: dropdown, col: 14, row: 3, colSpan: 2, bind: Pulser Trig Select, options: [ { label: Sequencer, value: 0 }, { label: Pulser, value: 0.5 }, { label: Keyboard, value: 1 } ] }
