# piano-v3 — a modelled acoustic piano: hammer and strings, then soundboard and room, then EQ, drive, reverb and comp

cols: 16
rows: 4
widgets: {}
tabs:
  - name: PIANO
    widgets:
      key_grp: { type: group, col: 0, row: 0, colSpan: 2, rowSpan: 4, label: KEY, color: "#3d7dff26" }
      dynamics: { type: knob, col: 0, row: 0, colSpan: 2, rowSpan: 2, label: Dynamic, bind: Dynamics, min: 0, max: 1 }
      release: { type: knob, col: 0, row: 2, colSpan: 2, rowSpan: 2, label: Release, bind: Release Time, min: 0, max: 1 }
      hammer_grp: { type: group, col: 2, row: 0, colSpan: 4, rowSpan: 4, label: HAMMER, color: "#ff6a1a26" }
      hardness: { type: knob, col: 2, row: 0, colSpan: 2, rowSpan: 2, label: Hard, bind: Hammer Hardness, min: 0, max: 1 }
      position: { type: knob, col: 4, row: 0, colSpan: 2, rowSpan: 2, label: Pos, bind: Hammer Position, min: 0, max: 1 }
      h_noise: { type: knob, col: 2, row: 2, colSpan: 2, rowSpan: 2, label: Noise, bind: Hammer Noise, min: 0, max: 1 }
      hammer_screen: { type: lcdscreen, col: 6, row: 0, colSpan: 4, rowSpan: 4 }
      string_grp: { type: group, col: 10, row: 0, colSpan: 6, rowSpan: 4, label: STRING, color: "#3ec96b26" }
      tension: { type: knob, col: 10, row: 0, colSpan: 2, rowSpan: 2, label: Tension, bind: String Tension, min: 0, max: 1 }
      stretch: { type: knob, col: 12, row: 0, colSpan: 2, rowSpan: 2, label: Stretch, bind: Stretch Tuning, min: 0, max: 1 }
      unison: { type: knob, col: 14, row: 0, colSpan: 2, rowSpan: 2, label: Unison, bind: Unison Detune, min: 0, max: 1 }
      harmonics: { type: knob, col: 10, row: 2, colSpan: 2, rowSpan: 2, label: Harm, bind: Harmonics, min: 0, max: 1 }
      age: { type: knob, col: 12, row: 2, colSpan: 2, rowSpan: 2, label: Age, bind: Age, min: 0, max: 1 }
  - name: BODY
    widgets:
      tone_grp: { type: group, col: 0, row: 0, colSpan: 2, rowSpan: 4, label: TONE, color: "#ff6a1a26" }
      brightness: { type: knob, col: 0, row: 0, colSpan: 2, rowSpan: 2, label: Bright, bind: Brightness, min: 0, max: 1 }
      timbre: { type: knob, col: 0, row: 2, colSpan: 2, rowSpan: 2, label: Timbre, bind: Timbre, min: 0, max: 1 }
      reso_grp: { type: group, col: 2, row: 0, colSpan: 4, rowSpan: 4, label: RESO, color: "#3ec96b26" }
      board: { type: knob, col: 2, row: 0, colSpan: 2, rowSpan: 2, label: Board, bind: Soundboard Resonance, min: 0, max: 1 }
      sympathetic: { type: knob, col: 4, row: 0, colSpan: 2, rowSpan: 2, label: Symp, bind: Sympathetic Resonance, min: 0, max: 1 }
      duplex: { type: knob, col: 2, row: 2, colSpan: 2, rowSpan: 2, label: Duplex, bind: Duplex Scale Resonance, min: 0, max: 1 }
      room_grp: { type: group, col: 6, row: 0, colSpan: 4, rowSpan: 3, label: ROOM, color: "#ffffff1a" }
      lid: { type: dropdown, col: 6, row: 0, colSpan: 4, label: Lid, bind: Lid Position, options: [ { label: Closed, value: 0 }, { label: Slightly Open, value: 0.5 }, { label: Open, value: 1 } ] }
      ambient: { type: knob, col: 6, row: 1, colSpan: 2, rowSpan: 2, label: Ambient, bind: Ambient Mics, min: 0, max: 1 }
      width: { type: knob, col: 8, row: 1, colSpan: 2, rowSpan: 2, label: Width, bind: Stereo Width, min: 0, max: 1 }
  - name: FX
    widgets:
      eq_grp: { type: group, col: 0, row: 0, colSpan: 5, rowSpan: 4, label: EQ, color: "#3d7dff26" }
      eq_on: { type: toggle, col: 0, row: 0, colSpan: 2, label: EQ, bind: Equalizer Bypass }
      bell_freq: { type: knob, col: 0, row: 1, colSpan: 2, rowSpan: 2, label: Freq, bind: Bell Freq, min: 0, max: 1 }
      low_shelf: { type: fader, col: 2, row: 0, rowSpan: 4, label: Low, bind: Low Shelf Gain, min: 0, max: 1 }
      presence: { type: fader, col: 3, row: 0, rowSpan: 4, label: Pres, bind: Presence Gain, min: 0, max: 1 }
      high_shelf: { type: fader, col: 4, row: 0, rowSpan: 4, label: High, bind: High Shelf Gain, min: 0, max: 1 }
      eq_screen: { type: lcdscreen, col: 5, row: 0, colSpan: 5, rowSpan: 4 }
      drive_grp: { type: group, col: 10, row: 0, colSpan: 2, rowSpan: 3, label: DRIVE, color: "#ff3b3026" }
      disto_on: { type: toggle, col: 10, row: 0, colSpan: 2, label: Drive, bind: Disto Bypass }
      drive: { type: knob, col: 10, row: 1, colSpan: 2, rowSpan: 2, label: Drive, bind: Drive, min: 0, max: 1 }
      rev_grp: { type: group, col: 12, row: 0, colSpan: 4, rowSpan: 3, label: REVERB, color: "#ffffff1a" }
      reverb_on: { type: toggle, col: 12, row: 0, colSpan: 2, label: Reverb, bind: Reverb Bypass }
      room: { type: dropdown, col: 14, row: 0, colSpan: 2, label: Room, bind: Reverb Room, options: [ { label: Small Piano Room, value: 0 }, { label: Soft Room, value: 0.08333333333333333 }, { label: Small Studio, value: 0.16666666666666666 }, { label: Large Studio, value: 0.25 }, { label: Jazz Club, value: 0.3333333333333333 }, { label: Small Concert Hall, value: 0.4166666666666667 }, { label: Large Concert Hall, value: 0.5 }, { label: Bright Room, value: 0.5833333333333334 }, { label: Bright Space, value: 0.6666666666666666 }, { label: Factory Hall, value: 0.75 }, { label: Small Plate, value: 0.8333333333333334 }, { label: Large Plate, value: 0.9166666666666666 }, { label: Spring, value: 1 } ] }
      rv_size: { type: knob, col: 12, row: 1, colSpan: 2, rowSpan: 2, label: Size, bind: Reverb Room Size, min: 0, max: 1 }
      rv_mix: { type: knob, col: 14, row: 1, colSpan: 2, rowSpan: 2, label: Mix, bind: Reverb Dry/Wet, min: 0, max: 1 }
  - name: COMP
    widgets:
      comp_grp: { type: group, col: 0, row: 0, colSpan: 8, rowSpan: 4, label: COMP, color: "#3ec96b26" }
      comp_on: { type: toggle, col: 0, row: 0, colSpan: 2, label: Comp, bind: Compressor Bypass }
      threshold: { type: knob, col: 2, row: 0, colSpan: 2, rowSpan: 2, label: Thresh, bind: Comp Threshold, min: 0, max: 1 }
      ratio: { type: knob, col: 4, row: 0, colSpan: 2, rowSpan: 2, label: Ratio, bind: Comp Ratio, min: 0, max: 1 }
      makeup: { type: knob, col: 6, row: 0, colSpan: 2, rowSpan: 2, label: Makeup, bind: Comp Make Up gain, min: 0, max: 1 }
      c_attack: { type: knob, col: 2, row: 2, colSpan: 2, rowSpan: 2, label: Attack, bind: Comp Attack, min: 0, max: 1 }
      c_release: { type: knob, col: 4, row: 2, colSpan: 2, rowSpan: 2, label: Release, bind: Comp Release, min: 0, max: 1 }
      comp_screen: { type: lcdscreen, col: 8, row: 0, colSpan: 6, rowSpan: 4 }
