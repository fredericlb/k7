        trem_grp: { type: group, col: 0, row: 0, colSpan: 4, rowSpan: 2, label: TREM, color: "#ff6a1a26" }
        trem_on: { type: toggle, col: 0, row: 0, colSpan: 2, label: On, bind: Tremolo On/Off }
        trem_depth: { type: number, col: 0, row: 1, colSpan: 2, label: Depth, bind: Tremolo Depth, min: 0, max: 1, step: 0.01 }
        trem_rate: { type: knob, col: 2, row: 0, colSpan: 2, rowSpan: 2, label: Rate, bind: Tremolo Rate, min: 0, max: 1 }
        dl_grp: { type: group, col: 0, row: 2, colSpan: 4, rowSpan: 5, label: DELAY, color: "#3ec96b26" }
        dl_on: { type: toggle, col: 0, row: 2, colSpan: 2, label: On, bind: Delay On/Off }
        dl_time: { type: knob, col: 0, row: 3, colSpan: 2, rowSpan: 2, label: Time, bind: Delay Time, min: 0, max: 1 }
        dl_fb: { type: knob, col: 2, row: 3, colSpan: 2, rowSpan: 2, label: Fdbk, bind: Delay Feedback, min: 0, max: 1 }
        dl_mix: { type: knob, col: 0, row: 5, colSpan: 2, rowSpan: 2, label: Mix, bind: Delay Mix, min: 0, max: 1 }
        rv_grp: { type: group, col: 0, row: 7, colSpan: 4, rowSpan: 2, label: REVERB, color: "#ffffff1a" }
        rv_on: { type: toggle, col: 0, row: 7, colSpan: 2, label: On, bind: Reverb On/Off }
        rv_model: { type: dropdown, col: 0, row: 8, colSpan: 2, label: Model, bind: Reverb Model, options: [ { label: King Dark, value: 0 }, { label: King Medium, value: 0.1 }, { label: King Bright, value: 0.2 }, { label: RV-1 High-Cut, value: 0.3 }, { label: RV-1 Flat, value: 0.4 }, { label: RV-1 RIAA, value: 0.5 }, { label: RV-1 Low-Cut, value: 0.6 }, { label: RV-2 High-Cut, value: 0.7 }, { label: RV-2 Flat, value: 0.8 }, { label: RV-2 RIAA, value: 0.9 }, { label: RV-2 Low-Cut, value: 1 } ] }
        rv_level: { type: knob, col: 2, row: 7, colSpan: 2, rowSpan: 2, label: Amount, bind: Reverb Level, min: 0, max: 1 }
