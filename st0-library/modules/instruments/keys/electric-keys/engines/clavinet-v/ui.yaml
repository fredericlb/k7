# clavinet-v — a modelled Clavinet: tone rockers and pickups, hammer and mute, the wah, then a pedalboard and an amp
cols: 16
rows: 4
widgets: {}
tabs:
  - name: CLAV
    widgets:
      tone_grp: { type: group, col: 0, row: 0, colSpan: 4, rowSpan: 4, label: TONE, color: "#ff6a1a26" }
      brilliant: { type: toggle, col: 0, row: 0, colSpan: 2, label: Brill, bind: Tone Brillant }
      treble: { type: toggle, col: 2, row: 0, colSpan: 2, label: Treble, bind: Tone Treble }
