# hard-vacuum — tube-style saturation
cols: 6
rows: 4
widgets:
  level_screen: { type: lcdscreen, col: 0, row: 0, colSpan: 6, rowSpan: 2 }
  drive: { type: knob, col: 0, row: 2, colSpan: 2, rowSpan: 2, label: Drive, bind: Drive, min: 0, max: 1 }
  warmth: { type: knob, col: 2, row: 2, colSpan: 2, rowSpan: 2, label: Warmth, bind: Warmth, min: 0, max: 1 }
  aura: { type: knob, col: 4, row: 2, colSpan: 2, rowSpan: 2, label: Aura, bind: Aura, min: 0, max: 1 }
vertical:
  cols: 4
  rows: 6
  widgets:
    level_screen: { type: lcdscreen, col: 0, row: 0, colSpan: 4, rowSpan: 2 }
    drive: { type: knob, col: 0, row: 2, colSpan: 2, rowSpan: 2, label: Drive, bind: Drive, min: 0, max: 1 }
    warmth: { type: knob, col: 2, row: 2, colSpan: 2, rowSpan: 2, label: Warmth, bind: Warmth, min: 0, max: 1 }
    aura: { type: knob, col: 0, row: 4, colSpan: 2, rowSpan: 2, label: Aura, bind: Aura, min: 0, max: 1 }
