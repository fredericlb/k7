# Echo  [audioEffect] — a feedback delay whose time is set in MILLISECONDS.
#
# Which is the whole reason it exists. Every delay the engine ships is normalised: `Tape Delay`,
# `ADT` and `Purest Echo` all take their time as a 0..1 fraction, and Tracktion's own `Delay` has
# no time parameter at all — only Feedback and Mix. So there was no way to ask for 350 ms.
#
# Its DSP is described in jsdsp.ts beside this file, not compiled into the engine — open it and
# change it. No `params:` here: the graph's own defaults (250 ms, 0.6, 0.5) are the defaults, and
# restating one would be a second place to keep them.
plugin:
  type: jsdsp
  name: Echo

# Feedback is capped below 1 in the graph: at 1 the loop never decays, and a runaway is not a
# setting. Time is capped at 900 ms against a 1000 ms buffer, so the ceiling is the parameter's
# rather than the memory's.
