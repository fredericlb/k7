# highpass-airwindows — Airwindows Highpass, a one-knob high pass with a loose/tight character
cols: 4
rows: 2
widgets:
  freq: { type: knob, col: 0, row: 0, colSpan: 2, rowSpan: 2, label: Freq, bind: Highpass, min: 0, max: 1 }
  tight: { type: knob, col: 2, row: 0, colSpan: 2, rowSpan: 2, label: Tight, bind: Loose/Tight, min: 0, max: 1 }
