# lowpass-airwindows — Airwindows Lowpass, a one-pole low pass with a soft/hard character
cols: 4
rows: 2
widgets:
  freq: { type: knob, col: 0, row: 0, colSpan: 2, rowSpan: 2, label: Freq, bind: Lowpass, min: 0, max: 1 }
  hard: { type: knob, col: 2, row: 0, colSpan: 2, rowSpan: 2, label: Hard, bind: Soft/Hard, min: 0, max: 1 }
