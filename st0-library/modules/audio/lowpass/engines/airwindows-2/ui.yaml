# lowpass-2 — Airwindows Lowpass 2, a low pass with a soft/hard character and a pole count
cols: 6
rows: 2
widgets:
  freq: { type: knob, col: 0, row: 0, colSpan: 2, rowSpan: 2, label: Freq, bind: Lowpass, min: 0, max: 1 }
  hard: { type: knob, col: 2, row: 0, colSpan: 2, rowSpan: 2, label: Hard, bind: Sft/Hrd, min: 0, max: 1 }
  poles: { type: knob, col: 4, row: 0, colSpan: 2, rowSpan: 2, label: Poles, bind: Poles, min: 0, max: 1 }
vertical:
  cols: 4
  rows: 4
  widgets:
    freq: { type: knob, col: 0, row: 0, colSpan: 2, rowSpan: 2, label: Freq, bind: Lowpass, min: 0, max: 1 }
    hard: { type: knob, col: 2, row: 0, colSpan: 2, rowSpan: 2, label: Hard, bind: Sft/Hrd, min: 0, max: 1 }
    poles: { type: knob, col: 0, row: 2, colSpan: 2, rowSpan: 2, label: Poles, bind: Poles, min: 0, max: 1 }
