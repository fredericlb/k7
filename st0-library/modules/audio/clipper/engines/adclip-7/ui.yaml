  boost: { type: knob, col: 0, row: 0, colSpan: 2, rowSpan: 2, label: Boost, bind: Boost, min: 0, max: 1 }
  soften: { type: knob, col: 2, row: 0, colSpan: 2, rowSpan: 2, label: Soften, bind: Soften, min: 0, max: 1 }
  enhance: { type: knob, col: 4, row: 0, colSpan: 2, rowSpan: 2, label: Enhance, bind: Enhance, min: 0, max: 1 }
  mode: { type: knob, col: 6, row: 0, colSpan: 2, rowSpan: 2, label: Mode, bind: Mode, min: 0, max: 1 }
