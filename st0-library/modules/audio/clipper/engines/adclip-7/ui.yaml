    soften: { type: knob, col: 2, row: 0, colSpan: 2, rowSpan: 2, label: Soften, bind: Soften, min: 0, max: 1 }
    enhance: { type: knob, col: 0, row: 2, colSpan: 2, rowSpan: 2, label: Enhance, bind: Enhance, min: 0, max: 1 }
    mode: { type: knob, col: 1, row: 4, colSpan: 2, rowSpan: 2, label: Mode, bind: Mode, min: 0, max: 1 }
