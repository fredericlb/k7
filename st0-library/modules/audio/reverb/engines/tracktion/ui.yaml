# reverb — JUCE's Freeverb-style room: size, damping, width and freeze
cols: 8
rows: 4
widgets:
  room_section: { type: group, col: 0, row: 0, colSpan: 6, rowSpan: 2, label: ROOM, color: "#ff6a1a26" }
  room_size: { type: knob, col: 0, row: 0, colSpan: 2, rowSpan: 2, label: Size, bind: Room Size, min: 0, max: 1 }
  damping: { type: knob, col: 2, row: 0, colSpan: 2, rowSpan: 2, label: Damp, bind: Damping, min: 0, max: 1 }
  width: { type: knob, col: 4, row: 0, colSpan: 2, rowSpan: 2, label: Width, bind: Width, min: 0, max: 1 }
  freeze: { type: toggle, col: 6, row: 0, colSpan: 2, rowSpan: 2, label: Freeze, bind: Freeze }
  tail: { type: lcdscreen, col: 0, row: 2, colSpan: 8, rowSpan: 2 }
vertical:
  cols: 4
  rows: 6
  widgets:
    room_section: { type: group, col: 0, row: 0, colSpan: 4, rowSpan: 4, label: ROOM, color: "#ff6a1a26" }
    room_size: { type: knob, col: 0, row: 0, colSpan: 2, rowSpan: 2, label: Size, bind: Room Size, min: 0, max: 1 }
    damping: { type: knob, col: 2, row: 0, colSpan: 2, rowSpan: 2, label: Damp, bind: Damping, min: 0, max: 1 }
    width: { type: knob, col: 0, row: 2, colSpan: 2, rowSpan: 2, label: Width, bind: Width, min: 0, max: 1 }
    freeze: { type: toggle, col: 2, row: 2, colSpan: 2, rowSpan: 2, label: Freeze, bind: Freeze }
    tail: { type: lcdscreen, col: 0, row: 4, colSpan: 4, rowSpan: 2 }
