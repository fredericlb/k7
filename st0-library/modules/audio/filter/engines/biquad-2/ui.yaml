# biquad-2 — Airwindows Biquad 2, a biquad filter: low pass, high pass, band pass or notch
cols: 6
rows: 4
widgets:
  type: { type: knob, col: 0, row: 0, colSpan: 2, rowSpan: 2, label: Type, bind: Type, min: 0, max: 1 }
  freq: { type: knob, col: 2, row: 0, colSpan: 2, rowSpan: 2, label: Freq, bind: Freq, min: 0, max: 1 }
  q: { type: knob, col: 4, row: 0, colSpan: 2, rowSpan: 2, label: Q, bind: Q, min: 0, max: 1 }
  response: { type: lcdscreen, col: 0, row: 2, colSpan: 6, rowSpan: 2 }
vertical:
  cols: 4
  rows: 6
  widgets:
    type: { type: knob, col: 0, row: 0, colSpan: 2, rowSpan: 2, label: Type, bind: Type, min: 0, max: 1 }
    freq: { type: knob, col: 2, row: 0, colSpan: 2, rowSpan: 2, label: Freq, bind: Freq, min: 0, max: 1 }
    q: { type: knob, col: 0, row: 2, colSpan: 2, rowSpan: 2, label: Q, bind: Q, min: 0, max: 1 }
    response: { type: lcdscreen, col: 0, row: 4, colSpan: 4, rowSpan: 2 }
