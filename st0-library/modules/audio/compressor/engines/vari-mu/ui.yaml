# vari-mu — a variable-mu tube compressor
cols: 4
rows: 4
widgets:
  levels: { type: lcdscreen, col: 0, row: 0, colSpan: 4, rowSpan: 2 }
  intensity: { type: knob, col: 0, row: 2, colSpan: 2, rowSpan: 2, label: Intens, bind: Intensty, min: 0, max: 1 }
  speed: { type: knob, col: 2, row: 2, colSpan: 2, rowSpan: 2, label: Speed, bind: Speed, min: 0, max: 1 }
