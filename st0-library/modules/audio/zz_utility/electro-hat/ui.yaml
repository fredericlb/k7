# electro-hat — Airwindows ElectroHat, a hi-hat synthesizer from the input
cols: 6
rows: 2
widgets:
  hihat: { type: knob, col: 0, row: 0, colSpan: 2, rowSpan: 2, label: HiHat, bind: HiHat, min: 0, max: 1 }
  trim: { type: knob, col: 2, row: 0, colSpan: 2, rowSpan: 2, label: Trim, bind: Trim, min: 0, max: 1 }
  bright: { type: knob, col: 4, row: 0, colSpan: 2, rowSpan: 2, label: Bright, bind: Bright, min: 0, max: 1 }
vertical:
  cols: 4
  rows: 4
  widgets:
    hihat: { type: knob, col: 0, row: 0, colSpan: 2, rowSpan: 2, label: HiHat, bind: HiHat, min: 0, max: 1 }
    trim: { type: knob, col: 2, row: 0, colSpan: 2, rowSpan: 2, label: Trim, bind: Trim, min: 0, max: 1 }
    bright: { type: knob, col: 0, row: 2, colSpan: 2, rowSpan: 2, label: Bright, bind: Bright, min: 0, max: 1 }
