# panel for @st0/cold/tempo
#
# One knob you turn and one number you read. `Source BPM` is a METER because it is MEASURED,
# not chosen — the cold pass writes it — exactly as normalize/ draws its `Peak`. Showing it
# read-only beside the knob is what makes the knob mean something: a target of 128 says
# nothing until you can see it started at 90.
#
# 10..300 covers the tempos that exist, from a dirge to drum-and-bass counted straight. The
# knob cannot express 0, and 0 is the param's default — it is not a tempo, it is the absence
# of a choice, so an untouched module draws at the floor until the pass measures one or
# somebody asks for one. Stated here because a knob sitting at its minimum normally means
# somebody put it there.
cols: 3
rows: 2
widgets:
  target: { type: knob, col: 0, row: 0, colSpan: 2, rowSpan: 2, label: BPM, bind: Target BPM, min: 10, max: 300, step: 0.1 }
  source: { type: meter, col: 2, row: 0, rowSpan: 2, label: Source, bind: Source BPM }
