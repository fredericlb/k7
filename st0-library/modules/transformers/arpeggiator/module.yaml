# Arpégiateur  [midiEffect] — un accord tenu, joué une note à la fois.
#
# Le seul module de `transformers/` écrit ici, et le seul qui ne transforme pas les notes qu'on lui
# donne : il les MANGE et joue les siennes. C'est pour ça qu'il n'a ni jsdsp.ts ni dsp.dsp — un nœud
# MIDI de DspGraph réécrit la liste des messages sur place, sans horloge et sans mémoire de ce qui
# est tenu, et aucune suite de ces primitives ne fabrique une note que personne n'a jouée. C'est
# donc un plugin compilé, `studio_arpeggiator`, comme `quick-master` l'est pour le bus master.
#
# Le pourquoi de chaque choix — d'où vient le tempo, pourquoi la note dure la moitié de son pas,
# ce qui se passe quand on lâche l'accord — est dans engine/st0-engine/docs/arpeggiator.md.
extends: "@engine/arpeggiator"
params:
  # 1/16 : c'est ce que le mot veut dire. Plus lent, on entend un arpège joué à la main ; c'est joli
  # et ce n'est pas un arpégiateur, et le pas est le premier réglage que la main va chercher.
  Rate: 6
  # Une octave, celle de l'accord. Empiler des octaves est une décision d'arrangement, pas un état
  # de repos : un module qu'on pose ne doit pas jouer des notes qu'on n'a pas tenues.
  Octaves: 1
  # Montante. La direction par défaut de tout le monde, et celle qui laisse entendre l'accord tel
  # qu'il est posé sous les doigts.
  Direction: 0
# En un paragraphe : tient l'accord qu'on joue et le fait sonner note par note, sur la grille du
# morceau. La cadence, le nombre d'octaves, le sens — ou un motif dessiné sur la grille (Custom) :
# ce qui sort suit le tempo du projet, et la première note part au moment où le doigt tombe.
# (La description d'un module est son en-tête, ici — voir packages/song/docs/docModules.md.)
