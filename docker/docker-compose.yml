# The hosted half only: k7 (the editor, the media library AND the rehearsal recorder) in its OWN
# image and container — no nginx, see apps/k7/docker/Dockerfile. The musicians' engines run on their own machines, and reach this stack through the tunnel their
# supervisor dials (packages/engine-tunnel/docs/tunnel.md); the `engine` service is one more of
# those, the server's own, which dials k7 over the container network (docs/server-engine.md).
# The accounts' WORKSPACES live here, in k7, one file service per account
# (packages/file-hub/docs/fileHub.md).
#
# THREE containers: Traefik routes k7 by Host() straight to its own backend port (no nginx to
# hand off to), and k7 answers everything on that hostname; the engine is reached on the container network only, and so is pocketbase,
# the rehearsal recorder's former store, until k7 has imported it. k7 also answers the `play.` and `k7.` hosts, aliases kept for the share links, registry
# URLs, publish URLs and public pages saved against them. That's the topology env.yaml's
# COOKIE_DOMAIN/TRUSTED_ORIGINS document.
#
# The shared login — one "studio.sid" good on every host — comes from cookieDomain/trustedOrigins
# being resolved by every setupAuth() call (commons/packages/oidc) straight from the SAME
# COOKIE_DOMAIN/TRUSTED_ORIGINS/SESSION_SECRET below, repeated on every service because each is
# its own process with its own environment. The media API's CORS is separate and open to every
# origin regardless.

x-shared-auth: &shared-auth
  SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET — see .env.example}
  COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
  TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
  # Required: unset, k7 refuses to start rather than sign every visitor in as one dev user.
  OIDC_ISSUER: ${OIDC_ISSUER:?set OIDC_ISSUER — see .env.example}
  OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?set OIDC_CLIENT_ID — see .env.example}
  OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
  OIDC_SCOPES: ${OIDC_SCOPES:-}

# Docker's json-file logs grow without end unless capped; every service takes this.
x-logging: &logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: ${LOG_MAX_FILE:-3}

services:
  k7:
    # Required, so a deploy names the build it runs and the engine below runs the same one (docs/versioning.md).
    image: ghcr.io/fredericlb/k7-webapp:${APP_VERSION:-0.1.0}
    restart: unless-stopped
    logging: *logging
    # The backend, every account's file service and their ffmpeg children share this; the engine has its own below.
    mem_limit: ${K7_MEM_LIMIT:-6g}
    # The image's HEALTHCHECK asks /api/ready; the engine below waits for it.
    environment:
      <<: *shared-auth
      # Signs the media library's bearer tokens — see docs/tokens.md.
      # Unset falls back to a value derived from SESSION_SECRET, which works but
      # ties token validity to the login secret's rotation; set it explicitly.
      API_TOKEN_SECRET: ${API_TOKEN_SECRET:-}
      # Signs the rehearsal recorder's personal tokens, saved in users' settings. Unset is the
      # default derived from SESSION_SECRET that k7 always used, which keeps issued tokens valid.
      K7_API_TOKEN_SECRET: ${K7_API_TOKEN_SECRET:-}
      # Where the rehearsal store is imported from, ONCE, while k7.db is still empty —
      # packages/rehearsal-server/docs/store.md. Drop all three with the pocketbase service.
      POCKETBASE_URL: ${POCKETBASE_URL:-http://pocketbase:8090}
      POCKETBASE_EMAIL: ${POCKETBASE_EMAIL:-}
      POCKETBASE_PASSWORD: ${POCKETBASE_PASSWORD:-}
      # The rehearsal recorder's store (k7.db and its sheets), its audio cache and uploads in flight: the volume below.
      K7_DATA_DIR: /rehearsal-data
      # Without this, @studio/mediatek defaults to a per-machine state dir
      # (~/.k7/mediatek) instead of the volume below, and the library is empty.
      STUDIO_MEDIATEK: /library
      # The accounts' workspaces, and the only place they live — engines hold copies, never workspaces.
      STUDIO_FILES_ROOT: /workspaces
      # One account's file service gets this heap at most, so a leak in one ends that one, not the box.
      STUDIO_FILE_SERVICE_HEAP_MB: ${FILE_SERVICE_HEAP_MB:-1024}
      # File services at once: 12 = (6 GB − 1.5 GB reserve) / 384 MB each; empty derives it from mem_limit (packages/file-hub/docs/fileHub.md).
      STUDIO_MAX_FILE_SERVICES: ${MAX_FILE_SERVICES:-12}
      # Who edits the libraries every account shares and deletes a public song.
      AUTH_ADMIN_GROUPS: ${AUTH_ADMIN_GROUPS:-}
      # Recognises the engine service as the render machine, since this image has no engine binary.
      STUDIO_RENDER_KEY: ${RENDER_KEY:-}
      # 1: list only machines paired with an account, or the render machine (packages/engine-registry/docs/heartbeat.md).
      STUDIO_REGISTRY_REQUIRE_DEVICE: ${REGISTRY_REQUIRE_DEVICE:-0}
      # The bearer desktop.yml publishes the apps' builds with; empty refuses every upload (docs/app-downloads.md).
      APP_RELEASE_TOKEN: ${APP_RELEASE_TOKEN:-}
      # The hosts that show the coming-soon page rather than the app — the k7-site router below.
      STUDIO_SITE_HOSTS: ${SITE_DOMAIN:-k7.rocks},www.${SITE_DOMAIN:-k7.rocks}
    volumes:
      - data:/data
      # The media library IS this volume — apps/k7/docker/Dockerfile.
      - library:/library
      - workspaces:/workspaces
      # The volume k7's own container used, under its old name, so the cached audio is kept.
      - k7-data:/rehearsal-data
    networks:
      - traefik
    labels:
      - traefik.enable=true
      # docs. is the same app showing its documentation. The st0.app hosts are former ones, kept: saved share links, registries, publish URLs and public pages name them.
      - traefik.http.routers.k7.rule=Host(`${K7_DOMAIN:-app.k7.rocks}`) || Host(`${DOCS_DOMAIN:-docs.k7.rocks}`) || Host(`${LEGACY_DOMAIN:-st0.app}`) || Host(`${PL8_DOMAIN:-play.st0.app}`) || Host(`${K7_ALIAS_DOMAIN:-k7.st0.app}`)
      - traefik.http.routers.k7.entrypoints=websecure
      - traefik.http.routers.k7.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.services.k7.loadbalancer.server.port=8789
      # The root domain and www.: the coming-soon page, and /app_downloads, the apps' download page and update feed (apps/k7/backend/docs/site.md).
      - traefik.http.routers.k7-site.rule=Host(`${SITE_DOMAIN:-k7.rocks}`) || Host(`www.${SITE_DOMAIN:-k7.rocks}`)
      - traefik.http.routers.k7-site.entrypoints=websecure
      - traefik.http.routers.k7-site.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.routers.k7-site.service=k7

  # The rehearsal recorder's FORMER store, kept only as the source of k7's one-time import into
  # k7.db (packages/rehearsal-server/docs/store.md). Once k7's log says "rehearsal: imported …",
  # remove this service, its volume and k7's POCKETBASE_* above.
  pocketbase:
    # Pinned: a PocketBase upgrade migrates pb_data on start, which an import source must not do.
    image: ghcr.io/muchobien/pocketbase:0.40.5
    restart: unless-stopped
    logging: *logging
    volumes:
      - pocketbase-data:/pb_data
    networks:
      - traefik
    ports:
      # The admin UI (/_/) and the API on the host's loopback only: reach it through an SSH tunnel.
      # k7 imports over the container network and needs no published port.
      - "127.0.0.1:${POCKETBASE_PORT:-8090}:8090"

  # The server's own engine — engine/docker/Dockerfile. Not routed through Traefik: it publishes no
  # port, and browsers reach it through k7's relay like any machine's (docs/server-engine.md).
  engine:
    image: ghcr.io/fredericlb/k7-runtime:${APP_VERSION:-0.1.0}
    restart: unless-stopped
    logging: *logging
    # Kept apart from k7's: a render or an import there must not take the server's engine down with it.
    mem_limit: ${ENGINE_MEM_LIMIT:-4g}
    depends_on:
      k7:
        condition: service_healthy
    environment:
      # k7's registry on the container network; the supervisor dials its tunnel from the same address.
      STUDIO_REGISTRY_URL: ${ENGINE_REGISTRY_URL:-http://k7:8789}
      STUDIO_INSECURE_REGISTRIES: ${ENGINE_INSECURE_REGISTRIES:-k7}
      # The name the engine pickers show.
      STUDIO_MACHINE_NAME: ${ENGINE_NAME:-k7 server}
      # Every sampled instrument, since this machine has no Downloads tab to choose them in.
      STUDIO_INSTRUMENTS: ${ENGINE_INSTRUMENTS:-all}
      # The same key as k7's: presented on the tunnel, it makes this engine k7's render machine.
      STUDIO_RENDER_KEY: ${RENDER_KEY:-}
    volumes:
      - engine-home:/engine-home
    networks:
      - traefik

networks:
  traefik:
    external: true

volumes:
  library:
  workspaces:
  data:
  k7-data:
  pocketbase-data:
  engine-home:
