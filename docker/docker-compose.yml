# The hosted half only: st0 (the editor, the media library AND the rehearsal recorder) in its OWN
# image and container — no nginx, see apps/st0/docker/Dockerfile. z0 is one image sharing
# nginx internally (apps/z0/docker/), on st0's own hostname. No engine and no tray: those run
# on the musician's own machine, and reach this stack through the tunnel their supervisor dials
# (packages/engine-tunnel/docs/tunnel.md). The accounts' WORKSPACES live here, in st0, one file
# service per account (packages/file-hub/docs/fileHub.md).
#
# THREE containers: Traefik routes st0 by Host() straight to its own backend port (no nginx to
# hand off to) and z0 by a PathPrefix(`/z0`) rule layered on st0's own hostname — st0 answers
# everything else there; pocketbase, the rehearsal recorder's store, is reached on the container
# network only. st0 also answers the `play.` and `k7.` hosts, aliases kept for the share links, registry
# URLs, publish URLs and public pages saved against them. That's the topology env.yaml's
# COOKIE_DOMAIN/TRUSTED_ORIGINS document.
#
# The shared login — one "studio.sid" good on every host — comes from cookieDomain/trustedOrigins
# being resolved by every setupAuth() call (commons/packages/oidc) straight from the SAME
# COOKIE_DOMAIN/TRUSTED_ORIGINS/SESSION_SECRET below, repeated on every service because each is
# its own process with its own environment. The media API's CORS is separate and open to every
# origin regardless.

x-shared-auth: &shared-auth
  SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET — see .env.example}
  COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
  TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
  OIDC_ISSUER: ${OIDC_ISSUER:-}
  OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
  OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
  OIDC_SCOPES: ${OIDC_SCOPES:-}

services:
  st0:
    image: dev.frediver.se/frediverse/studio/st0:${APP_VERSION:-latest}
    restart: unless-stopped
    environment:
      <<: *shared-auth
      # Signs the media library's bearer tokens — see docs/tokens.md.
      # Unset falls back to a value derived from SESSION_SECRET, which works but
      # ties token validity to the login secret's rotation; set it explicitly.
      API_TOKEN_SECRET: ${API_TOKEN_SECRET:-}
      # Signs the rehearsal recorder's personal tokens, saved in users' settings. Unset is the
      # default derived from SESSION_SECRET that k7 always used, which keeps issued tokens valid.
      K7_API_TOKEN_SECRET: ${K7_API_TOKEN_SECRET:-}
      # The pocketbase service below, reached over the container network.
      POCKETBASE_URL: ${POCKETBASE_URL:-http://pocketbase:8090}
      POCKETBASE_EMAIL: ${POCKETBASE_EMAIL:?set POCKETBASE_EMAIL — see .env.example}
      POCKETBASE_PASSWORD: ${POCKETBASE_PASSWORD:?set POCKETBASE_PASSWORD — see .env.example}
      # The rehearsal recorder's audio cache and uploads in flight: the volume below.
      K7_DATA_DIR: /rehearsal-data
      # Without this, @studio/mediatek defaults to a per-machine state dir
      # (~/.st0/mediatek) instead of the volume below, and the library is empty.
      STUDIO_MEDIATEK: /library
      # The accounts' workspaces, and the only place they live — engines hold copies, never workspaces.
      STUDIO_FILES_ROOT: /workspaces
      # Who edits the libraries every account shares and deletes a public song — z0's admins too.
      AUTH_ADMIN_GROUPS: ${AUTH_ADMIN_GROUPS:-}
    volumes:
      - data:/data
      # The media library IS this volume — apps/st0/docker/Dockerfile.
      - library:/library
      - workspaces:/workspaces
      # The volume k7's own container used, under its old name, so the cached audio is kept.
      - k7-data:/rehearsal-data
    networks:
      - traefik
    labels:
      - traefik.enable=true
      # The play. and k7. hosts are permanent aliases: saved share links, registries, publish URLs and public pages name them.
      - traefik.http.routers.st0.rule=Host(`${ST0_DOMAIN:-st0.app}`) || Host(`${PL8_DOMAIN:-play.st0.app}`) || Host(`${K7_DOMAIN:-k7.st0.app}`)
      - traefik.http.routers.st0.entrypoints=websecure
      - traefik.http.routers.st0.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.services.st0.loadbalancer.server.port=8789

  # The rehearsal recorder's data + song-sheet store — packages/rehearsal-server/docs/pocketbase.md.
  # st0 reaches it over the container network, by service name; not routed through Traefik.
  # Community image (no official one is published); pin a version for prod rather
  # than trusting `latest`. First boot has no superuser — create one with
  # `docker compose exec pocketbase /pb/pocketbase superuser create <email> <password>`
  # and put those same values in POCKETBASE_EMAIL / POCKETBASE_PASSWORD for st0.
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    restart: unless-stopped
    volumes:
      - pocketbase-data:/pb_data
    networks:
      - traefik
    ports:
      # One port for both: the admin web UI is at /_/, the REST API at /api/*.
      # Published straight on the host, not through Traefik — there is no
      # auth in front of this beyond PocketBase's own login, so bind it to a
      # trusted interface/VPN or firewall it off in a real deployment.
      - "${POCKETBASE_PORT:-8090}:8090"

  z0:
    image: dev.frediver.se/frediverse/studio/z0:${APP_VERSION:-latest}
    restart: unless-stopped
    environment:
      <<: *shared-auth
      # z0's backend only; unset is none — e.g. "--latest".
      EXTRA_FLAGS: ${EXTRA_FLAGS:-}
      # Without this, nobody's group membership admits them to the editor,
      # presenter, monitor or remote — the game plays but stays unrunnable.
      AUTH_ADMIN_GROUPS: ${AUTH_ADMIN_GROUPS:-}
    networks:
      - traefik
    labels:
      - traefik.enable=true
      # More specific than st0's bare Host() rule, so it wins for /z0 on the same
      # hostname — an explicit priority, not left to rule-length inference, since a
      # mistake here means the game silently loses its own container to st0's.
      - traefik.http.routers.z0.rule=Host(`${ST0_DOMAIN:-st0.app}`) && PathPrefix(`/z0`)
      - traefik.http.routers.z0.priority=10
      - traefik.http.routers.z0.entrypoints=websecure
      - traefik.http.routers.z0.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.services.z0.loadbalancer.server.port=80

networks:
  traefik:
    external: true

volumes:
  library:
  workspaces:
  data:
  k7-data:
  pocketbase-data:
