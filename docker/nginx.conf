# This container's routing, one server{} block per app's OWN hostname — the edge (Traefik,
# docker-compose.yml) sends each request through unstripped, Host intact, and nginx picks the
# block by server_name. Each app's own rules are kept verbatim rather than merged into
# something cleverer: they encode websocket upgrades, streaming and timeouts that were each
# arrived at separately.
#
# z0 is the one app still living under st0's origin as a path prefix (/z0/*) rather than its
# own subdomain — it hasn't moved, so its block sits inside st0's, unchanged.
#
# Two things worth reading before editing anything below:
#
#   • `/auth/login` and `/auth/callback` are ONLY ever reached on st0's own hostname: every
#     app's "sign in" link sends the BROWSER there directly (an absolute, cross-origin
#     navigation, via `authOrigin`/`serviceUrl` in packages/web-protocol/services.ts), so only
#     one redirect_uri is ever registered at the IdP. `/auth/me` and `/auth/logout` are
#     different — every app's frontend still calls them as a bare, relative, same-origin
#     fetch, so EVERY block below proxies `/auth/` to st0's backend: not a browser redirect,
#     just this container answering that path from st0's process while the browser stays on
#     its own host. The shared `studio.sid` cookie (COOKIE_DOMAIN, see env.example.yaml) is
#     what makes that answer describe the same session no matter which hostname asked.
#   • pl8 and k7 each own their whole origin now, so unlike z0 they need no bare-prefix
#     redirect and no prefix stripped off their API paths — their `root` just points at that
#     app's own `dist`, copied into a same-named folder under /usr/share/nginx/html by the
#     Dockerfile (a plain directory name now, not a URL path).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name st0.app priv.st0.app;

    root /usr/share/nginx/html;
    index index.html;

    # k7's takes are the biggest bodies on the origin, but that's k7's own block now — this
    # server only fronts st0 and z0, neither of which uploads at that scale.
    client_max_body_size 64m;

    # ---- st0 — the DAW, and this origin's own root -------------------------
    # The engine websocket, exact-shaped so it wins over the API rule: the browser talks to
    # a moteur through the relay when it may not reach the machine directly, and that
    # connection is long-lived by nature.
    location ~ ^/api/engine/[^/]+/ws$ {
        proxy_pass http://127.0.0.1:8789;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8789;
        include /etc/nginx/snippets/proxy-common.conf;
        client_max_body_size 16m;
    }
    # MINTS the session (login/callback) here, and every app's /auth/me + /auth/logout answer
    # from this same backend too — see the file header.
    location /auth/ {
        proxy_pass http://127.0.0.1:8789;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    # ---- z0 — the blind test, six SPAs, still a path under this origin -----
    # This backend serves its routes at the ROOT, not under /api: the trailing
    # slash on proxy_pass drops the whole matched prefix, /z0/api/x -> /x.
    # That is what z0's own image did and what the dev proxy does.
    location /z0/api/ {
        proxy_pass http://127.0.0.1:8080/;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 50m;
    }
    # z0's OWN session (`bt_session`, a guest with a name and a seat) — not the
    # account flow at the origin root, which is st0's. See apps/z0/docs/auth.md.
    location /z0/auth/ {
        proxy_pass http://127.0.0.1:8080/auth/;
        include /etc/nginx/snippets/proxy-common.conf;
    }
    # Audio streams straight through: no buffering, and deliberately not the
    # common snippet — this one only ever needed Host.
    location /z0/audio/ {
        proxy_pass http://127.0.0.1:8080/audio/;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
    location /z0/ws {
        proxy_pass http://127.0.0.1:8080/ws;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    # Each SPA under its own folder. `^~` so the redirect-to-slash pair below
    # is never overtaken by a regex, and the bare name redirects rather than
    # falling through to z0's own index.
    location = /z0/buzzer { return 301 /z0/buzzer/; }
    location ^~ /z0/buzzer/ {
        try_files $uri $uri/ /z0/buzzer/index.html;
    }
    location = /z0/remote { return 301 /z0/remote/; }
    location ^~ /z0/remote/ {
        try_files $uri $uri/ /z0/remote/index.html;
    }
    # The editor is the one SPA here visited DEEP: st0's home page links a `.z0` row
    # straight to /z0/editor/<dépôt>/<projet.z0>, the address vocabulary of
    # @studio/web-protocol/projects. The fallback to its index is what lets the router
    # read that address as its basename — without this block the path would fall through
    # to `location /z0/` below and serve the GAME, which is the one thing a project link
    # must never do.
    location = /z0/editor { return 301 /z0/editor/; }
    location ^~ /z0/editor/ {
        try_files $uri $uri/ /z0/editor/index.html;
    }
    location = /z0/presenter { return 301 /z0/presenter/; }
    location ^~ /z0/presenter/ {
        try_files $uri $uri/ /z0/presenter/index.html;
    }
    location = /z0/monitor { return 301 /z0/monitor/; }
    location ^~ /z0/monitor/ {
        try_files $uri $uri/ /z0/monitor/index.html;
    }
    location = /z0 { return 301 /z0/; }
    location /z0/ {
        try_files $uri $uri/ /z0/index.html;
    }

    # The origin root: st0's SPA, its index.html and assets beside z0's own folder. Last, so
    # every prefix above has already had its say — and what falls through to it is
    # `/<dépôt>/<projet>`, an address st0 parses itself.
    location / {
        try_files $uri /index.html;
    }
}

# ---- pl8 — the médiathèque, its own subdomain -------------------------------
# It mounts no auth routes and only verifies the cookie st0 mints, same as k7.
server {
    listen 80;
    server_name play.st0.app play.priv.st0.app;

    root /usr/share/nginx/html/pl8;
    index index.html;

    location ~ ^/api/engine/[^/]+/ws$ {
        proxy_pass http://127.0.0.1:8795;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
    }
    # No URI on proxy_pass: the backend already serves these paths bare, and there is no
    # prefix left to strip. The streaming settings are this service's: it is the one that
    # moves audio.
    location /api/ {
        proxy_pass http://127.0.0.1:8795;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 512m;
    }
    location /auth/ {
        proxy_pass http://127.0.0.1:8789;
        include /etc/nginx/snippets/proxy-common.conf;
    }
    location / {
        try_files $uri /index.html;
    }
}

# ---- k7 — the rehearsal recorder, its own subdomain -------------------------
server {
    listen 80;
    server_name k7.st0.app k7.priv.st0.app;

    root /usr/share/nginx/html/k7;
    index index.html;

    # k7's takes are the biggest bodies on the origin.
    client_max_body_size 1024m;

    # The peer-connection signalling socket.
    location /rtc {
        proxy_pass http://127.0.0.1:8787;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        include /etc/nginx/snippets/proxy-common.conf;
    }
    location /auth/ {
        proxy_pass http://127.0.0.1:8789;
        include /etc/nginx/snippets/proxy-common.conf;
    }
    location / {
        try_files $uri /index.html;
    }
}
