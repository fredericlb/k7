# The signal graph, as SEGMENTS: each track and each module says where its signal
# goes next. The chains are DERIVED by following the arrows — a run breaks where the
# signal splits, and where two signals meet (which is what a bus is).
#
# `bypassed` lists the modules the signal passes through untouched.

tracks:
  melody: [ synth:lead ]
  pad: [ synth:pad ]
modules:
  synth:lead: [ OUT ]
  synth:pad: [ OUT ]
