# synth:lead — an INSTANCE of the "synth" module.
#
# An instance is a `<name>.cue` sitting beside module.cue in the module's own folder, and
# it inherits that module.cue automatically: there is no `extends` here because the FOLDER
# is the parent. Chains reference it as "synth:lead" (see chains.cue), and the generic
# "synth" stays usable on its own.
#
# So state only what THIS voice changes — the 4OSC plugin, the UI and the two automation
# curves all come from module.cue (which in turn extends instruments/fourosc). The merge
# order is: instruments/fourosc -> synth/module.cue -> this file, each winning per key.
params:
  Filter Freq: 90 # brighter than the shared default — this one has to cut through
