[package]
name = "studio-capot"
version = "0.0.1"
edition = "2021"
description = "studio menu-bar/tray engine supervisor"

[build-dependencies]
tauri-build = { version = "2", features = [] }

# This list is short on purpose. The tray is a VIEW over @studio/engine-host, so
# everything it used to need to BE a supervisor — an HTTP client, a WebSocket client, a
# hasher, MAC/hostname/IP enumeration, UUIDs, a process-table walker, URL parsing — went
# with the supervision. Thirteen crates left in one commit, `reqwest` (hyper + rustls +
# ring) and `tokio-tungstenite` among them. Adding one back here is a strong signal that
# logic is drifting into the view; put it in the supervisor instead.
#
# NOTE on TLS: dropping `reqwest` took `rustls-tls-native-roots` with it, and Node's
# `fetch` uses its own bundled roots. That is why the supervisor is launched with
# `--use-system-ca` — see hostcmd.rs, which explains what breaks without it.

[dependencies]
# tray-icon: TrayIconBuilder; image-png: load PNG tray icons via include_image!
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
# Deriving the snapshot/event mirror of hostProtocol.ts (host.rs), and writing commands.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `time` for the loop tickers, `signal` for the unix SIGTERM/SIGINT handler; the rest is
# what tauri's async runtime needs.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
# Local wall-clock for the merged log's `HH:MM:SS [tag]` prefix. std has no timezone
# support, so this stays: the format is contract with the web UI's Logs panel, which
# polls that file by byte offset.
chrono = { version = "0.4", features = ["clock"] }
# ~/.lanes resolution. The LAYOUT lives in engine-host's paths.ts; this is only the
# home dir the three remaining paths hang off.
dirs = "5"

# Windows Job Object (kill-on-close): the engine + file service, and every process they
# spawn, are put in a job that terminates them when the tray's last handle to it closes —
# which the OS does when the tray process ends, however it ends. This is the safety net
# for a force-kill or crash, where the graceful cleanup_async path never runs. Version
# matches the `windows` crate already in the tree (via tauri).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
] }

[profile.release]
opt-level = "s"
lto = "thin"
strip = true

[dev-dependencies]
# Only for the icon-dump test in trayicon.rs (PNG encoding); not linked into the app.
image = { version = "0.25", default-features = false, features = ["png"] }
