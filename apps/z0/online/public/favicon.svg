<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    Purple eighth-note with a white outline. Drawn as a single <text>
    element rendering the U+266A glyph; paint-order="stroke" puts the
    white stroke behind the purple fill, so the border appears entirely
    outside the colored shape (rather than centered on the path edge).
  -->
  <text
    x="50%"
    y="50%"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="Arial, Helvetica, sans-serif"
    font-size="56"
    font-weight="bold"
    fill="#a855f7"
    stroke="#ffffff"
    stroke-width="4"
    stroke-linejoin="round"
    paint-order="stroke"
  >♪</text>
</svg>
