map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# One origin, path-routed — the same layout the dev proxy serves:
#   /           → online          /buzzer     → buzzer
#   /remote     → remote          /editor     → editor
#   /presenter  → presenter       /monitor    → monitor
#   /api        → backend (prefix STRIPPED), plus /auth /audio /ws
server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 50m;

    root /usr/share/nginx/html;
    index index.html;

    # ─── Backend ────────────────────────────────────────────────────────────
    # /api/* → Node backend on 8080 with the /api prefix stripped: the backend
    # registers BARE paths (/solo/sessions, not /api/solo/sessions). Trailing
    # slashes on both `location` and `proxy_pass` are what strip it.
    location /api/ {
        proxy_pass http://127.0.0.1:8080/;
        include /etc/nginx/snippets/proxy-common.conf;
        # WS upgrade headers in case any /api/* path ever needs them
        # (none today, but harmless to forward).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # /auth/* keeps its prefix — the OIDC handlers register the bare
    # /auth/login, /auth/callback, etc. paths. Browser-driven (top-level
    # navigation), not fetch. The redirect_uri the backend derives per request
    # is <this-origin>/auth/callback, so this location IS the callback.
    location /auth/ {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    # /audio/* — cached audio served by the backend's file server. Streamed, so
    # disable proxy buffering and let timeouts go long.
    location /audio/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # /ws, /ws/buzzer — game-state + buzzer WebSockets.
    location /ws {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ─── SPAs ───────────────────────────────────────────────────────────────
    # Each falls back to its OWN index.html so client-side routing works under
    # the prefix. `^~` keeps /buzzer/ from being confused with a path like
    # /buzzerfoo, and the `= /buzzer` redirect gives the bare prefix its
    # trailing slash so relative asset URLs resolve (each vite `base` is
    # /<name>/).
    location = /buzzer { return 301 /buzzer/; }
    location ^~ /buzzer/ {
        try_files $uri $uri/ /buzzer/index.html;
    }

    location = /remote { return 301 /remote/; }
    location ^~ /remote/ {
        try_files $uri $uri/ /remote/index.html;
    }

    location = /editor { return 301 /editor/; }
    location ^~ /editor/ {
        try_files $uri $uri/ /editor/index.html;
    }

    location = /presenter { return 301 /presenter/; }
    location ^~ /presenter/ {
        try_files $uri $uri/ /presenter/index.html;
    }

    location = /monitor { return 301 /monitor/; }
    location ^~ /monitor/ {
        try_files $uri $uri/ /monitor/index.html;
    }

    # online owns the apex + the catch-all.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
