server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # This backend only carries auth handshakes and small registry JSON (express
    # caps its own body at 8mb). Project files never come through here — the
    # browser sends those straight to the engine host's file service — so there
    # is no large upload to size for.
    client_max_body_size 16m;

    # /api only. This backend no longer mounts /auth/* — st0 owns the origin-wide
    # OIDC flow now, because it is the service serving the origin ROOT and so the
    # only one whose redirect_uri has no prefix (backend/src/server.ts passes
    # `mountRoutes: []`). The edge routes /auth to st0's container and never here, so
    # matching it would only proxy to 404s and hide the real routing mistake.
    # The engine relay, and the ONLY thing on this origin that is upgraded. It needs
    # `Upgrade`/`Connection`, which the shared snippet does not carry — it fronts
    # ordinary requests — so it gets its own location. It must come BEFORE the /api
    # one below: nginx takes regex locations in the order they are written, and the
    # first match wins. Without this, the relay works behind Caddy in dev and fails
    # in production, which is the worst of the two. See
    # packages/engine-registry/docs/proxy.md.
    location ~ ^/api/engine/[^/]+/ws$ {
        proxy_pass http://127.0.0.1:8789;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # A tab driving an engine holds this open as long as it is playing; the
        # default 60s would cut a quiet transport off mid-session.
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
    }

    location ~ ^/api/ {
        proxy_pass http://127.0.0.1:8789;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    # The transport/meter socket still prefers to go from the browser DIRECTLY to the
    # chosen engine host (its ws:// URL comes from /api/engines at runtime), and that
    # stays the fast path. But it only works where the browser is allowed to open a
    # `ws://` — on an HTTPS page, the engine's own machine. Everywhere else the relay
    # above is the connection, which is why this origin now upgrades.

    location / {
        try_files $uri /index.html;
    }
}
