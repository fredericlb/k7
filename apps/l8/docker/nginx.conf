server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # This backend only carries auth handshakes and small registry JSON (express
    # caps its own body at 8mb). Project files never come through here — the
    # browser sends those straight to the engine host's file service — so there
    # is no large upload to size for.
    client_max_body_size 16m;

    # /api only. This backend no longer mounts /auth/* — st0 owns the origin-wide
    # OIDC flow now, because it is the service serving the origin ROOT and so the
    # only one whose redirect_uri has no prefix (backend/src/server.ts passes
    # `mountRoutes: []`). The edge routes /auth to st0's container and never here, so
    # matching it would only proxy to 404s and hide the real routing mistake.
    location ~ ^/api/ {
        proxy_pass http://127.0.0.1:8789;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    # No WebSocket location: the transport/meter socket goes from the browser
    # DIRECTLY to the chosen engine host (its ws:// URL comes from /api/engines
    # at runtime), never through this origin. Nothing here to upgrade.

    location / {
        try_files $uri /index.html;
    }
}
