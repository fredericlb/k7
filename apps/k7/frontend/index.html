<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0d0e11" />
    <!-- iOS grants a standalone launcher with no service worker and no https, which is the only
         way a surface loses its address bar on a tablet reaching this machine over the LAN.
         `black` and not `black-translucent`: the latter draws under the status bar. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="k7" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>k7 · editor</title>
    <!-- The startup splash, drawn before any script and replaced by React's first render (docs/icons.md).
         Hidden in a view too short to be a page: the desktop's 36-pixel tab strip loads this file too. -->
    <style>
      .k7-splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #07031F; }
      .k7-splash img { width: min(70vw, 420px); height: auto; }
      @media (max-height: 120px) { .k7-splash { display: none; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="k7-splash" role="status" aria-label="k7"><img src="/icon/k7-splash.svg" alt="" /></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
