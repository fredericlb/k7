server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Matches the express.raw limit on PUT /api/mediatek/file. A mismatch here is
    # the kind of fault that only appears on the big files: nginx would answer 413
    # itself, so the backend's own limit — and its error message — never runs.
    client_max_body_size 512m;

    # The engine relay, and the ONLY thing on this origin that is upgraded. It needs
    # `Upgrade`/`Connection`, which the shared snippet does not carry — it fronts
    # ordinary requests — so it gets its own location. It must come BEFORE the /api
    # one below: nginx takes regex locations in the order they are written, and the
    # first match wins. Without this, the relay works behind the dev proxy and fails
    # in production, which is the worst of the two. See
    # packages/engine-registry/docs/proxy.md.
    location ~ ^/api/engine/[^/]+/ws$ {
        proxy_pass http://127.0.0.1:8795;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # A tab driving an engine holds this open as long as it is playing; the
        # default 60s would cut a quiet transport off mid-session.
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
    }

    # /api is this service's own; /auth is the WHOLE origin's. st0 answers the origin
    # root, so it is the service whose redirect_uri has no prefix — see backend/src/
    # server.ts. The other studio containers never see /auth at all: the edge sends it
    # here, and they only verify the cookie this backend mints.
    location ~ ^/(api|auth)/ {
        proxy_pass http://127.0.0.1:8795;
        include /etc/nginx/snippets/proxy-common.conf;

        # This origin moves MEDIA, which is what makes it different from l8's.
        #
        # proxy_buffering off: without it nginx reads the whole upstream response
        # into memory and then to a temp file before sending a byte. On a video
        # that means the first frame waits for the last, and every Range request
        # the player makes pays it again — @frediverse/http's streamFile answers
        # 206 precisely so it does not have to.
        proxy_buffering off;
        # …and the same in the other direction, so an upload streams to disk
        # instead of being spooled whole by nginx first.
        proxy_request_buffering off;
        # A large upload over a slow link is a long-lived request that is doing
        # exactly what it should; the default 60s would cut it off mid-file.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # The module builder talks to an engine over a WebSocket, and prefers to reach it
    # DIRECTLY, cross-origin, without touching this container. That path stays, and
    # stays the fast one — but it only works where the browser is allowed to open a
    # `ws://`, which on an HTTPS page means the engine's own machine. Everywhere else
    # the relay above is the connection, which is why this origin now upgrades.

    location / {
        try_files $uri /index.html;
    }
}
