# The origin's path routing, owned by this container: the edge sends it the
# WHOLE origin unstripped and every prefix is resolved here. Each app's own
# rules are kept verbatim below rather than merged into something cleverer —
# they encode websocket upgrades, streaming and timeouts that were each arrived
# at separately.
#
# nginx picks the LONGEST prefix first and only then tries the regexes, which
# WIN over it when they match. That is what lets each app declare its engine
# websocket as an anchored regex above its own `…/api/` prefix rule.
#
# l8 answers the ROOT here, and pl8 — the médiathèque — sits under `/pl8`; it
# was the other way round until the editor became the studio's front door. Two
# consequences are worth reading before editing anything below:
#
#   • `/auth/*` still goes to pl8's backend even though pl8 is now prefixed.
#     The IdP has ONE registered redirect_uri and it is `<origin>/auth/callback`
#     with no prefix, so the flow cannot move under a path. It is the only rule
#     here that does not follow packages/web-protocol/services.ts.
#   • the root `location /` is l8's SPA, and l8 addresses a project as
#     `/<dépôt>/<projet>` — so the FIRST path segment of the origin is a
#     repository name. Every prefix claimed above it (`/pl8`, `/k7`, `/z0`,
#     `/api`, `/auth`) is therefore a repository short name that can never be
#     opened. See packages/web-protocol/projects.ts.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # k7's takes are the biggest bodies on the origin. Server-wide because
    # nginx applies this before routing anyway; each app then narrows it back
    # to the limit it declared when it had an image of its own.
    client_max_body_size 1024m;

    # ---- l8 — the DAW, and the origin itself -------------------------------
    # Its SPA is the root `location /` at the bottom of this file; only its API
    # is spelled here, and it sits at `/api` because l8 is the service with no
    # prefix. That backend is the engine registry and nothing else — the
    # repositories, the shares and the catalogue are all pl8's, under /pl8/api.
    #
    # The engine websocket, exact-shaped so it wins over the API rule: the
    # browser talks to a moteur through the relay when it may not reach the
    # machine directly, and that connection is long-lived by nature.
    location ~ ^/api/engine/[^/]+/ws$ {
        proxy_pass http://127.0.0.1:8789;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
    }
    # No URI on proxy_pass: nothing to strip, the path reaches the backend as
    # the browser spelled it. 16m — this one carries no uploads.
    location /api/ {
        proxy_pass http://127.0.0.1:8789;
        include /etc/nginx/snippets/proxy-common.conf;
        client_max_body_size 16m;
    }

    # ---- k7 — the rehearsal recorder ---------------------------------------
    # /k7/rtc is the peer-connection signalling socket.
    location /k7/rtc {
        proxy_pass http://127.0.0.1:8787/rtc;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
    location /k7/api/ {
        proxy_pass http://127.0.0.1:8787/api/;
        include /etc/nginx/snippets/proxy-common.conf;
    }
    location /k7/ {
        try_files $uri /k7/index.html;
    }

    # ---- z0 — the blind test, six SPAs -------------------------------------
    # This backend serves its routes at the ROOT, not under /api: the trailing
    # slash on proxy_pass drops the whole matched prefix, /z0/api/x -> /x.
    # That is what z0's own image did and what the dev proxy does.
    location /z0/api/ {
        proxy_pass http://127.0.0.1:8080/;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 50m;
    }
    # z0's OWN session (`bt_session`, a guest with a name and a seat) — not the
    # account flow at the origin root, which is pl8's. See apps/z0/docs/auth.md.
    location /z0/auth/ {
        proxy_pass http://127.0.0.1:8080/auth/;
        include /etc/nginx/snippets/proxy-common.conf;
    }
    # Audio streams straight through: no buffering, and deliberately not the
    # common snippet — this one only ever needed Host.
    location /z0/audio/ {
        proxy_pass http://127.0.0.1:8080/audio/;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
    location /z0/ws {
        proxy_pass http://127.0.0.1:8080/ws;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    # Each SPA under its own folder. `^~` so the redirect-to-slash pair below
    # is never overtaken by a regex, and the bare name redirects rather than
    # falling through to z0's own index.
    location = /z0/buzzer { return 301 /z0/buzzer/; }
    location ^~ /z0/buzzer/ {
        try_files $uri $uri/ /z0/buzzer/index.html;
    }
    location = /z0/remote { return 301 /z0/remote/; }
    location ^~ /z0/remote/ {
        try_files $uri $uri/ /z0/remote/index.html;
    }
    location = /z0/editor { return 301 /z0/editor/; }
    location ^~ /z0/editor/ {
        try_files $uri $uri/ /z0/editor/index.html;
    }
    location = /z0/presenter { return 301 /z0/presenter/; }
    location ^~ /z0/presenter/ {
        try_files $uri $uri/ /z0/presenter/index.html;
    }
    location = /z0/monitor { return 301 /z0/monitor/; }
    location ^~ /z0/monitor/ {
        try_files $uri $uri/ /z0/monitor/index.html;
    }
    location /z0/ {
        try_files $uri $uri/ /z0/index.html;
    }

    # ---- pl8 — the médiathèque ---------------------------------------------
    # Under a prefix like k7 and z0 since l8 took the root, with ONE exception:
    # /auth/* below, which stays at the origin root because that is the only
    # redirect_uri the IdP has. l8, k7 and z0 still only verify the cookie pl8
    # mints — moving the SPA changed nothing about who owns the flow.
    location ~ ^/pl8/api/engine/[^/]+/ws$ {
        proxy_pass http://127.0.0.1:8795;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
    }
    # proxy_pass with a URI swaps the matched prefix: /pl8/api/x -> /api/x, so
    # the backend keeps serving the root-anchored paths it always did. The
    # streaming settings are this service's: it is the one that moves audio.
    location /pl8/api/ {
        proxy_pass http://127.0.0.1:8795/api/;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 512m;
    }
    # The origin-wide OIDC flow, prefixless and pl8's — see the header of this
    # file. NOT `/pl8/auth/`: the callback the IdP redirects to has no prefix,
    # and a cookie minted under one would not be the cookie the others verify.
    location /auth/ {
        proxy_pass http://127.0.0.1:8795;
        include /etc/nginx/snippets/proxy-common.conf;
    }
    location /pl8/ {
        try_files $uri /pl8/index.html;
    }

    # The origin root: l8's SPA, its index.html and assets beside the app
    # folders. Last, so every prefix above has already had its say — and what
    # falls through to it is `/<dépôt>/<projet>`, an address l8 parses itself.
    location / {
        try_files $uri /index.html;
    }
}
