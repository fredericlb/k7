[package]
name = "k7-tray"
version = "0.1.0"
edition = "2021"
description = "k7's tray: runs k7's local backend, which runs the engine, and leads the browser to it"

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Short on purpose: the tray starts one process and draws one line. What k7 does happens in the backend and the
# supervisor; a crate added here for logic is logic in the wrong place (docs/tray.md).
[dependencies]
# tray-icon: TrayIconBuilder. No webview feature is used: the tray opens no window.
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
# The backend's status answer and standalone.json, both JSON.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Local wall-clock for the merged log's `HH:MM:SS [tag]` prefix, the web Logs panel's contract.
chrono = { version = "0.4", features = ["clock"] }
# The home directory `~/.k7` hangs off.
dirs = "5"
# The bearer the backend checks on the tray's status route.
getrandom = "0.3"
semver = "1"
# The unix SIGTERM/SIGINT handler, on the runtime Tauri already brings.
tokio = { version = "1", features = ["macros", "signal"] }

# Windows Job Object (kill-on-close): the backend and everything it starts die with the tray, however it ends.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
] }

[profile.release]
opt-level = "s"
lto = "thin"
strip = true

[dev-dependencies]
# Only for the icon-dump test in trayicon.rs (PNG encoding); not linked into the app.
image = { version = "0.25", default-features = false, features = ["png"] }
