# Wurlitzer [instrument] — le piano électrique à lames : deux paires FM sommées, une qui suit
# la note et tient, une qui reste à 510 Hz et claque. Porté de `stk::Wurley`.
#
# Sa DSP est décrite dans dsp.dsp à côté, en Faust, et c'est le MOTEUR qui la compile.
#
# IL NE SONNE PAS ENCORE, et pas parce qu'il serait faux : le moteur n'a pas de compilateur
# Faust, et un INSTRUMENT demande en plus une couture que la couture Faust n'a pas — MIDI en
# entrée, un répartiteur de voix, un greffon annoncé comme instrument. Les deux manques sont
# écrits dans engine/st0-engine/docs/faust.md ; ce dossier est la source, relisible et complète,
# qui sera jouée le jour où ils tombent. packages/dsp/docs/wurlitzer.md dit d'où viennent
# les nombres.
plugin:
  type: faust
  name: Wurlitzer
params:
  # `control1` et `control2` de STK. Ce sont les deux seuls réglages de l'instrument, et ils
  # valent 1 au repos — le réglage d'usine, pas un neutre choisi ici.
  Index: 1
  Tine: 1
  # À zéro : `modDepth_` de STK vaut zéro tant qu'un contrôleur ne l'ouvre pas.
  Vibrato: 0
# En un paragraphe : `freq`, `gain` et `gate` ne sont VOLONTAIREMENT pas dans la liste
# ci-dessus. Ce sont les trois noms que l'enveloppe polyphonique de Faust remplit à partir des
# notes reçues, et les inscrire ici en ferait trois potards figés qui écraseraient le jeu —
# une touche enfoncée n'est pas un réglage. C'est aussi ce qui distingue un instrument d'un
# effet dans cette écriture, et donc ce qui demande la seconde couture.
