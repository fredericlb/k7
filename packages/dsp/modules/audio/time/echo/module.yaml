# Echo  [audioEffect] — un délai à réinjection : le seul effet du pupitre au-delà du filtre.
#
# La boucle est tout le module. `Feedback` est LU par la somme qui alimente le délai et ÉCRIT par
# ce même délai une ligne plus loin ; dans la boucle par échantillon, cette lecture voit
# l'échantillon précédent. Rien ne déclare de cycle — c'est l'ordre des lignes qui est le circuit.
# Voir packages/dsp/src/echo.ts, dont ce jsdsp.ts est la copie.
#
# `Feedback` est plafonné sous 1 : à 1 la boucle ne décroît jamais, et un emballement n'est pas un
# réglage.
#
# CE QU'IL N'EST PAS : il n'est pas calé sur le tempo de la platine. `Time` est en millisecondes,
# posé à la main. Le pupitre connaît pourtant le BPM de chaque platine — c'est une liaison qui
# n'existe pas encore, pas une impossibilité. Voir packages/ui-turntables/docs/fx.md.
#
# Sa DSP est décrite dans jsdsp.ts à côté, pas compilée dans le moteur.
plugin:
  type: jsdsp
  name: Echo
params:
  # 375 ms — la croche pointée à 120 BPM, le délai dub qui décale au lieu de doubler. À la main :
  # rien ici ne suit la platine, donc c'est un point de départ et pas une réponse.
  Time: 375
  # Trois ou quatre répétitions audibles. Assez pour s'entendre, assez peu pour ne pas s'accumuler
  # quand on laisse le potard ouvert pendant un morceau entier.
  Feedback: 0.45
  # SEC au repos, et c'est la ligne qui compte : un effet qu'on pose ne doit pas s'entendre avant
  # qu'on le demande. C'est ce potard que le pupitre bouge.
  Mix: 0
# En un paragraphe : un écho. `Time` est l'écart entre deux répétitions, `Feedback` combien il en
# reste à chaque tour, `Mix` combien on en entend. Posé APRÈS le fader de voie, ce qui est ce qui
# permet l'echo-out : on coupe la voie et la queue continue de sonner toute seule.
#
# (La description d'un module est son en-tête, ici — voir packages/song/docs/docModules.md.)
