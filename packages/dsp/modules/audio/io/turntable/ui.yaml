# panel for @st0/audio/io/turntable
#
# Les quatre nombres du plateau. Un seul est un geste continu — `Rate` — d'où le fader ; les trois
# autres se posent.
#
# Les plages sont celles du PLUGIN, reprises telles quelles
# (engine/moteur/engine/TurntablePlugin.cpp) : une liaison du pupitre ne doit pas pouvoir demander
# une vitesse que ce panneau refuse de dessiner.
#
# `Rate` est SIGNÉ et son repos est 0, qui est l'ARRÊT. Le milieu de sa course n'est donc pas un
# neutre, contrairement à un potard d'EQ : un plateau n'a pas de position neutre, il a un arrêt, et
# la vitesse du disque est à 1. C'est la commande elle-même qui est ainsi.
#
# Le DISQUE n'est pas là, et ne peut pas y être : ce n'est pas un paramètre mais le champ `deckFile`
# du document, rempli à l'exécution par le pupitre. Voir docs/platter-node-plan.md.
cols: 2
rows: 3
widgets:
  rate:
    { type: fader, col: 0, row: 0, rowSpan: 3, label: Vitesse, bind: Rate, min: -4, max: 4, step: 0.01 }
  seek:
    { type: knob, col: 1, row: 0, label: Aiguille, bind: Seek, min: 0, max: 1, step: 0.001 }
  gain:
    { type: knob, col: 1, row: 1, label: Niveau, bind: Gain, min: 0, max: 2, step: 0.01 }
  # Un interrupteur et non un potard : tenir la hauteur est oui ou non, jamais dosé.
  key:
    { type: toggle, col: 1, row: 2, label: Key, bind: Key }
