# Stem separation — one mix in, four stems out, by neural inference on a file.
#
# `cold: true` for BOTH reasons the word covers: the answer needs the whole input, and the
# analysis is affordable once over a file and hopeless per block. Adding it to a chain fed by a
# live input is refused — see @studio/song's docs/coldModules.md.
#
# `plugin: {type: offline}` is the second load-bearing line, and it is what makes four outputs
# sayable at all. A chain step compiles to a serial insert on one Tracktion track — one buffer
# in, the same buffer out — so a module that FANS OUT cannot be a plugin. `offline` says there
# is no engine plugin: a pass writes the outputs to disk before the render. That is why this
# folder has no jsdsp.ts, unlike its neighbour normalize/.
#
# The model is named like any other file-valued param (`onnx:`, exactly as an amp names `nam:`),
# but 166 MB does not travel through a fork — so `assets/` declares it and the machine's model
# cache holds the bytes. See @studio/song's docs/moduleAssets.md.
cold: true
plugin: { type: offline, name: Stem Split }
# Four audio outputs, in the order the model returns them. The names are the port names a
# chains file wires: `stemsplit#vocals: [ reverb ]`.
outputs:
  - { name: drums, type: audio }
  - { name: bass, type: audio }
  - { name: other, type: audio }
  - { name: vocals, type: audio }
params:
  # HT-Demucs v4, weights stored fp16. Resolved against this module's assets/ first, then the
  # machine's ~/.st0/models — which is where a file this size actually lives.
  onnx: htdemucs_fp16weights.onnx
# In a paragraph: splits a mix into drums, bass, other and vocals. Runs offline on a file, never
# live — the model needs the whole input, and one pass takes minutes. The four stems are written
# as files beside the source, under stems/. (See packages/song/docs/docModules.md.)
