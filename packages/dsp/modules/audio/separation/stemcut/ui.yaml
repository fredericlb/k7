# panel for @st0/audio/separation/stemcut
#
# One knob, and its travel is SYMMETRIC like an EQ band's: the middle is the record as recorded,
# left takes the instrument out, right puts more of it in. A part of the instrument rather than a
# level in dB, so removing all of it is a position on the course.
cols: 1
rows: 1
widgets:
  level:
    { type: knob, col: 0, row: 0, label: Level, bind: Level, min: -1, max: 1 }
