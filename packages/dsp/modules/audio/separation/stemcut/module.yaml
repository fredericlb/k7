# Stem cut — change how much of one separated instrument is in the mix it came from.
#
# Fed a stem, it outputs that stem SCALED BY A SIGNED gain, so the lane it sits on is added to
# the mix beside it: negative subtracts the instrument, positive adds more of it. `Level: 0`
# outputs silence, which is what lets the mix come through untouched — packages/dsp/docs/stemcut.md.
#
# NOT `cold: true`, unlike its neighbour stemsplit. The separation is cold; scaling what it
# produces is one multiplication per sample, and the stem is an ordinary file on an ordinary lane.
plugin: { type: jsdsp, name: Stem Cut }
params:
  # −1 is gone, 0 is the record as recorded, 1 is twice as much. A proportion of the instrument
  # rather than a level in dB: full removal has to be reachable, which −∞ dB is not.
  Level: 0
# In a paragraph: adds or subtracts a stem to the mix it was separated out of. Put it on a lane
# playing one of `stems/`'s files, sum that lane with the original, and Level says how much of the
# instrument to add or take away. At 0 it is silent, so the original is heard exactly as on disk.
