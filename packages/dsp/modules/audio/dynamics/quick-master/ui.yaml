# panel for audio/dynamics/quick-master
#
# Trois blocs séparés par des titres, dans l'ordre où le signal les traverse. C'est le même
# découpage que la surface `mastering` dessine en grand (apps/st0/frontend/docs/mastering.md) —
# volontairement, parce que deux images d'un même module qui ne se rangent pas pareil obligent à
# réapprendre l'appareil selon l'écran qu'on regarde.
#
# Les plages reprises telles quelles du plugin, jamais resserrées : un potard dont la course ne
# couvre pas ce que le paramètre accepte cache une partie de l'appareil derrière le fichier.
cols: 4
rows: 6
widgets:
  titleComp:
    { type: label, col: 0, row: 0, colSpan: 4, text: Compresseur 3 bandes }
  lowAmount:
    { type: knob, col: 0, row: 1, label: Grave, bind: Low Amount, min: 0, max: 100, step: 1 }
  midAmount:
    { type: knob, col: 1, row: 1, label: Médium, bind: Mid Amount, min: 0, max: 100, step: 1 }
  highAmount:
    { type: knob, col: 2, row: 1, label: Aigu, bind: High Amount, min: 0, max: 100, step: 1 }
  # Les coupures, en dessous des quantités qu'elles délimitent. `curve: log` parce qu'une course
  # linéaire en hertz rampe puis s'emballe : la moitié du potard se passerait au-dessus de 4 kHz.
  lowFreq:
    { type: knob, col: 0, row: 2, label: Coupure grave, bind: Low Freq, min: 40, max: 500, step: 1, curve: log }
  highFreq:
    { type: knob, col: 1, row: 2, label: Coupure aiguë, bind: High Freq, min: 800, max: 8000, step: 10, curve: log }
  titleSpread:
    { type: label, col: 0, row: 3, colSpan: 2, text: Élargisseur }
  titleLimiter:
    { type: label, col: 2, row: 3, colSpan: 2, text: Limiteur }
  width:
    { type: knob, col: 0, row: 4, label: Largeur, bind: Width, min: 0, max: 200, step: 1 }
  # 0 est ARRÊT et non « 0 Hz » : sous 20 Hz le filtre n'a plus de coefficients, et c'est ce que
  # veut dire le bas de cette course.
  bassMono:
    { type: knob, col: 1, row: 4, label: Basses mono, bind: Bass Mono, min: 0, max: 300, step: 1 }
  drive:
    { type: knob, col: 2, row: 4, label: Drive, bind: Drive, min: 0, max: 12, step: 0.1 }
  ceiling:
    { type: knob, col: 3, row: 4, label: Plafond, bind: Ceiling, min: -12, max: 0, step: 0.1 }
  release:
    { type: knob, col: 2, row: 5, label: Release, bind: Release, min: 10, max: 500, step: 1 }
