# Quick Master  [audioEffect] — un bus master en un seul module : un compresseur 3 bandes, un
# élargisseur stéréo, un limiteur. Dans cet ordre, et dans cet ordre seulement.
#
# Pas de jsdsp, et cette fois ce n'est pas parce que le moteur hébergeait déjà l'effet : rien de
# tout cela n'est DESCRIPTIBLE avec les primitives de DspGraph. `biquad` et `gain` traitent le
# tampon entier sur place, donc on ne peut ni séparer ni recombiner des bandes ; et un fil audio
# est une PAIRE traitée à l'identique, donc un élargisseur — qui vit entièrement dans la
# différence entre les deux canaux — n'a rien à quoi s'accrocher. C'est donc un plugin compilé,
# `studio_quickmaster`, sur le modèle de `Mixer`.
#
# Le pourquoi de chaque valeur ci-dessous — où coupent les bandes, ce que « quantité » veut dire,
# ce que le plafond garantit vraiment — est dans engine/st0-engine/docs/quickMaster.md.
extends: "@engine/quick-master"
params:
  # Le module est un NOM et des DÉFAUTS par-dessus le plugin, exactement comme `eq3` l'est sur
  # l'égaliseur 4 bandes. Le PLUGIN sort neutre — trois quantités à zéro, largeur à 100 % — parce
  # qu'un built-in qu'on nomme directement ne doit rien faire qu'on n'ait demandé. Ici on demande :
  # « quick » veut dire que le poser suffit.
  #
  # Les coupures. 180 Hz sépare le bas du corps ; 3 kHz sépare le corps de la présence et de
  # l'air. Ce ne sont pas des réglages au sens des autres : ce sont elles qui définissent CE QU'EST
  # une bande, et les déplacer fait un autre découpage plutôt qu'un autre son.
  Low Freq: 180
  High Freq: 3000
  # Les trois quantités, décroissantes en montant. Le grave supporte — et demande — le plus de
  # compression : c'est là que vit l'énergie qui fait bouger le niveau général. L'aigu en demande
  # le moins, parce qu'une bande haute trop tenue s'entend immédiatement comme un souffle qui
  # respire derrière la musique.
  Low Amount: 25
  Mid Amount: 20
  High Amount: 15
  # L'élargisseur, discret : 110 % est un élargissement qu'on remarque sur un A/B et jamais tout
  # seul. Au-delà de ~130 % le mono commence à perdre des choses, et un master s'écoute en mono
  # quelque part.
  Width: 110
  # …et son autre moitié, qui est en réalité un rétrécissement : sous 120 Hz les deux canaux sont
  # ramenés au centre. Un grave large est un grave dont la moitié disparaît en mono et dont
  # l'autre moitié fait sauter le limiteur pour rien.
  Bass Mono: 120
  # Le limiteur. Pas de Drive par défaut : pousser dans le plafond est une décision de niveau, pas
  # un état de repos, et un module qu'on pose ne doit pas monter le volume tout seul.
  Drive: 0
  # -0,3 dB. Le plafond est un vrai plafond — un écrêteur derrière le limiteur le garantit — mais
  # 0 dBFS pile ne survit pas à un encodage MP3, qui reconstruit des échantillons entre les nôtres.
  Ceiling: -0.3
  # 120 ms : assez long pour ne pas pomper sur une nappe, assez court pour rendre la place après
  # un kick.
  Release: 120
