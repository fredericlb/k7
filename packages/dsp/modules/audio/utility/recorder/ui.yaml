# panel for @st0/audio/utility/recorder
#
# The waveform is most of the card, because it is the only thing that tells you the take is
# actually being made: a record light says the engine THINKS it is recording, and a growing
# envelope says samples are arriving. `source: take` is the take's own picture — the whole of it,
# growing — and not the live rolling window `input`/`output` draw.
#
# The three controls are intrinsics that FIRE rather than set, the rack pad's family
# (packages/ui-chains-react/docs/widgets.md). They carry no `bind` to a param because there is no
# param: a recorder has no knob.
cols: 3
rows: 4
widgets:
  wave: { type: waveform, col: 0, row: 0, colSpan: 3, rowSpan: 3, source: take }
  # Lit while rolling, off the state frame — never from the click, which would light on a refusal.
  rec: { type: button, col: 0, row: 3, label: "●", bind: "@rec:record" }
  # Pops the LAST take, so pressing it twice undoes two — see engine/moteur/docs/recorder.md.
  clear: { type: button, col: 1, row: 3, label: clear, bind: "@rec:clear" }
  # …and sends that one to the médiathèque's recordings zone (packages/mediatek/docs/recordings.md).
  save: { type: button, col: 2, row: 3, label: save, bind: "@rec:save" }
