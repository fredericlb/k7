# Recorder  [audioEffect] — a tape machine you drop in a chain. One audio in, one audio out, and
# what passes through it is UNCHANGED: the capture is a side effect, not a detour.
#
# It is FREE-RUNNING. Press record and it captures; press again and it stops. The transport is
# never consulted, which is the whole point — a `live` rig has no arrangement and never presses
# play (packages/song/docs/liveProject.md).
#
# Its DSP is the engine's own, compiled in: `type: internal`, and the name is the built-in's.
# See engine/moteur/docs/recorder.md for the ring, and what a `damaged` take means.
plugin:
  type: internal
  name: Recorder
# No `params:` — nothing here is a knob. Its three controls are INTRINSICS that fire rather than
# set (`@rec:record`, `@rec:clear`, `@rec:save`), which is why they live in ui.yaml and not here.
#
# In a paragraph: a recorder captures what passes through it, keeps its takes in a stack, and
# sends the one on top to the médiathèque's `recordings/` zone when you save. Nothing it does
# touches the sound.
#
# (A module's description is its header, here — see packages/song/docs/docModules.md.)
