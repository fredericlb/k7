# panel for @st0/audio/utility/fade
#
# One fader, drawn as a fader for the reason the crossfade beside it is: a fade has two ends and a
# middle. What it shows is this lane's own level — on a desk the two move in mirror, and each panel
# still reads true on its own.
cols: 1
rows: 2
widgets:
  mix:
    { type: fader, col: 0, row: 0, rowSpan: 2, label: Mix, bind: Mix, min: 0, max: 1 }
