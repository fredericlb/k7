# The turntable's own wiring, in member names. `assembly new` copies this in with every name
# swapped for the instance's, so a second box shares nothing with the first but its shape.
modules:
  # The record, through its own tempo, into the deck's bus — which the TRIM heads.
  deck: [ platter ]
  platter: [ tempo ]
  tempo: [ trim ]
  # …and one lane per separated instrument, each with its own reader, into the same bus.
  stemDrums: [ platterDrums ]
  platterDrums: [ trim ]
  stemBass: [ platterBass ]
  platterBass: [ trim ]
  stemOther: [ platterOther ]
  platterOther: [ trim ]
  stemVocals: [ platterVocals ]
  platterVocals: [ trim ]
  # The strip: trim, EQ, filter — then a SPLIT, the channel fader and the pre-fade tap.
  trim: [ eq ]
  eq: [ filter ]
  filter: [ level, cue ]
  cue: [ CUE ]
  # The echo sits AFTER the fader, so a cut leaves its tail ringing.
  level: [ echo ]
  echo: [ fade ]
  fade: [ MIX ]
# Every source is heard through its bus only: `out` is parallel, so an unmuted lane doubles.
bypassed: [ deck, stemDrums, stemBass, stemOther, stemVocals ]
# …and the strip's HEAD loses its dry path to the sum — see packages/song/docs/busOnly.md.
bus_only: [ trim ]
