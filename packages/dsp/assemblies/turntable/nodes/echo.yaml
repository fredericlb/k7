# The one effect past the filter, AFTER the fader so a cut leaves its tail ringing — an echo-out
# cuts a delay's input and not its output. See packages/k7-plugins/docs/turntables/fx.md.
extends: "@k7-core/audio/time/echo"
params:
  # A dotted eighth at 120 BPM — the dub delay that displaces rather than doubles.
  Time: 375
  # Three or four audible repeats: enough to hear, little enough not to pile up.
  Feedback: 0.45
# DRY at rest — the ENGINE's dry/wet, the delay's own being held at full wet; the one the desk drives.
mix: 0
