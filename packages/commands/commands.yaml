# commands.yaml — declarative command definitions (see commandSpec.ts).
#
# Each entry maps a command STRING (what you type in the web editor's command bar or
# after `st0 cmd`) to a feature SID (implemented in commands.ts), plus:
#   readable  ONE sentence saying what the command does, `en` and `fr`. This is what the
#             web palette LISTS and fuzzy-matches on — a person looking for a feature knows
#             what they want done, not what it is called. Kept apart from `help` rather than
#             replacing it: `help` is the CLI's fuller line and carries examples and caveats,
#             which are noise in a list you are scanning. Imperative, no example, no full
#             stop. Both languages are required — `commandSpec.test.ts` fails without them.
#             It states the ACTION and stops there — not its consequence, not its caveat,
#             not what it is good for. Those belong to `help`. **60 characters at most**, in
#             each language, and the test enforces it: the palette draws the sentence beside
#             the command's name on one row, so a line that runs past the row is either
#             truncated or wraps the list into a wall — and the extra words are the ones
#             saying what `help` already says.
#   surfaces  where the command appears (see commandSpec.ts). Only `cli` exists —
#             the web backend dispatches under it too, so every command runs on both;
#             the field is there for when a surface needs its own subset.
#   menu      which right-click menus may offer it, as MENU_ENTITIES in commandSpec.ts names
#             them. This is the entity under the POINTER, not the one the command acts on:
#             `event add` names a track and belongs on a TRACK's menu, while `event remove`
#             belongs on the event's. Absent = every menu whose click answers the command's
#             leading arguments, which is the derivation st0's right-click is built on — so
#             write one only to NARROW it. An unknown word is reported at load and dropped.
#             See apps/st0/frontend/docs/contextMenu.md.
#   args      trailing user args. Each may carry EITHER `complete:` — a named provider
#             in commandSpec.ts PROVIDERS, whose values come from the live project —
#             OR `values: [...]`, a closed set fixed by the command itself. An unknown
#             provider name is reported at load and fails the test suite.
#             `type:` (timecode | number | note) shape-checks a SINGLE-TOKEN argument
#             before the handler runs. An argument that swallows the rest of the line
#             (a message, a param name with spaces, a JSON payload) carries none.
#             `hint:` one line on what the argument ACCEPTS, shown beside the field in the
#             palette. Write one wherever the class's own clue is too vague to act on —
#             a range, a convention, a payload shape (see CLASS_HINT for the defaults).

# --- tracks / project ---
# The name is OPTIONAL: `track new` picks track-1, track-2, … but a track's name is its id and
# its filename, so naming it up front saves a rename later.
#
# ONE verb and no kind: a lane is not typed by what it carries
# (packages/song/docs/trackModules.md), so one lane holds clips and sequences alike. Seeding the
# empty sequence a lane plays is `sequence new`'s, a separate act.
#
# It DOES write the lane's strip, which is not a separate act: a lane with no `Mixer` module has
# nowhere to put a level, so its faders would draw and do nothing. See packages/song/docs/trackMixer.md.
- command: "track new"
  sid: track.new
  readable:
    en: "Add a track"
    fr: "Ajouter une piste"
  help: "add a track (e.g. track new gtr) — named track-N if you don't say"
  surfaces: [cli]
  args:
    [
      {
        name: name,
        optional: true,
        hint: "the track's id, which is its filename — optional",
      },
    ]
# A GROUP lane over tracks: its mute and solo reach every member, and the timeline draws it above them. The
# tracks come first so the timeline's right-click can fill them from the lanes shift-clicked; the name is
# optional. A track already in a group leaves it. See verbs/trackGroup.ts.
- command: "track group"
  sid: track.group
  readable:
    en: "Group the tracks"
    fr: "Grouper les pistes"
  help: "make a group of tracks (e.g. track group kick,snare drums) — named group-N if you don't say"
  surfaces: [cli]
  menu: [track]
  args:
    [
      { name: tracks, complete: tracks, hint: "track ids, comma-joined" },
      { name: name, optional: true, hint: "the group's id, which is its filename — optional" },
    ]
# Every lane coloured by its CATEGORY and the whole order stated — vox, drums, basses, guitars,
# keys, synths, the rest — shades of one colour within a category. Writes over the colours a lane
# had (an import brings its own), so it is one command and one undo. See
# packages/song-schema/docs/trackColor.md.
- command: "track arrange"
  sid: track.arrange
  readable:
    en: "Colour and order the tracks by instrument"
    fr: "Colorer et ordonner les pistes par instrument"
  help: "colour every track by its category (vox pink, drums red, basses brown, guitars green, keys blue, synths purple, the rest grey) and order them that way"
  surfaces: [cli, timeline]
# The order lanes are DRAWN and mixed in. A project states it or it does not: with no `trackOrder`
# the names decide (a "3." pin, then the instrument family), and the first reorder writes the whole
# list — half an order is not an order. See packages/song/docs/trackKind.md.
- command: "track order"
  sid: track.order
  readable:
    en: "Move a track to another position"
    fr: "Déplacer une piste à une autre position"
  help: "put a track at a position (e.g. track order gtr 2) — 1 is the top, past the end is the bottom"
  surfaces: [cli, timeline]
  menu: [track]
  args:
    [
      { name: track, complete: tracks },
      { name: position, hint: "1-based, counting lanes from the top" },
    ]
# `track transcribe` moved to the transcription plugin (@studio/st0-plugins) —
# its catalogue row is the plugin's declaration now (packages/st0-plugins/src/transcription).
# Two ways to make one lane into two, both copying its chain; the difference is the events.
- command: "track duplicate"
  sid: track.duplicate
  readable:
    en: "Duplicate a track with its chain and events"
    fr: "Dupliquer une piste avec sa chaîne et ses événements"
  help: "duplicate a track: same chain and same events (e.g. track duplicate gtr)"
  surfaces: [cli]
  menu: [track]
  args: [{ name: track, complete: tracks }]
- command: "track duplicate empty"
  sid: track.duplicate.empty
  readable:
    en: "Duplicate a track with its chain but no events"
    fr: "Dupliquer une piste avec sa chaîne sans événements"
  help: "duplicate a track with its chain, leaving the events empty (e.g. track duplicate empty gtr)"
  surfaces: [cli]
  menu: [track]
  args: [{ name: track, complete: tracks }]
# A lane's name IS its filename, prefix and position included, so the new name is typed whole — and
# the graph, the boxes, `trackOrder`, `soloed` and the strip named after the lane follow it.
- command: "track rename"
  sid: track.rename
  readable:
    en: "Rename a track and its file"
    fr: "Renommer une piste et son fichier"
  help: "rename a track — the whole name, prefix included, is its filename (e.g. track rename ge.lead vo.lead)"
  surfaces: [cli]
  menu: [track]
  args:
    [
      { name: track, complete: tracks },
      { name: name, hint: "the new name, prefix included — e.g. vo.lead" },
    ]
# Give a lane its input — what the per-track view's "audio in" and "midi in" buttons run. A chain
# project gets the input as a step of the lane's chain, just ahead of the lane; refused when one feeds it.
- command: "track input"
  sid: track.input
  readable:
    en: "Add an audio or MIDI input to a track"
    fr: "Ajouter une entrée audio ou MIDI à une piste"
  help: "create an input node feeding a track, audio or midi (e.g. track input gtr audio); refused when the track already has one"
  surfaces: [cli]
  menu: [track]
  args:
    [
      { name: track, complete: tracks },
      { name: kind, hint: "audio or midi" },
    ]
# Set a lane aside without deleting it: `hidden: true` on its chain, so nothing draws, compiles or plays
# it, and every file stays as written. A chain project's verb — see packages/song/docs/chainFiles.md.
- command: "track hide"
  sid: track.hide
  readable:
    en: "Hide a track from the timeline, graph and engine"
    fr: "Masquer une piste de la timeline, du graphe et du moteur"
  help: "set a track aside: its chain is marked hidden — not drawn, not played, files kept (e.g. track hide gtr); `track unhide` brings it back"
  surfaces: [cli]
  menu: [track]
  args: [{ name: track, complete: tracks }]
# A hidden lane is on no screen, so this one is typed: no menu could hold it.
- command: "track unhide"
  sid: track.unhide
  readable:
    en: "Show a hidden track again"
    fr: "Réafficher une piste masquée"
  help: "bring back a track `track hide` set aside (e.g. track unhide gtr)"
  surfaces: [cli]
  args: [{ name: track, hint: "the hidden track's name" }]
- command: "sequence new"
  sid: sequence.new
  readable:
    en: "Add an empty sequence"
    fr: "Ajouter une séquence vide"
  help: "add an empty 4-bar sequence to write notes into (e.g. sequence new lead)"
  surfaces: [cli]
  args:
    [
      {
        name: name,
        optional: true,
        hint: "the sequence's id, which is its filename — optional",
      },
    ]
# INSERT or DELETE a span of song time: everything after the point moves.
#
# `at` is a POSITION and `length` is a DURATION — the pair this vocabulary keeps having to say out
# loud, because both are legal timecodes and nothing downstream can tell them apart. From the
# timeline the caret pre-answers `at`, so it reads as "insert two bars here"; the argument is
# declared anyway, which is what keeps the verb usable from a terminal.
#
# What moves is everything positioned in SONG TIME and nothing else: every lane's events, its
# takes, its alternatives, the markers, every drawn curve's points, and the video lanes (in
# seconds — exact, because there is one tempo). A fade or a clip window is a DURATION and stays
# put. See @studio/song's docs/insertTime.md for the inventory.
#
# An event already playing ACROSS the point stays where it is, decided by its `start` — the same
# rule `events move` and `selection consolidate` follow. Cutting it instead would make this a verb
# that writes new material and renders audio (docs/materialCut.md).
# The SHAPE of a drawn curve, point by point — what the timeline's automation row is for.
#
# Without them a `custom` curve can only be created flat (`track automation add`) and shifted
# wholesale (`project add`), its individual points typed into the file by hand — a row drawing
# a picture nobody can grab.
#
# Addressed by TIME, because a curve is a function of song time: two points cannot share a moment,
# so the moment names one. `add` at a time that already has a point SETS that point rather than
# growing a twin, which is the same "one address, one value" rule a binding follows.
#
# `value` is 0..1 — the CURVE's range, not the param's. What it maps onto is the plugin's business,
# and one curve may be bound to more than one knob over its life.
#
# The LAST point cannot be removed: a custom curve with none does not load, and a curve file the
# loader refuses takes the whole project with it. Stopping the automation is
# `track automation remove`, which unbinds and leaves the curve where it is.
- command: "curve point add"
  sid: curve.point.add
  readable:
    en: "Place a point on a curve"
    fr: "Poser un point sur une courbe"
  help: "place (or set) a point on a drawn curve (e.g. curve point add sweep 5:1:1 0.8)"
  surfaces: [cli]
  menu: [curve]
  args:
    [
      { name: curve, complete: curves },
      { name: time, type: timecode },
      { name: value, type: number, hint: "0..1 — the curve's range, not the param's" },
    ]
- command: "curve point move"
  sid: curve.point.move
  readable:
    en: "Move a point on a curve"
    fr: "Déplacer un point sur une courbe"
  help: "move one point, keeping its value unless you give a new one (e.g. curve point move sweep 5:1:1 7:1:1)"
  surfaces: [cli]
  menu: [curve]
  args:
    [
      { name: curve, complete: curves },
      { name: time, type: timecode, hint: "where the point is NOW" },
      { name: newTime, type: timecode },
      {
        name: value,
        type: number,
        optional: true,
        hint: "0..1 — optional; kept as it was when you leave it out",
      },
    ]
- command: "curve point remove"
  sid: curve.point.remove
  readable:
    en: "Remove a point from a curve"
    fr: "Retirer un point d'une courbe"
  help: "remove one point from a drawn curve (e.g. curve point remove sweep 5:1:1)"
  surfaces: [cli]
  menu: [curve]
  args:
    [
      { name: curve, complete: curves },
      { name: time, type: timecode },
    ]

- command: "project add"
  sid: project.time.add
  readable:
    en: "Insert time into the song"
    fr: "Insérer du temps dans le morceau"
  help: "insert a span of time, pushing everything after it (e.g. project add 5:1:1 1:0)"
  surfaces: [cli]
  menu: [ruler]
  args:
    [
      { name: at, type: timecode },
      {
        name: length,
        type: timecode,
        hint: "a LENGTH, not a position — '1:0' is one bar",
      },
    ]
- command: "project remove"
  sid: project.time.remove
  readable:
    en: "Remove time from the song"
    fr: "Retirer du temps du morceau"
  help: "delete a span of time, pulling everything after it back (e.g. project remove 5:1:1 1:0)"
  surfaces: [cli]
  menu: [ruler]
  args:
    [
      { name: at, type: timecode },
      {
        name: length,
        type: timecode,
        hint: "a LENGTH — events starting inside it are removed",
      },
    ]
# The FRAME's shape, written as `project.viewport` — a pixel size, which is what every consumer
# reads; the ratio is the short name a person picks. The export fps, when the file states one as a
# third element, is kept. Two names for now: 16:9 and 9:16. See packages/song/docs/picture.md.
- command: "project aspect"
  sid: project.aspect
  readable:
    en: "Set the frame's shape"
    fr: "Choisir la forme du cadre"
  help: "set the viewport's aspect ratio (e.g. project aspect 16:9)"
  surfaces: [cli]
  args: [{ name: ratio, hint: "16:9 or 9:16" }]
- command: "project reload"
  sid: project.reload
  help: "reload the song from disk and re-send"
  surfaces: [cli]
  readable:
    en: "Reload the song from disk"
    fr: "Recharger le morceau depuis le disque"

# --- tasks (TODOS.md at the workspace root, a Markdown checklist) ---
# What is left to do, for the whole workspace rather than one song: a task may still name the song
# and the position it is about (`task mark`). A task is addressed by its NUMBER, as the panel lists
# them; the file stays one a person can edit by hand. See verbs/tasks.ts.
- command: "task add"
  sid: task.add
  readable:
    en: "Add a task"
    fr: "Ajouter une tâche"
  help: "add a task to the workspace's TODOS.md (e.g. task add bounce the bass)"
  surfaces: [cli]
  args: [{ name: text, hint: "the task — the rest of the line" }]
- command: "task mark"
  sid: task.mark
  readable:
    en: "Add a task at a position in this song"
    fr: "Ajouter une tâche à une position du morceau"
  help: "add a task pinned to this project at a timecode (e.g. task mark 49:1 fix the snare)"
  surfaces: [cli]
  args:
    [
      { name: timecode, type: timecode },
      { name: text, hint: "the task — the rest of the line" },
    ]
- command: "task done"
  sid: task.done
  readable:
    en: "Tick or untick a task"
    fr: "Cocher ou décocher une tâche"
  help: "tick a task, or untick it (e.g. task done 2)"
  surfaces: [cli]
  args: [{ name: number, hint: "the task's place in the list, from 1" }]
- command: "task remove"
  sid: task.remove
  readable:
    en: "Remove a task"
    fr: "Supprimer une tâche"
  help: "remove a task from the list (e.g. task remove 2)"
  surfaces: [cli]
  args: [{ name: number, hint: "the task's place in the list, from 1" }]

# --- mixer ---
# `track mute|solo` flip a flag; `gain`/`pan` SET a value. The verbs say which they
# are — these two never took a state to set, so naming them `mute`/`solo` implied one.
# Mute is the lane's bypass (graph.yaml's `bypassed:`); solo is PROJECT state —
# membership in project.yaml's root `soloed:` list, several lanes at once, resolved by
# the engine (any soloed track silences the rest).
- command: "track mute"
  sid: track.mute
  readable:
    en: "Mute or unmute a track"
    fr: "Couper ou rétablir le son d'une piste"
  help: "toggle a track's (or group's) mute"
  surfaces: [cli]
  menu: [track, group]
  args: [{ name: track, complete: tracks }]
- command: "track solo"
  sid: track.solo
  readable:
    en: "Solo a track"
    fr: "Mettre une piste en solo"
  help: "toggle a track's (or group's) solo (soloed tracks silence the rest)"
  surfaces: [cli]
  menu: [track, group]
  args: [{ name: track, complete: tracks }]
# The mixer's HIGHLIGHT: a lane heard 10 dB up while it is on, its fader untouched — project state
# like solo, at project.yaml's root. See @studio/song's docs/highlight.md.
- command: "track highlight"
  sid: track.highlight
  readable:
    en: "Highlight a track, 10 dB up"
    fr: "Mettre une piste en avant, +10 dB"
  help: "toggle a track's highlight: it plays 10 dB louder while it is on, its fader left as it is (e.g. track highlight gtr)"
  surfaces: [cli]
  menu: [track]
  args: [{ name: track, complete: tracks }]
# A lane's alternatives and its freeze are addressed as a module's: `node alternative *` and
# `node freeze`, since a lane IS a module. See packages/song/docs/trackModules.md.

# The AUTOMATION of a track's sound, addressed from the LANE rather than from the module.
#
# A binding lives on the module — `automations: [{param, curve}]`, keyed by param, one knob one
# curve — and a track owns one only because the automated module sits in its chain. So these two
# are a VIEW onto `node automate` and write through the same writer; there is no second place a
# binding is stored. The reason they are worth their own verb: an automation lane is reached from
# the lane, and asking someone which module in their chain owns "Filter Freq" before they can draw
# a curve against it is asking them to hold the graph in their head to edit the arrangement.
#
# `add` also CREATES the curve — a flat one at wherever the knob currently sits, so binding it
# changes nothing until you move it. It refuses when it cannot tell where that is, because a flat
# curve at the wrong height is an audible jump on a verb that promised to do nothing.
#
# The param is everything after the track, spaces and all: "Filter Freq" is one argument. Two
# modules on one chain sharing a param name is a real shape and there is no defensible way to
# pick, so that is refused by name and sent to `node automate`, which can say which.
- command: "track automation add"
  sid: track.automation.add
  readable:
    en: "Automate a parameter of this track"
    fr: "Automatiser un paramètre de cette piste"
  help: "draw a curve against one of a track's parameters (e.g. track automation add gtr Filter Freq)"
  surfaces: [cli]
  menu: [track]
  args:
    [
      { name: track, complete: tracks },
      { name: param, hint: "the parameter's name, spaces and all" },
    ]
- command: "track automation remove"
  sid: track.automation.remove
  readable:
    en: "Stop automating a parameter"
    fr: "Cesser d'automatiser un paramètre"
  help: "unbind a track's automation, leaving the curve file (e.g. track automation remove gtr Filter Freq)"
  surfaces: [cli]
  menu: [track]
  args:
    [
      { name: track, complete: tracks },
      { name: param, hint: "the parameter's name, spaces and all" },
    ]

# --- recording ---
# `rec` toggles a track's record ARM. Unlike mute/solo it writes no file: arming is
# session state, held only by the engine (which is the one long-lived process the
# CLI and the web share) and gone when it exits. A track with no input can't be
# armed — there'd be nothing to capture. Armed tracks record when the transport
# rolls, so there is no separate "record" verb: you arm, then you play.

- command: "track process"
  sid: track.process
  readable:
    en: "Bounce a track through a chain, for good"
    fr: "Traiter une piste dans une chaîne, définitivement"
  help: "bounce every file a track's clips play through a chain and keep the result (e.g. track process gtr @st0/amp-room)"
  surfaces: [cli]
  menu: [track]
  args: [{ name: track, complete: tracks }, { name: chain, complete: chains }]
- command: "clip process"
  sid: clip.process
  readable:
    en: "Bounce a clip through a chain, for good"
    fr: "Traiter un clip dans une chaîne, définitivement"
  help: "bounce one clip's file through a chain and keep the result (e.g. clip process riff @st0/amp-room)"
  surfaces: [cli]
  args:
    [
      { name: clip, complete: clipTargets },
      { name: chain, complete: chains },
    ]

# There is no `track normalize` / `clip normalize`. Normalising is a TREATMENT, and the two
# commands above are how a treatment is applied: the médiathèque ships a `normalize` module, so a
# chain naming it does the job through `track process` / `clip process` — over a whole track's
# files or over one clip's — and can be followed by something. See docs/processChain.md.

# Cut the silence off both ends of ONE EVENT. It moves that event's WINDOW (`from`/`to` on the
# placement) and never the audio: a take's head is the tail of a count-in and the player settling,
# its foot is a room and a hand leaving a string, and both are things you stop PLAYING rather than
# things you want destroyed. One line to put back, where a rewritten wav is a restore from the undo
# journal. The gate is dBFS, default -40 — below a room's floor on any usable take, above true
# digital silence. Nothing above the gate changes nothing, and says so.
#
# There is no clip window: a clip file describes the bytes, a placement describes the use (see
# song/docs/materialCut.md). So the verb names the EVENT it acts on, like every other `event …`,
# and trimming one placement leaves the others alone by construction rather than by warning.
#
# It looks only INSIDE what that event already plays, and can only narrow it: a gate reaching past
# the window would cut on evidence nobody could see, and material an earlier trim removed comes
# back through undo, deliberately.
- command: "event trim"
  sid: event.trim
  readable:
    en: "Cut the silence off both ends of one event"
    fr: "Couper le silence aux deux bouts d'un evenement"
  help: "trim one event's head and tail at a gate (e.g. event trim vox 24:1 -40)"
  surfaces: [cli]
  menu: [event]
  args:
    [
      { name: track, complete: tracks },
      { name: timecode, type: timecode },
      {
        name: gate,
        type: number,
        optional: true,
        hint: "the gate in dBFS — a negative number, default -40",
      },
    ]

# A clip's STRETCH points: which moment of the source lands on which beat. One verb places a point
# and moves one, because from the waveform they are one gesture — you drag a mark to a beat, and
# whether it was already there is not something you decide beforehand. Moving one leaves its
# NEIGHBOURS where they are: only the two segments touching it change rate, which is what every DAW
# does and the only version you can predict from the handle you are holding.
# A clip with no map yet gets its two anchors seeded (start and end). That map is an IDENTITY and
# the engine skips it, so seeding alone changes no sound — the third point is what makes it a warp.
- command: "clip warp"
  sid: clip.warp
  readable:
    en: "Place or move a clip's stretch point"
    fr: "Poser ou déplacer un point de tirage d'un clip"
  help: "pin a moment of the source to a beat (e.g. clip warp break 1.94 4)"
  surfaces: [cli]
  args:
    [
      { name: clip, complete: clipTargets },
      { name: sec, type: number, hint: "seconds into the SOURCE file" },
      { name: beat, type: number, hint: "the beat that moment should land on" },
    ]
- command: "clip warp remove"
  sid: clip.warpRemove
  readable:
    en: "Remove a clip's stretch point"
    fr: "Retirer un point de tirage d'un clip"
  help: "drop one stretch point (e.g. clip warp remove break 1.94)"
  surfaces: [cli]
  menu: [warp]
  args:
    [
      { name: clip, complete: clipTargets },
      { name: sec, type: number, hint: "seconds into the SOURCE file" },
    ]

# --- a clip's onsets ---
# Corrections to what the engine detected, in SECONDS into the source file. Kept as a difference, so
# they survive re-detecting at another sensitivity — see packages/song/src/onsets.ts. A time within
# 25 ms of an existing onset means that one, so an approximate second is enough.
- command: "clip onset add"
  sid: clip.onset.add
  readable:
    en: "Mark an onset the detector missed"
    fr: "Ajouter une attaque que le détecteur a manquée"
  help: "mark an onset the detector missed (e.g. clip onset add prise-01 1.25)"
  surfaces: [cli]
  args:
    [
      { name: clip, complete: clipTargets },
      { name: sec, type: number, hint: "seconds into the source file" },
    ]
- command: "clip onset remove"
  sid: clip.onset.remove
  readable:
    en: "Remove an onset the detector got wrong"
    fr: "Retirer une attaque détectée à tort"
  help: "refuse an onset the detector found (e.g. clip onset remove prise-01 1.25)"
  surfaces: [cli]
  args:
    [
      { name: clip, complete: clipTargets },
      { name: sec, type: number, hint: "seconds into the source file" },
    ]
- command: "clip onset move"
  sid: clip.onset.move
  readable:
    en: "Move an onset to the right place"
    fr: "Déplacer une attaque au bon endroit"
  help: "move an onset (e.g. clip onset move prise-01 1.25 1.31)"
  surfaces: [cli]
  args:
    [
      { name: clip, complete: clipTargets },
      { name: from-sec, type: number, hint: "the onset to move, in seconds" },
      { name: to-sec, type: number, hint: "where it belongs, in seconds" },
    ]

# --- sequences ---
- command: "sequence list"
  sid: sequence.list
  help: "list MIDI sequences"
  surfaces: [cli]
  readable:
    en: "List the MIDI sequences"
    fr: "Lister les séquences MIDI"
# Add a note to a sequence. `note` is a name (C4, F#3) or a MIDI number; `start`/`end`
# are beats (end − start is the length). The piano roll's left-click-drag runs this.
- command: "sequence note new"
  sid: sequence.addNote
  readable:
    en: "Add a note to a sequence"
    fr: "Ajouter une note à une séquence"
  help: "add one note to a sequence (e.g. sequence note new melody C4 4 6)"
  surfaces: [cli]
  args:
    [
      { name: sequence, complete: sequenceFiles },
      { name: note, type: note },
      { name: start, type: number, hint: "beats from the start of the sequence" },
      { name: end, type: number, hint: "beats — end − start is the note's length" },
    ]

# Set one note's VELOCITY, addressing it the way the roll does: by key and by where it
# starts. 0..1, as the file states it — `1` clears the field rather than writing the
# schema's own default back into a file that never mentioned it. The piano roll's
# velocity drag runs this on release.
- command: "sequence note velocity"
  sid: sequence.noteVelocity
  readable:
    en: "Set a note's velocity"
    fr: "Régler la vélocité d'une note"
  help: "set one note's velocity, 0..1 (e.g. sequence note velocity melody C4 4 0.7)"
  surfaces: [cli]
  args:
    [
      { name: sequence, complete: sequenceFiles },
      { name: note, type: note },
      { name: start, type: number, hint: "beats from the start of the sequence" },
      { name: velocity, type: number, hint: "0..1 — 1 clears the field" },
    ]

# A PAD's two effects, in the step sequencer. Both address a note the way every other note verb
# does — by key and by where it starts — and both take `off` to remove the effect rather than a 0
# or a 1: the file has no way to write "plays once, every pass", because that is a pad with neither
# key. The ENGINE is what realises them; the compiled document carries them unexpanded so the
# sequencer keeps drawing one pattern rather than its expansion. See @studio/song docs/padEffects.md.
#
# The context menu offers 2 and 4 for each; the schema accepts any whole number from 2 up, so a
# triplet feel can be typed even though no menu row offers it.
- command: "sequence note repeat"
  sid: sequence.noteRepeat
  readable:
    en: "Retrigger a pad inside its own step"
    fr: "Répéter un pad dans son propre pas"
  help: "retrigger one pad n times inside its step (e.g. sequence note repeat drums C1 4 2)"
  surfaces: [cli]
  menu: [pad]
  args:
    [
      { name: sequence, complete: sequenceFiles },
      { name: note, type: note },
      { name: start, type: number, hint: "beats from the start of the sequence" },
      { name: n, hint: "2 or more — how many hits fit the step; off removes it" },
    ]

- command: "sequence note skip"
  sid: sequence.noteSkip
  readable:
    en: "Silence a pad on every nth pass"
    fr: "Rendre un pad muet une passe sur n"
  help: "silence one pad every nth pass of the pattern (e.g. sequence note skip drums C1 4 2)"
  surfaces: [cli]
  menu: [pad]
  args:
    [
      { name: sequence, complete: sequenceFiles },
      { name: note, type: note },
      { name: start, type: number, hint: "beats from the start of the sequence" },
      { name: n, hint: "2 plays one pass in two, 4 plays three in four; off removes it" },
    ]

# Move a note and/or change its length, addressing it the way the roll does: by key and by where
# it starts NOW. One verb for both, because on the roll they are one gesture with two grips —
# dragging the body moves it, dragging an edge stretches it — and two verbs would be two answers
# to "which note is this" that must agree for ever. The piano roll's note drag runs this on
# release, like the timeline's clip drag runs `event move`.
- command: "sequence note timerange"
  sid: sequence.noteTimeRange
  readable:
    en: "Move a note or change its length"
    fr: "Déplacer une note ou changer sa longueur"
  help: "move/stretch one note (e.g. sequence note timerange melody C4 4 4.5 6)"
  surfaces: [cli]
  args:
    [
      { name: sequence, complete: sequenceFiles },
      { name: note, type: note },
      { name: start, type: number, hint: "where it starts NOW, in beats" },
      { name: newStart, type: number, hint: "where it should start, in beats" },
      { name: newEnd, type: number, hint: "where it should end — end − start is its length" },
    ]

# Move one note to another key and/or start, KEEPING what it is: its length and its velocity
# ride along, because it is the same note put somewhere else. Remove-then-add would lose both —
# `sequence note new` takes no velocity — and be two journal steps for one act. The step
# sequencer's ctrl-drag runs this. A destination that already holds a note is refused: (key,
# start) is how every surface addresses one.
- command: "sequence note move"
  sid: sequence.moveNote
  readable:
    en: "Move a note to another key or beat"
    fr: "Déplacer une note vers une autre touche ou un autre temps"
  help: "move one note, keeping its length and velocity (e.g. sequence note move drums C1 4 D1 4.5)"
  surfaces: [cli]
  args:
    [
      { name: sequence, complete: sequenceFiles },
      { name: note, type: note },
      { name: start, type: number, hint: "beats — where it starts NOW" },
      { name: newNote, type: note },
      { name: newStart, type: number, hint: "beats — where it should start" },
    ]

# Cut one note in two at a beat — the roll's counterpart of `event split`. The note keeps its
# head and a second note carries the rest, so one attack becomes two. Its VELOCITY rides onto
# both halves: what a note is worth is a property of the sound, and cutting it does not make the
# tail quieter. Refused on either edge, where one half would have no length.
- command: "sequence note split"
  sid: sequence.splitNote
  readable:
    en: "Split a note in two"
    fr: "Couper une note en deux"
  help: "cut one note in two (e.g. sequence note split melody C4 4 5)"
  surfaces: [cli]
  menu: [note]
  args:
    [
      { name: sequence, complete: sequenceFiles },
      { name: note, type: note },
      { name: start, type: number, hint: "beats — where it starts NOW" },
      { name: at, type: number, hint: "beats — where to cut, inside the note" },
    ]

# Remove one note, addressed the way every note edit addresses one: by key and by where it
# starts. The step sequencer's button-off runs this; the roll has no delete gesture yet.
# Twice as long, playing twice. What a length IS here is the window: `from`/`to` when the file
# states them, else the notes' extent rounded up to the bar — so an unwindowed sequence is left
# unwindowed, its extent doubling on its own once the copies are in. The notes the window HOLDS
# are copied one window later, which is the same "in when it STARTS inside" rule every bulk edit
# in this family follows. See packages/song-schema/docs/noteEdits.md.
- command: "sequence double"
  sid: sequence.double
  readable:
    en: "Double a sequence's length, playing it twice"
    fr: "Doubler la longueur d'une séquence, jouée deux fois"
  help: "double a sequence: its window twice as long, its notes played twice (e.g. sequence double drums)"
  surfaces: [cli]
  args: [{ name: sequence, complete: sequenceFiles }]
- command: "sequence note remove"
  sid: sequence.removeNote
  readable:
    en: "Remove a note from a sequence"
    fr: "Retirer une note d'une séquence"
  help: "remove one note (e.g. sequence note remove drums C1 4)"
  surfaces: [cli]
  menu: [note]
  args:
    [
      { name: sequence, complete: sequenceFiles },
      { name: note, type: note },
      { name: start, type: number, hint: "beats from the start of the sequence" },
    ]

# Append a batch of already-timed notes to a sequence — the commit half of the web
# editor's MIDI recording. `notes` is a JSON array of {t,d,k,v?} in clip-local beats.
# Programmatic (the recorder builds the payload), so it's on the CLI mostly for parity.
- command: "sequence note add"
  sid: sequence.recordNotes
  readable:
    en: "Append already-timed notes to a sequence"
    fr: "Ajouter des notes déjà datées à une séquence"
  help: "append a batch of already-timed notes to a sequence (JSON payload)"
  surfaces: [cli]
  args:
    [
      { name: sequence, complete: sequenceFiles },
      { name: notes, hint: "JSON [{t,d,k,v?}] — beats from the start of the clip" },
    ]

# The same commit for a lane that holds NO sequence yet: a new one around the notes, placed on
# the lane, in one write so the take is one undo. `notes` are in SONG beats.
- command: "sequence record"
  sid: sequence.record
  readable:
    en: "Record notes into a new sequence on a lane"
    fr: "Enregistrer des notes dans une nouvelle séquence"
  help: "record notes into a new sequence placed on a lane (JSON payload, song beats)"
  surfaces: [cli]
  args:
    [
      { name: track, complete: tracks },
      { name: notes, hint: "JSON [{t,d,k,v?}] — beats from the start of the song" },
    ]

# The four verbs that take a RECTANGLE rather than one note, which is why they are `notes`
# and not `note`: two keys inclusive and a half-open beat span, exactly the box the piano
# roll's `v` selection draws. A note is in when it STARTS inside, whatever its length does
# past the far edge. Each is ONE pass over the file and so one undo — running the singular
# verb N times would be N journal entries, and half of them could land while the rest fail.
# An empty rectangle is refused by name; a pad's `repeat`/`skip` are never touched.
# See @studio/song-schema docs/noteEdits.md.
- command: "sequence notes remove"
  sid: sequence.notesRemove
  readable:
    en: "Delete the notes in a region"
    fr: "Supprimer les notes d'une région"
  help: "remove every note in a region (e.g. sequence notes remove melody C4 C5 0 4)"
  surfaces: [cli]
  menu: [note]
  args:
    [
      { name: sequence, complete: sequenceFiles },
      { name: loNote, type: note },
      { name: hiNote, type: note },
      { name: from, type: number, hint: "beats from the start of the sequence" },
      { name: to, type: number, hint: "beats — the far edge, excluded" },
    ]

# Clamped onto the keyboard rather than dropped off it: a note that vanished would leave the
# rest transposed and no way to say what went. The engine's `transpose` NODE clamps for a
# harder reason still — a dropped note leaves its note-off behind and hangs the voice.
- command: "sequence notes transpose"
  sid: sequence.notesTranspose
  readable:
    en: "Transpose the notes in a region"
    fr: "Transposer les notes d'une région"
  help: "shift every note in a region by n semitones (e.g. sequence notes transpose melody C4 C5 0 4 12)"
  surfaces: [cli]
  menu: [note]
  args:
    [
      { name: sequence, complete: sequenceFiles },
      { name: loNote, type: note },
      { name: hiNote, type: note },
      { name: from, type: number, hint: "beats from the start of the sequence" },
      { name: to, type: number, hint: "beats — the far edge, excluded" },
      { name: semitones, type: number, hint: "whole semitones, negative to go down" },
    ]

# The ONSET moves and the length is kept: quantizing the end too would be two edits under one
# verb, and a run of notes would grow or shrink as a side effect of being lined up.
- command: "sequence notes quantize"
  sid: sequence.notesQuantize
  readable:
    en: "Line the notes in a region up on a grid"
    fr: "Aligner les notes d'une région sur une grille"
  help: "snap every note's start in a region to a grid, in beats (e.g. sequence notes quantize melody C4 C5 0 4 0.25)"
  surfaces: [cli]
  menu: [note]
  args:
    [
      { name: sequence, complete: sequenceFiles },
      { name: loNote, type: note },
      { name: hiNote, type: note },
      { name: from, type: number, hint: "beats from the start of the sequence" },
      { name: to, type: number, hint: "beats — the far edge, excluded" },
      { name: grid, type: number, hint: "beats per step — 0.25 is a sixteenth in 4/4" },
    ]

# Absolute, not a factor, and 1 CLEARS the field like the singular verb: a region set to full
# leaves a file that never mentions velocity, which is what an untouched sequence looks like.
- command: "sequence notes velocity"
  sid: sequence.notesVelocity
  readable:
    en: "Set the velocity of the notes in a region"
    fr: "Régler la vélocité des notes d'une région"
  help: "set every note's velocity in a region, 0..1 (e.g. sequence notes velocity melody C4 C5 0 4 0.7)"
  surfaces: [cli]
  menu: [note]
  args:
    [
      { name: sequence, complete: sequenceFiles },
      { name: loNote, type: note },
      { name: hiNote, type: note },
      { name: from, type: number, hint: "beats from the start of the sequence" },
      { name: to, type: number, hint: "beats — the far edge, excluded" },
      { name: velocity, type: number, hint: "0..1 — 1 clears the field" },
    ]

# A dragged SELECTION, and not a rectangle verb: every note names its own destination, since a
# step grid's rows are rack sounds and not a key range. One write, so one Ctrl+Z; a note may land
# where another MOVING note leaves, never on one that stays. See @studio/song-schema docs/noteEdits.md.
- command: "sequence notes move"
  sid: sequence.notesMove
  readable:
    en: "Move several notes at once"
    fr: "Déplacer plusieurs notes à la fois"
  help: "move several notes in one write (e.g. sequence notes move drums [[36,0,38,1],[42,0.5,42,1.5]])"
  surfaces: [cli]
  args:
    [
      { name: sequence, complete: sequenceFiles },
      { name: moves, hint: "JSON [[note,start,newNote,newStart],…] — beats from the start of the sequence" },
    ]

# --- curves (automation shapes) ---
# A curve is a normalised function of song time, living in curves/<id>.yaml, which a
# module's `automation:` then binds to a parameter. Creating one is its own step because
# the binding names it: you make the curve, then point a parameter at it.
- command: "curve new"
  sid: curve.create
  readable:
    en: "Create an automation curve"
    fr: "Créer une courbe d'automation"
  help: "create an automation curve (e.g. curve new sweep) — an LFO you then edit"
  surfaces: [cli]
  args: [{ name: name, hint: "the curve's id — it is the filename, so letters, digits, '_' and '-'" }]

# A curve written WHOLE from its fields — what the curve editor (`ui curve`) saves, creating the curve
# or replacing it. The JSON is the file's own fields, so one save is one command and one undo.
- command: "curve set"
  sid: curve.set
  readable:
    en: "Write a curve from its fields"
    fr: "Écrire une courbe depuis ses champs"
  help: 'write a curve whole, creating or replacing it (e.g. curve set wobble {"type":"lfo","shape":"saw","frequency":2,"phase":0,"amplitude":0.5})'
  surfaces: [cli]
  args:
    [
      { name: curve, complete: curves },
      {
        name: fields,
        hint: "JSON — type (lfo|custom|adsr) and its fields: shape, frequency, phase, amplitude, polarity, attack…, points, condition",
      },
    ]

# --- surfaces (the special views a project asks for) ---
# A project draws nothing it has not declared: the arrangement, the frame, the desk and the
# mastering strip are all files in surfaces/. Under `project` with the markers, because a surface is a property of the PROJECT rather than of anything in it.
# There is no layout argument — every type is drawn in exactly one, and the schema refuses the
# other, so it is derived. See packages/song/docs/surfaces.md.
- command: "project surface new"
  sid: project.surface.create
  readable:
    # Kept under 60 characters in both languages: the palette draws this beside the command's
    # name on one row (commandSpec.test.ts). A fourth type is what dropped the articles.
    en: "Add a surface — arrangement, frame, desk or master"
    fr: "Ajouter une surface — arrangement, image, platines, master"
  help: "declare a special view (e.g. project surface new timeline, or project surface new turntables desk)"
  surfaces: [cli]
  args:
    [
      { name: type, complete: surfaceTypes },
      { name: id, hint: "the surface's id — the filename, and what /surface/<id> says. Defaults to the type." },
    ]

# Bind a curve to one of a module's parameters — the other half of `curve new`, and what a
# cable dropped from a curve onto a knob runs. Keyed by PARAM: one knob is driven by one
# curve, so binding a second replaces the first rather than stacking two lanes onto it.
#
# `trigger` is for an ENVELOPE (a curve of type adsr): the module whose note-ons restart it.
# Left out, it is the module being automated — a filter envelope follows its own synth. It is
# what the event cable on the graph writes.
- command: "node automate"
  sid: node.automate
  readable:
    en: "Drive a module's parameter with a curve"
    fr: "Piloter un paramètre de module avec une courbe"
  help: "bind a curve to a param (e.g. node automate osc 'Filter Freq' sweep)"
  surfaces: [cli]
  menu: [node, param]
  args:
    [
      { name: module, complete: modules },
      { name: param, hint: "the parameter's name, as the module writes it" },
      { name: curve, complete: curves, hint: "a curve id — 'none' takes the binding off" },
      {
        name: trigger,
        complete: modules,
        optional: true,
        hint: "an envelope's trigger: the module whose note-ons restart it",
      },
    ]

# The song's OUTPUT level — the `Volume` on the OUT node, and the one global level in the app.
#
# `node param "OUT" Volume <dB>` is the SAME write (one implementation, `writeMasterVolume`), and is
# what the header's fader and its Fix button both send. This verb stays because it is the line a
# person types, and because a node whose param lives in `project.yaml` deserves a name that says so.
#
# It is the SONG's, not the machine's: it travels in a share, and it is metered — the header bar
# reads the mix with this applied, which is what lets Fix write it and see the clip light clear.
# A level that only changed what you hear in this room would be a preference in a different file.
#
# It runs -100..+12 dB, and the top is real rather than borrowed. Tracktion's own master fader stops
# at +6 — its curve is `exp((dB - 6) / 20)` clamped to 1, so everything above set the same position,
# silently — so the engine applies this with a gain of its OWN instead (MasterGainPlugin), dB
# straight to a linear factor. Outside the range it is REFUSED rather than clamped: a fader that
# answers 20 with 12 is worse than one that says no. See @studio/song's docs/masterVolume.md,
# including why the output is rarely where a quiet mix's headroom actually is.
- command: "project master"
  sid: project.master
  readable:
    en: "Set the song's output level"
    fr: "Régler le niveau de sortie du morceau"
  help: "set the song's output level in dB, -100..+12 (e.g. project master -3) — 0 is unity"
  surfaces: [cli]
  args: [{ name: db, type: number, hint: "dB — 0 is unity, +12 the top of the fader" }]

# The summing CONSOLE over the whole mix: a system of a library's `console/`, whose CHANNEL the compile
# puts after every lane's strip and whose BUSS it puts first on the master. One setting and not two
# modules, because the halves only work as a matched pair. See @studio/song's docs/console.md.
- command: "project console"
  sid: project.console
  readable:
    en: "Choose the mix's console"
    fr: "Choisir la console du mix"
  help: "run the whole mix through a summing console (e.g. project console @st0/console/console-6), or none; with no name, list them"
  surfaces: [cli]
  args: [{ name: system, optional: true, hint: "@<library>/console/<system>, or none" }]

# The TAGS the home page files a song under, `project.tags` in project.yaml. The tag is the rest of the
# line; case does not make a second one. See verbs/projectTags.ts.
- command: "project tag"
  sid: project.tag
  readable:
    en: "Tag the project"
    fr: "Étiqueter le projet"
  help: "add a tag to this project, shown beside it on the home page (e.g. project tag to mix); with no tag, list them"
  surfaces: [cli]
  args: [{ name: tag, optional: true, hint: "the tag — the rest of the line" }]
- command: "project untag"
  sid: project.untag
  readable:
    en: "Remove a tag from the project"
    fr: "Retirer une étiquette du projet"
  help: "remove a tag from this project (e.g. project untag to mix)"
  surfaces: [cli]
  args: [{ name: tag, hint: "the tag — the rest of the line" }]

# --- markers (timeline cue points) ---
# A marker names a timeline position. `timecode` is bar:beat:sixteenth (5, 5:1, 5:1:1);
# the name is the rest of the line, so it may contain spaces. Stored in project.cue's
# top-level `markers` map. The timeline draws them and offers "add marker" on right-click.
- command: "project marker new"
  sid: project.marker.create
  readable:
    en: "Add a marker to the timeline"
    fr: "Ajouter un repère sur la timeline"
  help: "add a named timeline marker (e.g. project marker new 5:1:1 Chorus)"
  surfaces: [cli]
  menu: [ruler]
  args:
    [
      { name: timecode, type: timecode },
      { name: name, hint: "the marker's name — the rest of the line, spaces allowed" },
    ]
- command: "project marker delete"
  sid: project.marker.delete
  readable:
    en: "Delete a marker"
    fr: "Supprimer un repère"
  help: "remove a marker by name (e.g. project marker delete Chorus)"
  surfaces: [cli]
  menu: [marker]
  args: [{ name: name, complete: markerNames }]

# --- the machine's plugins ---
# `system` is what the MACHINE has, not what this song uses: the plugin cache belongs to the
# engine's installation and outlives every project. That is why these two are not `module`
# verbs — they answer "what is installed here", where a `module` verb acts on a file in the
# song. A format filter is an ARGUMENT of the listing, not a second verb.
- command: "system plugins list"
  sid: system.plugins.list
  help: "list all cached plugins (a word narrows it by format, e.g. system plugins list vst)"
  surfaces: [cli]
  readable:
    en: "List every cached plugin"
    fr: "Lister tous les greffons en cache"
  args:
    [
      {
        name: format,
        optional: true,
        hint: "narrow by format — vst, vst3, au… (default: every one)",
      },
    ]
- command: "system plugins scan"
  sid: system.plugins.scan
  help: "scan installed plugins and refresh the cache"
  surfaces: [cli]
  readable:
    en: "Scan the installed plugins again"
    fr: "Rescanner les greffons installés"
# An INSTANCE is a node in this project's chains — one use of a module — and its external UI is
# the plugin's own window, drawn by the plugin itself on the engine's machine. It names the
# INSTANCE and not the module: a module is a file, the window belongs to what the engine loaded.
- command: "node external-ui"
  sid: node.externalUi
  readable:
    en: "Open an instance's own plugin window"
    fr: "Ouvrir la fenêtre native d'une instance"
  help: "open the plugin's own UI window for one instance"
  surfaces: [cli]
  menu: [node]
  args: [{ name: module, complete: modules }]

# --- channel labels (global user preferences) ---
# Choosing the audio INTERFACE is not here on purpose: it's a one-off rig decision, not a
# per-song edit, so it lives in the médiathèque's « État du moteur » — the one screen that
# reaches both the engine and its machine, which a pick needs (engine/st0-engine/docs/audioDevice.md).
# These labels just annotate that rig, so they stay on every surface.
- command: "system channel list"
  sid: system.channel.list
  help: "show the input/output channel labels"
  surfaces: [cli]
  readable:
    en: "Show the channel labels"
    fr: "Afficher les libellés des canaux"
- command: "system channel clear"
  sid: system.channel.clear
  readable:
    en: "Remove a channel label"
    fr: "Retirer le libellé d'un canal"
  help: "remove a channel label (e.g. system channel clear in 3+4)"
  surfaces: [cli]
  args:
    [
      { name: dir, values: [in, out] },
      { name: chans, hint: "one channel or a pair — 3, or 3+4 for a stereo pair" },
    ]
- command: "system channel set"
  sid: system.channel.set
  readable:
    en: "Give channels a label"
    fr: "Nommer des canaux"
  help: "label channels (e.g. system channel set in 3+4 synth)"
  surfaces: [cli]
  args:
    [
      { name: dir, values: [in, out] },
      { name: chans, hint: "one channel or a pair — 3, or 3+4 for a stereo pair" },
      { name: label, hint: "what to call them — the rest of the line" },
    ]
# Two inputs heard as ONE device, or taken apart again. A fact about the rig like the labels
# above, stored beside them (`inputPairs` in preferences.yaml) and replayed to the engine on
# every connect — so the engine is told NOW as well, and the two cannot disagree.
#
# No `in|out`, unlike its neighbours: only inputs are paired. An output pair is what a mix
# already is, and the engine has no verb for one.
- command: "system channel type"
  sid: system.channel.type
  readable:
    en: "Pair two inputs into one, or split them"
    fr: "Apparier deux entrées, ou les séparer"
  help: "make an input pair stereo or mono (e.g. system channel type 3 stereo) — either half names the pair"
  surfaces: [cli]
  args:
    [
      {
        name: channel,
        type: number,
        hint: "either half of the pair — 3 and 4 both name 3+4",
      },
      { name: mode, values: [mono, stereo] },
    ]

# WHICH CHAIN SEPARATES a record into stems, asked once and kept in preferences.yaml beside the
# rig's other standing answers.
#
# It is a `system` verb rather than a project one because the answer does not vary by project:
# which module separates and which model it wants is a fact about the library and about this
# machine's ~/.st0/models. Every surface that could start a separation reads it — the playlist
# panel's button, a desk catching up on an unprepared record — which is precisely why none of them
# asks for a chain. Naming one in three places would be three places to get it wrong.
#
# The chain is CHECKED here, against the open project, and refused if it does not separate: this is
# the cheap moment to find that out, rather than thirty songs into a set list. With no project open
# it is stored unchecked and says so — a `@st0/…` ref has nothing to resolve against.
- command: "system stems"
  sid: system.stems
  readable:
    en: "Set the chain that separates a record into stems"
    fr: "Choisir la chaîne qui sépare un morceau en stems"
  help: "remember which chain separates (e.g. system stems @st0/stems) — an empty ref clears it"
  surfaces: [cli]
  args:
    [
      {
        name: chain,
        complete: chains,
        hint: "a chain that SEPARATES — one offline step and nothing else",
      },
    ]

# …AND WHICH CHAIN gives a record WITHOUT ITS VOICE, asked once and kept beside the answer above.
#
# A second chain rather than a flag on the first, because it is a different chain: the same model,
# a module declaring `instrumental` as its single output, so the pass sums what it separated
# instead of writing four files. What a caller wants back is what decides which one is read.
#
# The check here is stricter than `system stems`'. A chain that separates but declares no
# `instrumental` output is refused, since collecting four stems and calling one of them the
# instrumental is exactly the mistake this verb exists to prevent.
- command: "system instrumental"
  sid: system.instrumental
  readable:
    en: "Set the chain that gives a record without its voice"
    fr: "Choisir la chaîne qui donne un morceau sans sa voix"
  help: "remember which chain makes the instrumental (e.g. system instrumental @st0/instrumental) — an empty ref clears it"
  surfaces: [cli]
  args:
    [
      {
        name: chain,
        complete: chains,
        hint: "a chain whose offline step declares an `instrumental` output",
      },
    ]

# WHAT THIS MACHINE SEPARATES ON — the ONNX execution providers, in the order they are tried.
#
# The default is `cpu` alone, and that is a decision rather than timidity: asking for `dml` first
# was a GUESS about the hardware, and on a rig where it is wrong the job does not fall back — it
# HANGS, un-interruptible from JavaScript, holding a worker and 26 GB until the job's hour is up.
# CPU is four times faster than real time and cannot be unavailable. A machine that measured a
# faster provider says so here, once, and it survives every restart.
- command: "system onnx"
  sid: system.onnx
  readable:
    en: "Set the execution providers separation runs on"
    fr: "Choisir sur quoi tourne la séparation en stems"
  help: "remember what this machine separates on (e.g. system onnx dml,cpu) — empty goes back to cpu"
  surfaces: [cli]
  args:
    [
      {
        name: providers,
        hint: "in order, comma or space separated — cpu, dml, cuda, coreml",
      },
    ]

# WHICH PAIR the `CUE` bus leaves by — the headphones, on a desk. Kept beside the answers above and
# for the same reason: an interface has one headphone socket whatever project is open, so this is a
# fact about the rig. See packages/song/docs/cue.md.
#
# Unset is a legitimate state and not a half-configured one: a laptop with a single output pair has
# nowhere to send a cue, and a CUE bus on such a machine plays NOWHERE — deliberately silent rather
# than folded into the mix, which would put the headphone feed into the room with nothing to say so.
- command: "system cue"
  sid: system.cue
  readable:
    en: "Set the interface pair the headphone CUE leaves by"
    fr: "Choisir la paire de sortie du casque"
  help: "remember the headphone pair (e.g. system cue 3+4, or a label from `system channel list`) — empty clears it"
  surfaces: [cli]
  args:
    [
      {
        name: channels,
        hint: "the output channels — 3+4, or a label you gave them",
      },
    ]

# --- which version of each library the workspace plays (see docs/library-versions-plan.md) ---
# The pin is the WORKSPACE's, in `_library-pins.yaml`, so neither verb needs a project open.
# Upgrading never changes a fork: it names the `_modules` ones whose base moved, to listen again.
- command: "library versions"
  sid: library.versions
  readable:
    en: "Show the library versions this workspace plays"
    fr: "Versions des bibliothèques jouées par cet espace"
  help: "each library: the version pinned here, the versions this machine holds, and whether a newer one is ready"
  surfaces: [cli]
  args: []
- command: "library upgrade"
  sid: library.upgrade
  readable:
    en: "Move this workspace to another library version"
    fr: "Passer cet espace à une autre version de bibliothèque"
  help: "move the pin (e.g. library upgrade st0, or library upgrade st0 3) — unsaid, the newest version this st0 runs; a version that needs a newer st0 is refused"
  surfaces: [cli]
  args:
    [
      { name: library, complete: libraries },
      {
        name: version,
        optional: true,
        hint: "a version number, or draft — unsaid, the newest this st0 runs",
      },
    ]

# --- the workspace's set lists (see @studio/song's docs/playlists.md) ---
# A playlist belongs to the REPOSITORY rather than to a song: it lives in `_playlists/` at the
# workspace root, so these two are the only verbs here that need no project open. The songs
# they name are the médiathèque's and are kept verbatim — nothing checks them from here.
- command: "playlist new"
  sid: playlist.new
  readable:
    en: "Create a set list in this repository"
    fr: "Créer une playlist dans ce dépôt"
  help: "create an empty playlist (e.g. playlist new ete-2026) — it lands in _playlists/"
  surfaces: [cli]
  args:
    [
      {
        name: name,
        hint: "what to call it — subfolders count (live/repet), .yaml is added",
      },
    ]
# Prepare a whole set at once: separate every song the playlist names, so a deck can subtract a
# stem live. Minutes per song — this is the command you run the night before, not during.
# The chain DEFAULTS to the machine's — `system stems` — and naming one here is the override, for
# the run that wants a different model. Requiring it would ask the same question of the same person
# at every use: which module separates and which model it wants does not vary by set list.
- command: "playlist stems"
  sid: playlist.stems
  readable:
    en: "Separate every song of a set list into stems"
    fr: "Séparer en stems tous les morceaux d'une playlist"
  help: "prepare a set: separate every song of a playlist (e.g. playlist stems ete-2026) — the chain is this machine's unless named, and songs already done are skipped"
  surfaces: [cli]
  args:
    [
      { name: playlist, complete: playlists },
      {
        name: chain,
        complete: chains,
        optional: true,
        hint: "a chain that SEPARATES — omitted, the one `system stems` remembers",
      },
    ]
- command: "playlist song add"
  sid: playlist.song.add
  readable:
    en: "Add a song to the end of a set list"
    fr: "Ajouter un morceau à la fin d'une playlist"
  help: 'append a song (e.g. playlist song add ete-2026 "AC-DC/Back in Black/Hells Bells" live) — quote the song to name a variant after it'
  surfaces: [cli]
  args:
    [
      { name: playlist, complete: playlists },
      {
        name: song,
        hint: "its path under songs/ or just its name — the rest of the line, unless quoted",
      },
      {
        name: variant,
        optional: true,
        hint: "one of that song's versions — only readable after a QUOTED song",
      },
    ]
# Both of these count from 1, and by POSITION rather than by song: a set list may name one song
# twice — an encore, a segue played again — and there is no defensible way to pick between them.
# The position is what the screen shows beside each line, so the two agree without anybody counting.
- command: "playlist song remove"
  sid: playlist.song.remove
  readable:
    en: "Remove one song from a set list"
    fr: "Retirer un morceau d'une playlist"
  help: "drop a line by its position (e.g. playlist song remove ete-2026 3) — the numbers are the ones beside the songs"
  surfaces: [cli]
  args:
    [
      { name: playlist, complete: playlists },
      { name: position, hint: "which line, counting from 1" },
    ]
- command: "playlist song move"
  sid: playlist.song.move
  readable:
    en: "Move a song to another place in a set list"
    fr: "Déplacer un morceau dans une playlist"
  help: "reorder a line (e.g. playlist song move ete-2026 5 1 puts the fifth song first) — both count from 1"
  surfaces: [cli]
  args:
    [
      { name: playlist, complete: playlists },
      { name: from, hint: "the line to move, counting from 1" },
      { name: to, hint: "where it lands, counting from 1" },
    ]

# --- the song's PICTURE (see apps/st0/frontend/docs/picture.md) ---
# A shot is addressed by the lane and by WHERE IT STARTS, in the wall-clock dialect the lane file
# itself speaks — seconds (12.5) or m:ss (1:30.5), never bar:beat:tick. The file is in seconds and
# there is one tempo, so a musical spelling would be a second dialect for the same number.
# Two shots starting at the same instant on one lane are refused rather than guessed between: the
# format allows the pair and nothing here may pick one.
# The one picture verb that MAKES something, and the only one writing two files: the lane, and
# `project.layers`, which is what says a lane exists and in which order it draws. A lane missing
# from that list fails the picture compile by name, so the two are one act.
- command: "picture lane new"
  sid: picture.laneNew
  readable:
    en: "Add a picture lane"
    fr: "Ajouter une piste vidéo"
  help: "add a video lane (e.g. picture lane new broll) — named layer-N if you don't say"
  surfaces: [cli, timeline]
  args:
    [
      {
        name: name,
        optional: true,
        hint: "the lane's id, which is its filename — optional",
      },
    ]
# `layers:` is the draw order AND the membership, so reordering picture is one list write and
# needs no second field. Bottom first, which is the order the timeline draws its picture rows in.
- command: "picture lane order"
  sid: picture.laneOrder
  readable:
    en: "Move a picture lane to another position"
    fr: "Déplacer une piste vidéo à une autre position"
  help: "reorder a video lane (e.g. picture lane order pip 1) — 1 draws first, so it sits under the rest"
  surfaces: [cli, timeline]
  args:
    [
      { name: lane, complete: pictureLanes },
      { name: position, hint: "1-based in `layers`, bottom first" },
    ]
# WHERE in the frame a lane draws, in viewport px — the one picture verb about geometry rather
# than about time. A lane stating no rect fills the frame, so this is what a viewport drag writes
# the moment you move or resize one. See apps/st0/frontend/docs/picture.md.
# A lane's two mixer words, spelled for PICTURE. `mute` is HIDDEN — there is no sound on a lane —
# and lives in the lane's own file. `solo` is `soloed:` at project.yaml's root, the SAME list audio
# uses: each compile filters it to its own lanes, so soloing a shot silences nothing.
- command: "picture mute"
  sid: picture.mute
  readable:
    en: "Hide or show a picture lane"
    fr: "Masquer ou afficher une piste vidéo"
  help: "toggle a video lane's mute — which on picture means hidden (e.g. picture mute pip)"
  surfaces: [cli, timeline]
  args: [{ name: lane, complete: pictureLanes }]
- command: "picture solo"
  sid: picture.solo
  readable:
    en: "Solo a picture lane"
    fr: "Isoler une piste vidéo"
  help: "toggle a video lane's solo — soloed lanes hide the rest of the picture (e.g. picture solo pip)"
  surfaces: [cli, timeline]
  args: [{ name: lane, complete: pictureLanes }]
- command: "picture rect"
  sid: picture.rect
  readable:
    en: "Set where a picture lane draws"
    fr: "Placer une piste vidéo dans le cadre"
  help: "place and size a lane in the frame (e.g. picture rect pip 960 540 320 180) — viewport px"
  surfaces: [cli, viewport]
  args:
    [
      { name: lane, complete: pictureLanes },
      { name: x, hint: "px from the frame's left edge" },
      { name: y, hint: "px from its top edge" },
      { name: w, hint: "width in px" },
      { name: h, hint: "height in px" },
    ]
- command: "picture move"
  sid: picture.move
  readable:
    en: "Move a shot along its lane"
    fr: "Déplacer un plan sur sa piste"
  help: "move a shot (e.g. picture move main 12.5 20) — writes `start`, the body drag's field"
  surfaces: [cli, timeline]
  menu: [shot]
  args:
    [
      { name: lane, complete: pictureLanes },
      { name: at, hint: "where the shot starts now — seconds or m:ss" },
      { name: to, hint: "where it goes" },
    ]
- command: "picture length"
  sid: picture.length
  readable:
    en: "Set how long a shot lasts"
    fr: "Régler la durée d'un plan"
  help: "set a shot's extent (e.g. picture length main 12.5 4) — 0 runs to the end of the source"
  surfaces: [cli, timeline]
  menu: [shot]
  args:
    [
      { name: lane, complete: pictureLanes },
      { name: at, hint: "where the shot starts — seconds or m:ss" },
      { name: seconds, hint: "how long it lasts; 0 means to the end of its source" },
    ]
- command: "picture head"
  sid: picture.head
  readable:
    en: "Trim a shot's head, holding its tail"
    fr: "Rogner le début d'un plan sans bouger sa fin"
  help: "trim the head (e.g. picture head main 12.5 14) — moves start, source_from and length together, so the tail stays put"
  surfaces: [cli, timeline]
  menu: [shot]
  args:
    [
      { name: lane, complete: pictureLanes },
      { name: at, hint: "where the shot starts now — seconds or m:ss" },
      { name: to, hint: "where its head goes; the frame under it does not change" },
    ]
- command: "picture delete"
  sid: picture.delete
  readable:
    en: "Remove a shot from its lane"
    fr: "Retirer un plan de sa piste"
  help: "drop a placement (e.g. picture delete main 12.5) — the clip it names stays, a lane holding only placements"
  surfaces: [cli, timeline]
  menu: [shot]
  args:
    [
      { name: lane, complete: pictureLanes },
      { name: at, hint: "where the shot starts — seconds or m:ss" },
    ]
# A picture split is VIRTUAL — two placements of one clip — where an audio one renders two files:
# a shot has no material of its own to process, so there is nothing a second file would buy.
- command: "picture split"
  sid: picture.split
  readable:
    en: "Split a shot in two"
    fr: "Couper un plan en deux"
  help: "cut one shot in two at a time inside it (e.g. picture split main 4 6.5) — two placements of the same clip"
  surfaces: [cli, timeline]
  args:
    [
      { name: lane, complete: pictureLanes },
      { name: at, hint: "where the shot starts — seconds or m:ss" },
      { name: where, hint: "where to cut — seconds or m:ss, inside the shot" },
    ]
- command: "picture add"
  sid: picture.add
  readable:
    en: "Place a shot on a lane"
    fr: "Poser un plan sur une piste"
  help: "place a clip (e.g. picture add main shot_a 12.5 4) — the ref is a clips/ entry, reported rather than refused when there is none"
  surfaces: [cli, timeline]
  args:
    [
      { name: lane, complete: pictureLanes },
      { name: ref, hint: "a clips/ id whose source is a video file" },
      { name: at, hint: "where it lands — seconds or m:ss" },
      {
        name: length,
        optional: true,
        hint: "how long it lasts; omitted, it runs to the end of its source",
      },
      {
        name: sourceFrom,
        optional: true,
        hint: "how far into the source the shot starts",
      },
    ]
# The shots' sound is played by the ENGINE, from an audio lane naming this one: each clip's sound is
# extracted once, beside its video, and the lane is made if none plays it yet — so it is safe to rerun.
- command: "picture sound"
  sid: picture.sound
  readable:
    en: "Hear this lane's shots"
    fr: "Entendre les plans de cette piste"
  help: "play a picture lane's sound on an audio lane (e.g. picture sound main dialog) — extracts what is missing, reuses the lane that already plays it"
  surfaces: [cli, timeline]
  args:
    [
      { name: lane, complete: pictureLanes },
      {
        name: track,
        optional: true,
        hint: "the audio lane to make — <lane>-sound if you don't say",
      },
    ]

# --- modules / graph ---
# The module's <category>/<name> is chosen, not derived: a module's folder is its own
# (it's where its .vstpreset lands), and its category folder decides its kind + ports.
# `module new drums/kick` scaffolds a BARE module — its category autocompletes. Give it
# a second argument and it INHERITS that module instead: `module new audio/echo
# @engine/audio/delay/adt` is how the graph's module picker turns a plugin from the
# catalogue into something a chain can name. Still no inline plugin/rack — write that
# (or a different `extends`) by editing the file afterwards.
- command: "module new"
  sid: module.create
  readable:
    en: "Create a module"
    fr: "Créer un module"
  help: "create a module, and only that — a chain names a NODE, so follow it with `node new` (e.g. module new instruments/bass, or module new audio/echo @engine/audio/delay/adt to inherit a plugin)"
  surfaces: [cli]
  args:
    [
      { name: "category/name", complete: categories },
      { name: "extends-ref", optional: true, complete: baseModules },
    ]
- command: "node new"
  sid: node.new
  readable:
    en: "Create a node of a module, in the graph"
    fr: "Créer un nœud d'un module, dans le graphe"
  help: "create a node of a module and put it in the graph, wired to nothing — named <module>_<n> unless you say otherwise (e.g. node new instruments/synth, or node new instruments/synth lead); the optional extends-ref scaffolds the module folder first when the pick comes from a catalogue, so one line does what `module new` + `node new` used to"
  surfaces: [cli]
  args:
    [
      { name: "category/name", complete: categories },
      {
        name: "node-name",
        optional: true,
        hint: "optional — the name a chain writes; without one it is <module>_<n>, and the graph's + adds the lane it lands on",
      },
      {
        name: "extends-ref",
        optional: true,
        complete: baseModules,
        hint: "optional — a catalogue pick has no local folder yet: this ref is what the folder inherits, created here if absent",
      },
      {
        name: at,
        optional: true,
        hint: "optional — x,y world px: the node is drawn there (the web fills the click)",
      },
    ]
# No verb DELETES a module. Deleting its files is the file tree's `file delete`, and taking a
# node out of the signal path is `graph unlink` below — a chain step pointing at a module that
# is not there is a dangling reference the compiler refuses to load.
# Takes a node OUT of the signal path and leaves its FILES alone — what fed it is joined to
# what it fed, so the run closes over the gap instead of going quiet. The counterpart of
# `node insert`: a node you unlink still has its settings and goes back in with one command.
# Deletes a node OUTRIGHT: its file, its preset, and its place in the graph — what fed it
# rejoined to what it fed, exactly as `graph unlink` does, so the run closes over the gap
# instead of going quiet. The MODULE it uses is untouched: a node is one use of one, and other
# projects read the same module. The counterpart of `node new`; `graph unlink` is the milder
# one, which leaves everything on disk and in the graph.
- command: "node delete"
  sid: node.delete
  readable:
    en: "Delete a node, files and all"
    fr: "Supprimer un nœud, fichiers compris"
  help: "delete a node: its file, its preset and its place in the graph (e.g. node delete lead)"
  surfaces: [cli]
  menu: [node]
  args: [{ name: "node", complete: modules }]
# Deletes a TRACK: its lane and the chain that lane starts — input, instrument, effects, strip —
# which is what "delete track" means in a DAW; `node delete` on the lane alone would leave its
# instrument wired to nothing. Clips and sequences stay on disk, as `event remove` leaves them.
# `confirm:` makes the right-click ask first (st0's frontend/docs/contextMenu.md).
- command: "track delete"
  sid: track.delete
  readable:
    en: "Delete a track and its chain"
    fr: "Supprimer une piste et sa chaîne"
  help: "delete a track: its lane and the chain it starts — input, instrument, effects (e.g. track delete gtr)"
  surfaces: [cli]
  menu: [track]
  confirm: true
  args: [{ name: track, complete: tracks }]
# A templated set of nodes, drawn as one box. Instancing copies the template's node files into
# the project and its wiring into graph.yaml, so what lands on disk is an ordinary graph plus one
# record saying which nodes are that box — nothing about the sound changes, in either direction.
# See packages/song/docs/assemblies.md.
- command: "assembly new"
  sid: assembly.new
  readable:
    en: "Put a templated box of nodes in the graph"
    fr: "Poser une boîte de nœuds templatée dans le graphe"
  help: "instance an assembly template from the library, nodes and wiring and all (e.g. assembly new @st0/turntable turntableA)"
  surfaces: [cli]
  args:
    - { name: "ref", complete: assemblyTemplates }
    - { name: "name", hint: "what to call this one; its members are named after it" }
# Takes the box AND everything in it: each member is deleted the way `node delete` deletes one,
# closing the gap behind it. `assembly dissolve` is the milder one, which keeps every node.
- command: "assembly delete"
  sid: assembly.delete
  readable:
    en: "Delete a box and its nodes"
    fr: "Supprimer une boîte et ses nœuds"
  help: "delete an assembly: the record, and every node it holds (e.g. assembly delete turntableA)"
  surfaces: [cli]
  menu: [assembly]
  args: [{ name: "name", complete: assemblies }]
# Drops the RECORD and nothing else. The nodes stay on the graph exactly as they were, wired as
# they were — this is "stop drawing these as one thing", not "get rid of them".
- command: "assembly dissolve"
  sid: assembly.dissolve
  readable:
    en: "Stop drawing a box, keep its nodes"
    fr: "Ne plus dessiner la boîte, garder ses nœuds"
  help: "drop an assembly's record, leaving every node on the graph untouched (e.g. assembly dissolve turntableA)"
  surfaces: [cli]
  menu: [assembly]
  args: [{ name: "name", complete: assemblies }]
- command: "graph unlink"
  sid: graph.unlink
  readable:
    en: "Take a node out of its chain"
    fr: "Retirer un nœud de sa chaîne"
  help: "take a node out of its chain, rejoining what fed it to what it fed (e.g. graph unlink lead)"
  surfaces: [cli]
  menu: [node]
  args: [{ name: "node", complete: modules }]
# Gives a module the ENGINE reports a folder in this project. A scanned plugin has no files
# anywhere — a chain can name `@engine/nam` and nothing is on disk — and that is fine until
# you want to draw its panel or give it presets, because both are FILES in a module's folder.
# So this is the moment it stops being ambient: a folder appears, its module.yaml records
# which plugin to load, and every chain step naming the ref follows.
# A module of the origin's libraries is nobody's to change but its admins'. To make it yours, fork it:
# `@account/<path>` extends it, carries its panel, and this project's refs follow. The account library
# is the account's in every workspace, so a fork made here is there for the next song too.
- command: "module fork"
  sid: module.fork
  readable:
    en: "Fork a library module into my own library"
    fr: "Copier un module de bibliothèque dans la mienne"
  help: "make a library module yours (e.g. module fork @st0/audio/reverb) — @account/audio/reverb extends it, and this project plays the fork"
  surfaces: [cli]
  menu: [node]
  args: [{ name: "ref", complete: baseModules }]
- command: "module own"
  sid: module.own
  readable:
    en: "Give an engine module a folder here"
    fr: "Donner un dossier à un module du moteur"
  help: "give an engine module a folder in this project, so it can carry a panel and presets (e.g. module own @engine/nam)"
  surfaces: [cli]
  menu: [node]
  args: [{ name: "ref", complete: engineModules }]
# Points a node at ANOTHER module: one edit, to its `extends:` line. Not delete-then-add and
# not a new folder either — the name stays, so every chain step keeps its place and nothing is
# rewired, and the file stays, so its position on the graph survives. Only what it IS changes.
# What described the old thing (`plugin`, `params`, `rack`) goes with it, and the log says so.
- command: "node replace"
  sid: node.replace
  readable:
    en: "Point a node at another module"
    fr: "Pointer un nœud vers un autre module"
  help: "replace what a node is, keeping its place — and its name, unless the name was auto-made, in which case it follows the new module (e.g. node replace echo @engine/audio/filter/auto-wah)"
  surfaces: [cli]
  menu: [node]
  args:
    [
      { name: node, complete: nodes },
      { name: "extends-ref", complete: baseModules },
    ]
- command: "module clone"
  sid: module.clone
  readable:
    en: "Clone a module into a new one"
    fr: "Cloner un module"
  help: "clone a module folder (e.g. module clone instruments/bass bass2)"
  surfaces: [cli]
  menu: [node]
  args:
    [
      { name: "category/name", complete: modules },
      { name: "newName", hint: "the clone's folder name, in the same category" },
    ]
# The shared `_modules` holds what someone WROTE — a jsdsp module's source, a rack's
# sample map. The engine's plugins are not files: its scan is the catalogue, so there is
# nothing to populate and nothing to keep in step. `module rescan plugins` refreshes it.
# A one-shot repair of a project written to an older format is a SCRIPT, run on a folder,
# rather than a verb offered in every session's palette for ever:
#
#   npx tsx packages/song/scripts/migrateUis.ts <project>      panels out into the _ui/ library
#   npx tsx packages/song/scripts/migrateChains.ts <root>      a pre-segments graph file
#
# (graph.yaml holds SEGMENTS — who feeds whom — and the chains are derived from them. A file
# written as a LIST of chains, each naming its source, its modules and its sink, is refused
# with a message pointing at that script.)
# Sets one plugin param on a module node, writing it to the module's own .cue.
# `param` is the engine's display name for it ("Filter Freq"), which is what the
# module UI's widgets bind to — and what `list params` prints.
# Bypass a module: it keeps its place in the graph and its params, but passes its input
# straight through — its name joins graph.yaml's `bypassed` list. Bare, it toggles —
# that's what the graph's bypass button sends.
# Longest-prefix dispatch keeps this distinct from "node param".
# INTRINSICS take no verb of their own. A module's own field rather than a plugin's parameter,
# they are written `node param <node> @channel 1,2` / `@monitor auto`, beside `@gain`. One
# vocabulary: what a widget binds (`@channel`) is what you type.
# See `INTRINSICS` in commands.ts and packages/song/docs/intrinsics.md.
# A RECORDER node captures free-running: record, clear, and this one. The first two go straight
# down the engine's socket and write nothing, so they are NOT verbs — nothing to journal, and no
# file changes. Saving does move bytes, so it is a verb like everything else that does.
# Named by the FILE rather than the node: a node holds a stack of takes and the card knows which
# is on top. See packages/song/docs/recorderNode.md.
- command: "node record save"
  sid: node.record.save
  readable:
    en: "Save a recorder's take"
    fr: "Enregistrer une prise"
  help: "send a recorder node's take to the médiathèque's recordings"
  surfaces: [cli]
  args:
    - { name: file, hint: "the take's own .wav, as the card knows it" }
    - { name: name, hint: "an optional name, which files it as a moment" }
- command: "node bypass"
  sid: node.bypass
  readable:
    en: "Bypass a node"
    fr: "Contourner un nœud"
  help: "bypass a node so it passes sound through untouched (bare: toggles)"
  surfaces: [cli]
  menu: [node]
  args: [{ name: node, complete: nodes }, { name: state, values: [on, off] }]
# --- a module's ALTERNATIVES (its other attribute sets) ---
# Not a PRESET, which is a starting point
# you stamp into the module's params. This is a set of attributes the module can be switched
# BETWEEN: both survive, one is on, and switching is one line of its own file. Any field a
# module has may differ — params, a lane's clips, even the plugin. See
# packages/song/docs/alternatives.md.
#
# The name is optional everywhere: an unnamed one answers to its position, counting the module's
# own fields as 1. The ⋮ button on a node's corner runs these three.
- command: "node alternative create"
  sid: node.alt.create
  readable:
    en: "Create an empty alternative for a node"
    fr: "Créer une alternative vide pour un nœud"
  help: "add an empty alternative to a node and switch to it (e.g. node alternative create ampli crunch)"
  surfaces: [cli]
  menu: [node]
  args:
    [
      { name: node, complete: nodes },
      { name: name, optional: true, hint: "its name — numbered after the last one if you don't say" },
    ]
# The other half of the same wish: keep this set, try a change to it. A copy carries what the
# CURRENT set states, which re-typing it by hand would get wrong.
- command: "node alternative copy"
  sid: node.alt.copy
  readable:
    en: "Copy a node's settings into an alternative"
    fr: "Copier les réglages dans une nouvelle alternative"
  help: "add an alternative holding a copy of the one that is on, and switch to it"
  surfaces: [cli]
  menu: [node]
  args:
    [
      { name: node, complete: nodes },
      { name: name, optional: true, hint: "its name — numbered after the last one if you don't say" },
    ]
# Named rather than left as the bare verb: `select` and `create` say what they do, and a bare
# `node alternative ampli crunch` reads like a declaration rather than a move. With no name, it
# lists what the module has.
- command: "node alternative select"
  sid: node.alt.select
  readable:
    en: "Switch a node to another alternative"
    fr: "Basculer un nœud sur une autre alternative"
  help: "switch a node to another of its alternatives (e.g. node alternative select ampli crunch)"
  surfaces: [cli]
  menu: [node]
  args:
    [
      { name: node, complete: nodes },
      { name: name, optional: true, complete: moduleAlternatives },
    ]
# A module with ENGINES runs as one of them — a compressor as Tracktion's or as an Airwindows one.
# Not an alternative: the MODULE declares its engines, and the node picks. The knobs are kept per
# engine, so switching back finds them as they were. See packages/song/docs/engines.md.
- command: "node engine"
  sid: node.engine
  readable:
    en: "Switch a node to another engine"
    fr: "Basculer un nœud sur un autre moteur"
  help: "run a node as another of its module's engines (e.g. node engine vox-comp vari-mu); with no name, list them"
  surfaces: [cli]
  menu: [node]
  args:
    [
      { name: node, complete: nodes },
      { name: name, optional: true, complete: moduleEngines },
    ]
# A node's PRESETS: one file each under a `presets/` tree — the workspace's `_presets/` or a
# library's `presets/` — keyed by the module the node extends. The scope says where it is KEPT.
# See packages/song/docs/userPresets.md.
- command: "node preset apply"
  sid: node.preset.apply
  readable:
    en: "Load a preset onto a node"
    fr: "Charger un preset sur un nœud"
  help: 'load a preset''s values onto a node (e.g. node preset apply lead workspace "warm pad"); with no preset, list them'
  surfaces: [cli]
  menu: [node]
  args:
    [
      { name: node, complete: nodes },
      { name: scope, optional: true, hint: "where the preset is kept: workspace, or a library's name" },
      { name: name, optional: true, hint: "the preset's name, quoted when it holds spaces" },
    ]
- command: "node preset save"
  sid: node.preset.save
  readable:
    en: "Save a node's settings as a new preset"
    fr: "Enregistrer les réglages d'un nœud comme preset"
  help: 'keep a node''s current values as a new preset of its module (e.g. node preset save lead "warm pad" st0); the scope defaults to workspace'
  surfaces: [cli]
  menu: [node]
  args:
    [
      { name: node, complete: nodes },
      { name: name, hint: "the new preset's name: letters, digits, space, _ and -" },
      { name: scope, optional: true, hint: "where to keep it: workspace (the default), or a library's name" },
    ]
- command: "node preset update"
  sid: node.preset.update
  readable:
    en: "Overwrite a preset with a node's settings"
    fr: "Remplacer un preset par les réglages d'un nœud"
  help: 'overwrite an existing preset with a node''s current values (e.g. node preset update lead workspace "warm pad")'
  surfaces: [cli]
  menu: [node]
  args:
    [
      { name: node, complete: nodes },
      { name: scope, hint: "where the preset is kept: workspace, or a library's name" },
      { name: name, hint: "the preset's name, quoted when it holds spaces" },
    ]
# --- a rack node's TAPS: the sounds of THIS kit, written into the node, never the module ---
# A rack module is the sampler; each node of it is a kit, so a tap — a note and the library sample it
# fires — belongs to the node. On an alternative other than the first, to that set. The sample is a
# file in a library's `samples/`, named `@<library>/<path>`. See packages/song/docs/racks.md.
- command: "node tap note"
  sid: node.tap.note
  readable:
    en: "Set the note a rack tap answers to"
    fr: "Régler la note d'un pad de rack"
  help: "set the MIDI note a rack node's tap fires on (e.g. node tap note kit BD 36)"
  surfaces: [cli]
  menu: [tap]
  args:
    [
      { name: node, complete: nodes },
      { name: symbol, hint: "the tap — BD, SN, T3…" },
      { name: note, hint: "0–127; 36 is General MIDI's kick" },
    ]
- command: "node tap sample"
  sid: node.tap.sample
  readable:
    en: "Set the sample a rack tap plays"
    fr: "Choisir l'échantillon d'un pad de rack"
  help: "set the library sample a rack node's tap plays, or none (e.g. node tap sample kit BD \"@st0/kicks/808.wav\")"
  surfaces: [cli]
  menu: [tap]
  args:
    [
      { name: node, complete: nodes },
      { name: symbol, hint: "the tap — BD, SN, T3…" },
      { name: sample, complete: samples, hint: "@<library>/<path> under that library's samples/, or none" },
    ]
- command: "node tap add"
  sid: node.tap.add
  readable:
    en: "Add a tap to a rack node"
    fr: "Ajouter un pad à un rack"
  help: "add a tap to a rack node, on the note after its highest (e.g. node tap add kit, or node tap add kit CR)"
  surfaces: [cli]
  menu: [node]
  args:
    [
      { name: node, complete: nodes },
      { name: symbol, optional: true, hint: "optional — its name; T<n> without one" },
    ]
- command: "node tap at"
  sid: node.tap.at
  readable:
    en: "Add a tap to a rack node on a note"
    fr: "Ajouter un pad à un rack sur une note"
  help: "add a tap to a rack node on a given note — what an empty pad of the octave grid does (e.g. node tap at kit 40, or node tap at kit 40 RIM)"
  surfaces: [cli]
  menu: [node]
  args:
    [
      { name: node, complete: nodes },
      { name: note, type: number, hint: "the MIDI note, 0..127 — free on this node" },
      { name: symbol, optional: true, hint: "optional — its name; T<n> without one" },
    ]
- command: "node tap insert"
  sid: node.tap.insert
  readable:
    en: "Add a tap beside another"
    fr: "Ajouter un pad à côté d'un autre"
  help: "add a tap on the nearest free note before or after another, never renumbering the kit (e.g. node tap insert kit after SN)"
  surfaces: [cli]
  menu: [tap]
  args:
    [
      { name: node, complete: nodes },
      { name: side, hint: "before or after — in note order" },
      { name: tap, hint: "the tap it goes beside — BD, SN, T3…" },
      { name: symbol, optional: true, hint: "optional — its name; T<n> without one" },
    ]
- command: "node tap rename"
  sid: node.tap.rename
  readable:
    en: "Rename a rack tap"
    fr: "Renommer un pad de rack"
  help: "rename one of a rack node's taps, its note and sample unchanged (e.g. node tap rename kit T3 CR)"
  surfaces: [cli]
  menu: [tap]
  args:
    [
      { name: node, complete: nodes },
      { name: symbol, hint: "the tap — BD, SN, T3…" },
      { name: name, hint: "its new name — one word" },
    ]
# Silences a tap without removing it: the pad stays, its note and sample kept, and the sampler is not
# given it. A TOGGLE without on/off. An SFZ kit's pad mutes through the player's `Mute <note>` param
# instead, since its pads are the kit's (packages/song/docs/racks.md).
- command: "node tap mute"
  sid: node.tap.mute
  readable:
    en: "Mute or unmute a rack tap"
    fr: "Couper ou rétablir un pad du rack"
  help: "silence one of a rack node's taps, or bring it back — a toggle without on/off (e.g. node tap mute kit HH)"
  surfaces: [cli]
  menu: [tap]
  args:
    [
      { name: node, complete: nodes },
      { name: symbol, hint: "the tap — BD, SN, T3…" },
      { name: state, optional: true, hint: "on or off — omitted, it toggles" },
    ]
- command: "node tap out"
  sid: node.tap.out
  readable:
    en: "Route a tap to a subchain of its own"
    fr: "Envoyer un pad vers une sous-chaine"
  help: "send one tap of a rack or an SFZ kit to a subchain of the node's chain file, on an output of its own; none brings it back (e.g. node tap out kit SN snare-fx)"
  surfaces: [cli]
  menu: [tap]
  args:
    [
      { name: node, complete: nodes },
      { name: symbol, hint: "the tap — BD, SN, Snare…" },
      { name: subchain, hint: "a subchain of the node's chain file, or none" },
    ]
- command: "node tap chain add"
  sid: node.tap.chain.add
  readable:
    en: "Add a module to a tap's chain"
    fr: "Ajouter un module a la chaine d'un pad"
  help: "add a module at the end of a tap's own chain, making the chain and routing the tap the first time (e.g. node tap chain add kit Snare @st0/audio/verb)"
  surfaces: [cli]
  menu: [tap]
  args:
    [
      { name: node, complete: nodes },
      { name: symbol, hint: "the tap — BD, SN, Snare…" },
      { name: module, complete: modules, hint: "the module to add, by ref" },
    ]
- command: "node tap chain remove"
  sid: node.tap.chain.remove
  readable:
    en: "Remove a module from a tap's chain"
    fr: "Retirer un module de la chaine d'un pad"
  help: "remove one node of a tap's chain; the last one removed sends the tap back to the main output"
  surfaces: [cli]
  args:
    [
      { name: node, complete: nodes },
      { name: symbol, hint: "the tap" },
      { name: id, hint: "the node to remove, by id" },
    ]
- command: "node tap chain move"
  sid: node.tap.chain.move
  readable:
    en: "Move a module in a tap's chain"
    fr: "Deplacer un module dans la chaine d'un pad"
  help: "move one node of a tap's chain earlier (up) or later (down)"
  surfaces: [cli]
  args:
    [
      { name: node, complete: nodes },
      { name: symbol, hint: "the tap" },
      { name: id, hint: "the node to move, by id" },
      { name: way, hint: "up or down" },
    ]
- command: "node tap remove"
  sid: node.tap.remove
  readable:
    en: "Remove a tap from a rack node"
    fr: "Retirer un pad d'un rack"
  help: "remove one of a rack node's taps (e.g. node tap remove kit CR)"
  surfaces: [cli]
  menu: [tap]
  args:
    [
      { name: node, complete: nodes },
      { name: symbol, hint: "the tap — BD, SN, T3…" },
    ]
# --- freezing (bake everything upstream of a module) ---
# A TOGGLE, because a freeze has two states and the module's own file says which one it is in:
# `frozen:` names the render, and the render is what plays until you say this again. What is baked
# is everything the signal passed through to get here, this module included — so freezing an amp
# gives you the amped sound, not the sound going in. Everything DOWNSTREAM stays live, which is
# the point of freezing rather than bouncing. Refused when something upstream also feeds a node
# outside the set: its signal would be in the render and still playing. The ⋮ button on a node's
# corner runs this. See packages/song/docs/freeze.md.
- command: "node freeze"
  sid: node.freeze
  readable:
    en: "Freeze a node and everything upstream of it"
    fr: "Geler un nœud et tout ce qui est en amont"
  help: "bake everything upstream of a node, itself included, into one render (again: unfreeze)"
  surfaces: [cli]
  menu: [node]
  args: [{ name: node, complete: nodes }]
# A FILE-VALUED param takes no verb of its own either: it lands in `params:` like the numbers
# do, and is set by `node param <node> nam <file>`. One verb per param cannot work — the asset
# picker sends the param's OWN name, so the param nobody wrote a verb for reaches a command
# that does not exist.
#
# Every control a node has, under one verb. A plain name is the PLUGIN's parameter, sent to the
# running plugin and written into `params:`. A name starting with `@` is an INTRINSIC — the
# module's own field, written into its file and read when the module is next built. And two
# names — `nam`, `onnx` — are params whose value is a FILE the module carries:
#
#   node param synth "Filter Freq" 69       a plugin's own parameter
#   node param ge_rythm-in @channel 1,2     which interface input it listens on
#   node param ge_rythm-in @monitor auto    audible when armed
#   node param ge_rythm-in @gain -3         the input trim, in dB
#   node param amp nam jcm800.nam           an asset the module carries (`none` clears it)
#
# The `@` is the same one a widget binds, so what the graph's IN panel sends is the line you
# could have typed. A live input runs no plugin at all, which is why its controls could never
# have been params in the first sense. A file-valued one is checked against the module's assets
# and is NOT patched into the running engine: a plugin reads its file when it is built.
- command: "node param"
  sid: node.param
  readable:
    en: "Set one of a node's controls"
    fr: "Régler un contrôle d'un nœud"
  help: "set a node's plugin param, an @intrinsic, or a file it carries (e.g. node param synth \"Filter Freq\" 69)"
  surfaces: [cli]
  menu: [node, param]
  args:
    [
      { name: node, complete: nodes },
      {
        name: param,
        hint: "the engine's name for it (quote it if it has spaces), @channel · @monitor · @gain, or nam · onnx",
      },
      {
        name: value,
        hint: "a number — or the state an @intrinsic takes, or a file the module carries (`none` clears it)",
      },
    ]
# Binds a MIDI control change to one of a module's params, in the `controller.yaml` in the
# module's own folder — so the map follows the module into every project that names it, and
# every NODE of it plays by the same one. `none` in place of the channel unbinds.
- command: "module cc"
  sid: module.cc
  readable:
    en: "Bind a MIDI control to a parameter"
    fr: "Associer un contrôle MIDI à un paramètre"
  help: "bind a MIDI CC to a module's param, or `none` to unbind (e.g. module cc synth Cutoff 1 74)"
  surfaces: [cli]
  menu: [node, param]
  args:
    [
      { name: module, complete: modules },
      { name: param, hint: "the name a widget binds — quote it if it has spaces" },
      { name: channel, hint: "1-16, or `none` to unbind this param" },
      { name: cc, hint: "0-127 — the control number the knob sends" },
    ]
# The routing as text is a READER rather than a palette row: `describeGraph` has its own CLI
# entry, and nothing here offers it.
#
#   npx tsx packages/song/src/graph.ts <project> [track]
#
# Moves one placement (a clip/sequence) on a track from its current timecode to a new one.
# The event is found by its start position; only that placement's `start:` is rewritten.
# The optional 4th arg moves the placement to ANOTHER track, refused only when the destination
# has nowhere to put THIS event: a lane takes a note when its midi output is wired and a clip
# when its audio one is (packages/song/docs/trackModules.md). The timeline's clip drag sends
# this form when a clip is dropped on a different lane.
# Puts an existing clip/sequence on a track at a timecode — the one ADDITIVE verb of this family,
# and the counterpart of `event remove`. It creates an event, which is why it is named for one and
# not for the clip: the clip already exists and is untouched, a placement is a reference to it, and
# the same material may sit on several tracks at once.
#
# What it is for: a take the recorder wrote but could not place, and anything else you want on a
# lane without dragging. It lands on the set the track is PLAYING, like every other placement edit
# (see packages/song/docs/alternatives.md).
- command: "event add"
  sid: event.add
  readable:
    en: "Put a clip on a track at a position"
    fr: "Poser un clip sur une piste à une position"
  help: "put an existing clip/sequence on a track (e.g. event add gtr gtr_3.1_260814T143012 3:1)"
  surfaces: [cli]
  menu: [track]
  args:
    [
      { name: track, complete: tracks },
      { name: clip, complete: clipTargets },
      { name: timecode, type: timecode },
    ]
# The BULK form, and the receiving half of a paste: a JSON payload of already-placed events, put
# down in ONE command. `sequence note add` is its exact counterpart for notes, and for the same
# reason — a paste of twelve events looped over `event add` would be twelve journal entries, so
# twelve Ctrl+Z to undo one gesture, and a failure halfway would leave half of it placed.
#
# Programmatic: the payload is built by whatever COPIED (the shell's clipboard, a script), so it
# carries positions rather than a range to derive them from. One entry per event, each naming its
# own lane, so a rectangle spanning several lanes is still one command.
#
# It takes the WHOLE placement vocabulary, not just where the event goes, because a paste has to
# put down the event that was copied: one carrying only `ref` and `start` writes an untrimmed,
# unfaded, single pass of the material wherever the original was trimmed, faded, silenced or
# repeated. Every entry is checked against PlacementSchema before anything is written.
- command: "events add"
  sid: events.add
  readable:
    en: "Put a batch of placed events on their tracks"
    fr: "Poser un lot d'événements placés sur leurs pistes"
  help: "put a batch of already-placed events down in one step (JSON payload — see `selection copy`)"
  surfaces: [cli]
  args:
    [
      {
        name: events,
        hint: 'JSON [{track,ref,start,from?,to?,fadeIn?,fadeOut?,loop?,disabled?,warp?}] — start is a timecode',
      },
    ]
# The bulk form of `event remove`: the events NAMED, so what a rectangle holds is one command and one
# undo. What the timeline's Backspace runs over a rectangle (`selection delete`).
- command: "events remove"
  sid: events.remove
  readable:
    en: "Remove a batch of events from their tracks"
    fr: "Retirer un lot d'événements de leurs pistes"
  help: "remove several placements in one step (JSON payload — what Backspace sends over a timeline rectangle)"
  surfaces: [cli]
  args:
    [
      {
        name: events,
        hint: 'JSON [{track,start}] — start is a timecode',
      },
    ]
- command: "event move"
  sid: event.move
  readable:
    en: "Move a clip to another position or track"
    fr: "Déplacer un clip à une autre position ou piste"
  help: "move a clip/sequence to a new timecode, optionally onto another track of the same type"
  surfaces: [cli]
  menu: [event]
  args:
    [
      { name: track, complete: tracks },
      { name: timecode, type: timecode },
      { name: newTimecode, type: timecode },
      {
        name: toTrack,
        complete: tracks,
        optional: true,
        hint: "optional — another track, of the same type as this one",
      },
    ]
# The bulk form of `event move`: every event STARTING between `from` and `to` (both
# inclusive), on each named lane, moved by a signed duration. One command so the whole
# gesture is one undo step and one reload — and what the timeline's selection rectangle
# feeds when the bar is filling it.
- command: "events move"
  sid: events.move
  readable:
    en: "Move all events in a range"
    fr: "Déplacer tous les événements d'une plage"
  help: "move every event in a range (e.g. events move drums,bass 2:1 4:4 +1:0)"
  surfaces: [cli]
  menu: [event]
  args:
    [
      { name: tracks, complete: tracks, hint: "track ids, comma-joined — or 'all'" },
      { name: from, type: timecode },
      { name: to, type: timecode, hint: "the range's end, inclusive" },
      { name: by, hint: "signed duration — +1:0 a bar right, -0:1 a beat left" },
    ]
# Drops one placement from a track, addressed the same way `event move` addresses it.
# The clip/sequence itself stays in clips/ — a placement is a reference, and the same
# material may sit on other tracks. Also on the timeline: right-click an event → Remove.
# `event status <what>` — set ONE aspect of ONE event, without removing it. Two so far, and the
# head is what makes room for a third: `status` names the act, the word after it names which
# property, without also asserting a direction the way a head like `disable` would.
#
# Both take `on|off|toggle` and toggle when it is omitted, and in both `on` means the NAMED STATE
# is on: `event status mute on` silences the event, `event status warp on` makes it FOLLOW the
# clip's map. One rule and no exception — which is what the head buys: under `disable`, `on` would
# mean "the disabling is on" and `warp on` would mean UNwarped.
#
# The FILE spells warp negatively (`warp: false` on the placement): an absent field has to
# mean "it warps, because the clip does". The command turns it, once.
#
# Silence one event — a track's mute at the level of a placement. It stays in the file, so its
# position, length and fades survive being switched off and on. The timeline draws it dimmed,
# and the ENGINE is what skips it.
- command: "event status mute"
  sid: event.statusMute
  readable:
    en: "Silence one clip without removing it"
    fr: "Rendre un clip muet sans le supprimer"
  help: "silence one event without removing it (e.g. event status mute drums 2:1:1)"
  surfaces: [cli]
  menu: [event]
  args:
    [
      { name: track, complete: tracks },
      { name: timecode, type: timecode },
      { name: state, hint: "on · off · toggle (default) — 'on' means silenced" },
    ]
# …and whether one event plays the material's STRETCH MAP. A warp belongs to the clip — one map
# shared by every placement of it (song/docs/warp.md) — so switching this OFF is an event declining
# it, written `warp: false` on the placement. What that is for: the map fits the song the clip was
# warped INTO, and a second use of that clip elsewhere wants the sample as recorded — which without
# this verb means copying the file.
- command: "event status warp"
  sid: event.statusWarp
  readable:
    en: "Whether one clip follows its stretch map"
    fr: "Si un clip suit sa carte d'étirement"
  help: "whether one event plays the clip's stretch map — off plays it at its own rate (e.g. event status warp drums 2:1:1 off)"
  surfaces: [cli]
  menu: [event]
  args:
    [
      { name: track, complete: tracks },
      { name: timecode, type: timecode },
      {
        name: state,
        hint: "on · off · toggle (default) — 'on' means it follows the map",
      },
    ]
# The two FADES, one verb each. `fadeIn` and `fadeOut` live on the placement, on the wire and in
# the C++ engine; these two verbs and `WebClip` are what let a surface set them without YAML.
#
# The length is a DURATION, not a position: "0:1" is one beat, where the same beat spelled as a
# position is "1:2". Both are legal timecodes and nothing downstream can tell them apart, so the
# hint says so out loud. A length of 0 REMOVES the fade — the field goes away rather than being
# written as zero, which is the rule `disabled` and `warp` already follow.
#
# The timeline sends these when a fade's corner handle is dragged.
# An event's TAKES: the performances recorded over it in the takes view, and its COMP, which take
# plays over which span. `from`/`to` here are SONG positions, unlike `event window`'s seconds. The
# event's own material is a take like the others: comping it back is naming its ref.
# See @studio/song's docs/takes.md.
- command: "event comp"
  sid: event.comp
  readable:
    en: "Choose which take plays over a span of an event"
    fr: "Choisir la prise jouee sur une portion d'un evenement"
  help: "play one take over a span of an event, in song positions (e.g. event comp gtr 5:1 gtr_5.1_261008T101500 6:1 7:3)"
  surfaces: [cli]
  menu: [event]
  args:
    [
      { name: track, complete: tracks },
      { name: timecode, type: timecode, hint: "where the EVENT starts" },
      { name: take, hint: "a take's ref, or the event's own to put it back" },
      { name: from, type: timecode, hint: "song position the span starts at" },
      { name: to, type: timecode, hint: "song position it ends at" },
    ]
- command: "event comp fade"
  sid: event.comp.fade
  readable:
    en: "Crossfade one seam of an event's comp"
    fr: "Fondu enchaine a une jointure de la composition"
  help: "a crossfade at one seam of the comp, centred on it (e.g. event comp fade gtr 5:1 6:1 0:0:1); a length of 0 removes it"
  surfaces: [cli]
  menu: [event]
  args:
    [
      { name: track, complete: tracks },
      { name: timecode, type: timecode, hint: "where the EVENT starts" },
      { name: seam, type: timecode, hint: "the song position two takes meet at" },
      { name: length, type: timecode, hint: "a DURATION — 0:0:1 is an eighth; 0 removes it" },
    ]
- command: "event take remove"
  sid: event.take.remove
  readable:
    en: "Remove a take from an event"
    fr: "Retirer une prise d'un evenement"
  help: "drop one take of an event, and every span of the comp it played (e.g. event take remove gtr 5:1 gtr_5.1_261008T101500)"
  surfaces: [cli]
  menu: [event]
  args:
    [
      { name: track, complete: tracks },
      { name: timecode, type: timecode, hint: "where the EVENT starts" },
      { name: take, hint: "the take's ref" },
    ]
# Where the next takes go: INTO one event, heard only over the punch. Session state, like an arm,
# held by the file service and never a file; `disarm` sends recording back onto the lane.
- command: "event take arm"
  sid: event.take.arm
  readable:
    en: "Record the next takes into an event"
    fr: "Enregistrer les prochaines prises dans un evenement"
  help: "record the next takes into one event, punched in at a song position and out at another or at the stop (e.g. event take arm gtr 5:1 6:1 7:1)"
  surfaces: [cli]
  args:
    [
      { name: track, complete: tracks },
      { name: timecode, type: timecode, hint: "where the EVENT starts" },
      { name: from, type: timecode, hint: "punch in, a song position" },
      { name: to, type: timecode, optional: true, hint: "punch out; absent runs to the stop" },
    ]
- command: "event take disarm"
  sid: event.take.disarm
  readable:
    en: "Record onto the lane again, not into an event"
    fr: "Enregistrer de nouveau sur la piste, pas dans un evenement"
  help: "stop recording takes into an event: the next recording lands on its lane"
  surfaces: [cli]
# The browser's half of a MIDI take: notes are captured where the keyboard is, then filed here.
- command: "event take midi"
  sid: event.take.midi
  readable:
    en: "File a recorded MIDI take on an event"
    fr: "Classer une prise MIDI enregistree sur un evenement"
  help: "file a MIDI pass as a take of an event — sent by the takes view, song beats in a JSON pass"
  surfaces: [cli]
  args:
    [
      { name: track, complete: tracks },
      { name: timecode, type: timecode, hint: "where the EVENT starts" },
      { name: pass, hint: '{"start":16,"end":24,"notes":[{"t":16.5,"d":0.5,"k":60}]}' },
    ]
# A CROSSFADE between two neighbouring events: they are made to overlap by its length out of material
# neither plays yet (B earlier first, then A later), and each fades over the overlap with the
# equal-power curve. The timeline's crossfade tool sends it. See @studio/song's docs/takes.md.
- command: "event crossfade"
  sid: event.crossfade
  readable:
    en: "Crossfade two neighbouring events"
    fr: "Fondu enchaine entre deux evenements voisins"
  help: "overlap two neighbouring audio events by a length and fade one into the other (e.g. event crossfade gtr 5:1 9:1 0:0:1); 0 removes it"
  surfaces: [cli]
  menu: [event]
  args:
    [
      { name: track, complete: tracks },
      { name: a, type: timecode, hint: "where the first event starts" },
      { name: b, type: timecode, hint: "where the one after it starts" },
      { name: length, type: timecode, hint: "a DURATION — 0 removes the crossfade" },
    ]
- command: "event window"
  sid: event.window
  readable:
    en: "Set which slice of its material one event plays"
    fr: "Choisir la part de sa matiere qu'un evenement joue"
  help: "which slice of the file an event plays, in SECONDS (e.g. event window vox 24:1 52.36 69.82)"
  surfaces: [cli]
  menu: [event]
  args:
    [
      { name: track, complete: tracks },
      { name: timecode, type: timecode },
      {
        name: from,
        hint: "seconds into the FILE, not a timecode — 0 means its start",
      },
      { name: to, hint: "seconds into the FILE; past its end means its end" },
    ]
- command: "event gain"
  sid: event.gain
  readable:
    en: "Set one audio event's gain"
    fr: "Regler le gain d'un evenement audio"
  help: "an audio event's own trim, in dB from -6 to +6; 0 is unity (e.g. event gain vox 24:1 -1.5)"
  surfaces: [cli]
  menu: [event]
  args:
    [
      { name: track, complete: tracks },
      { name: timecode, type: timecode },
      { name: db, hint: "-6 … +6 dB; 0 removes the trim" },
    ]
- command: "event loop"
  sid: event.loop
  readable:
    en: "Loop one event, or stop it looping"
    fr: "Faire boucler un evenement, ou l'arreter"
  help: "on: the event plays its window twice; off: once; toggle (the default) flips it (e.g. event loop drums 5:1 on)"
  surfaces: [cli]
  menu: [event]
  args:
    [
      { name: track, complete: tracks },
      { name: timecode, type: timecode },
      { name: state, hint: "on · off · toggle (default)" },
    ]
- command: "event loop points"
  sid: event.loopPoints
  readable:
    en: "Move one event's loop points"
    fr: "Deplacer les points de boucle d'un evenement"
  help: "the window an event loops, in its MATERIAL's unit: beats into a sequence, seconds into an audio file (e.g. event loop points drums 5:1 4 8)"
  surfaces: [cli]
  menu: [event]
  args:
    [
      { name: track, complete: tracks },
      { name: timecode, type: timecode },
      { name: from, hint: "beats into the sequence, or seconds into the file" },
      { name: to, hint: "the same unit; a looped event keeps its length, its passes recomputed" },
    ]
- command: "event fadein"
  sid: event.fadeIn
  readable:
    en: "Fade one event in"
    fr: "Ouvrir un fondu d'entrée sur un événement"
  help: "fade one event in over a length (e.g. event fadein gtr 2:1:1 0:1) — 0 removes it"
  surfaces: [cli]
  menu: [event]
  args:
    [
      { name: track, complete: tracks },
      { name: timecode, type: timecode },
      {
        name: length,
        type: timecode,
        hint: "a LENGTH, not a position — '0:1' is one beat; 0 removes the fade",
      },
    ]
- command: "event fadeout"
  sid: event.fadeOut
  readable:
    en: "Fade one event out"
    fr: "Fermer un fondu de sortie sur un événement"
  help: "fade one event out over a length (e.g. event fadeout gtr 2:1:1 0:2) — 0 removes it"
  surfaces: [cli]
  menu: [event]
  args:
    [
      { name: track, complete: tracks },
      { name: timecode, type: timecode },
      {
        name: length,
        type: timecode,
        hint: "a LENGTH, not a position — '0:1' is one beat; 0 removes the fade",
      },
    ]
# Re-time an event: a new start AND a new end, in one edit. The end is a POSITION on the
# timeline, not a duration — it is what you drag, and what you can read off the ruler.
# The timeline sends this form when an event's edge handle is dragged.
# The edit lands on the EVENT's own `from`/`to` (PlacementSchema), clamped inside the
# material's window — the most restrictive pair wins — so the material and its other
# placements are untouched. Widening past what the event plays is `event trim`'s bound too.
- command: "event resize"
  sid: event.resize
  readable:
    en: "Re-time a clip's start and end"
    fr: "Redéfinir le début et la fin d'un clip"
  help: "re-time an event (e.g. event resize drums 2:1:1 2:1:1 4:1:1)"
  surfaces: [cli]
  menu: [event]
  args:
    [
      { name: track, complete: tracks },
      { name: timecode, type: timecode },
      { name: newStart, type: timecode },
      { name: newEnd, type: timecode, hint: "the event's new END position, not its length" },
    ]

# Cut one event in two, writing the material. The cut is a POSITION in the material — seconds
# into an audio file, beats into a sequence — and the event is addressed by its START like every
# other `event` verb, the cut being its own argument. A looped event is refused: "the position of
# the cut" has as many answers as there are passes.
#
# It cuts the MATERIAL and not the placement: two new files are written and the event is replaced
# by two events naming them. A sequence is divided note by note in text; an audio clip is RENDERED
# in two, so this needs a machine with an engine on it. A split that only placed one material twice
# would leave halves nothing can treat apart, and `selection consolidate` is what rejoins anything
# at all. See packages/song/docs/materialCut.md.
#
# What it cut is left on disk: another placement, on another lane, may still be playing it, and
# this verb has no way to know what was meant to be kept.
- command: "event split"
  sid: event.split
  readable:
    en: "Split a clip in two"
    fr: "Couper un clip en deux"
  help: "cut one event in two, writing two new files (e.g. event split drums 2:1:1 3:1:1)"
  surfaces: [cli]
  menu: [event]
  args:
    [
      { name: track, complete: tracks },
      { name: timecode, type: timecode },
      { name: at, type: timecode, hint: "where to cut — inside the event" },
    ]
# Put a range back together, whatever is in it. It writes ONE new material over the range and
# places it once — so it rejoins a split, merges two different materials, and flattens a stack, all
# by the same act, WRITING in every case rather than holding out for the one arrangement where
# rewriting placements alone would do.
#
# `selection`, not `event`, and it is the only entry of that head in this file. Every other `event`
# verb addresses ONE placement by its start; this one takes a rectangle — lane, from, to — and
# the head is what says so before the arguments do. In the editor the rectangle is drawn and the
# form arrives full (commandFill.ts); typed bare, the three arguments spell the same rectangle out.
# `selection copy` and `selection paste` are the shell's own and live beside it in the palette:
# what they share is not a material but the region a gesture aimed at. It stays HERE in the file
# rather than moving to a section of its own — catalogue order is what orders a right-click menu,
# and split's inverse belongs next to split. See apps/st0/frontend/docs/clipEditors.md.
#
# The rectangle exactly as `events move` takes it, and ONE lane: what would a consolidation across
# two lanes even be — one file, or one per lane? Refused rather than guessed.
#
# Gaps are kept as gaps. The new material spans the whole range, and silence where nothing played
# is what makes the result play back identically — the same test a split has to pass.
- command: "selection consolidate"
  sid: selection.consolidate
  readable:
    en: "Consolidate a range into one clip"
    fr: "Consolider une plage en un seul clip"
  help: "write one new clip over a range (e.g. selection consolidate drums 2:1 6:1)"
  surfaces: [cli]
  menu: [event]
  args:
    [
      { name: tracks, complete: tracks, hint: "one track — a rectangle over several cannot be consolidated" },
      { name: from, type: timecode },
      { name: to, type: timecode, hint: "the range's end, inclusive" },
    ]
# `clip process` for ONE event: when anything else plays its material, the event gets a copy of
# the clip first, so a right-click on one event never rewrites the others (verbs/eventProcess.ts).
- command: "event process"
  sid: event.process
  readable:
    en: "Bounce this event through a chain"
    fr: "Traiter cet événement dans une chaîne"
  help: "bounce one event's file through a chain, leaving every other event on that material alone (e.g. event process gtr 5:1 @st0/amp-room)"
  surfaces: [cli]
  menu: [event]
  args:
    [
      { name: track, complete: tracks },
      { name: timecode, type: timecode, hint: "where the EVENT starts" },
      { name: chain, complete: chains },
    ]
- command: "event remove"
  sid: event.remove
  readable:
    en: "Remove a clip from a track"
    fr: "Retirer un clip d'une piste"
  help: "remove a clip/sequence placement from a track (e.g. event remove drums 2:1:1)"
  surfaces: [cli]
  menu: [event]
  args: [{ name: track, complete: tracks }, { name: timecode, type: timecode }]
# Inserts a node (block) into a chain's `use` list, between two adjacent steps in its
# signal flow — the two ends of one arrow in the Chains graph, a source/module/sink name
# on each side. Clicking an arrow in the graph pre-writes this with the two ends filled
# in; you supply the node to drop in.
#
# The arrow comes first (before, after) so the node name lands last, where a person types it.
# No chain to name: the two ends ARE an edge in graph.yaml, so there is nothing to disambiguate.
# The bottom `+` under a card in a chain project: the new node goes UNDER the one above, both in a
# subchain run in that one's place — the per-track row draws the pair as one column. A graph.yaml
# project has no subchains, so it refuses. See packages/song/docs/chainFiles.md, "Subchains".
- command: "node stack"
  sid: node.stack
  readable:
    en: "Stack a new node under another, in one subchain"
    fr: "Empiler un nouveau nœud sous un autre, en sous-chaîne"
  help: "put a node `node new` just made right under another, the two in one subchain run in its place (e.g. node stack amp_1 eq_1)"
  surfaces: [cli]
  menu: [node]
  args:
    [
      { name: node, complete: nodes, hint: "the node the new one goes under" },
      { name: new, complete: nodes, hint: "a node `node new` just made, wired to nothing" },
    ]
- command: "node insert"
  sid: node.insert
  readable:
    en: "Splice a node into a chain"
    fr: "Insérer un nœud dans une chaîne"
  help: "splice a node into an arrow, between the two ends of it (e.g. node insert melody OUT wah)"
  surfaces: [cli]
  menu: [node]
  args:
    [
      {
        name: before,
        complete: nodes,
        hint: "the node the arrow LEAVES — the spliced one goes after it",
      },
      {
        name: after,
        complete: nodes,
        hint: "the node the arrow ENTERS — the spliced one goes before it",
      },
      { name: node, complete: nodes },
      {
        name: at,
        optional: true,
        hint: "optional — x,y world px: the node is drawn there (the web fills the click)",
      },
    ]
# No verb PLACES an existing node in the graph: `node new` puts what it makes there and
# `graph unlink` leaves what it unlinks there, so a node on disk and on no screen is a state
# nothing reaches. Moving one is `graph move`.
- command: "graph organize"
  sid: graph.organize
  readable:
    en: "Re-lay out the whole graph"
    fr: "Réorganiser tout le graphe"
  help: "hand every node back to the automatic layout (clears all pinned positions)"
  surfaces: [cli]
# Record where the LAYOUT drew nodes that had no pin — the graph writing its own answer down.
#
# The other half of `graph move`, and the reason the picture stops rearranging itself. A node the
# layout placed carries no pin, so the next fresh layout is free to put it elsewhere — and it will,
# whenever anything about the graph changed. Unrecorded, that makes the track row seem to shuffle
# at random: the change surfaces at a RELOAD, long after the edit that caused it.
#
# So the drawing writes its answer once and the FILE becomes the layout. dagre speaks again only
# when `graph organize` empties `positions:`.
#
# Never overwrites an existing pin, so it cannot walk over a card somebody dragged. One write for
# the whole batch: sixty nodes as sixty commands would be sixty undo entries for one picture that
# nobody moved by hand.
- command: "graph pin"
  sid: graph.pin
  readable:
    en: "Record where the graph drew itself"
    fr: "Enregistrer où le graphe s'est dessiné"
  help: 'record the layout''s own positions (JSON {node: {x,y}}) — never overwrites a pin'
  surfaces: [cli]
  args:
    [
      {
        name: positions,
        hint: 'JSON {node: {x,y}} in world px — what the layout placed',
      },
    ]
# Pin a node where a drag (or a hand) put it — graph.yaml's `positions:`. The graph lays
# out only the nodes with no pin, so a module moved once stays put for ever; `auto` hands
# it back to the layout. The web sends this when a node's header is dropped.
- command: "graph move"
  sid: graph.move
  readable:
    en: "Pin a node's place on the graph"
    fr: "Épingler la position d'un nœud sur le graphe"
  help: "move a node on the graph, world px (e.g. graph move reverb 420 180) — `auto` hands it back to the layout"
  surfaces: [cli]
  menu: [node]
  args:
    [
      { name: node, complete: nodes },
      { name: x, hint: "world px — or `auto` to hand it back to the layout" },
      { name: y, type: number, optional: true },
    ]
# Draw a NEW arrow between two placed nodes — the graph's patch cable: click a free output
# jack, then a free input jack. Either end may carry "#port". `node insert` splices into an
# existing arrow; this one creates an arrow where there was none, which is how a new chain
# begins.
- command: "graph chain connect"
  sid: graph.chain.connect
  readable:
    en: "Connect two nodes with a new cable"
    fr: "Relier deux nœuds par un nouveau câble"
  help: "draw a new arrow from one node to another (e.g. graph chain connect gtr reverb, or splitter#b wet)"
  surfaces: [cli]
  args:
    [
      { name: from, hint: "the node the cable LEAVES — optionally name#port" },
      { name: to, hint: "the node it plugs into — optionally name#port" },
    ]
# The mirror: pull ONE cable out. The web sends this when a lifted cable is dropped on the
# canvas. A source left feeding nothing keeps its place in the graph — deleting a cable
# must not also delete the module.
- command: "graph chain disconnect"
  sid: graph.chain.disconnect
  readable:
    en: "Remove one cable between two nodes"
    fr: "Retirer un câble entre deux nœuds"
  help: "remove the arrow from one node to another (e.g. graph chain disconnect gtr reverb)"
  surfaces: [cli]
  args:
    [
      { name: from, hint: "the node the cable leaves — optionally name#port" },
      { name: to, hint: "the node it plugs into — optionally name#port" },
    ]
# Move ONE end of an existing cable: the arrow from→to becomes newFrom→newTo, atomically —
# one undo step, however the ends are respelt. The web sends this when a cable lifted off a
# jack lands on another; only one end usually changes, but the line states all four so the
# handler never guesses which.
- command: "graph chain replug"
  sid: graph.chain.replug
  readable:
    en: "Move one end of a cable to another node"
    fr: "Déplacer une extrémité d'un câble vers un autre nœud"
  help: "re-plug an arrow (e.g. graph chain replug gtr reverb gtr delay — the gtr cable now feeds delay)"
  surfaces: [cli]
  args:
    [
      { name: from, hint: "the arrow's current source — optionally name#port" },
      { name: to, hint: "its current target" },
      { name: newFrom, hint: "the source after the move (same, when the target end moved)" },
      { name: newTo, hint: "the target after the move" },
    ]
# The arrangement as text is a READER too — the timeline itself draws it — so its describer
# has a CLI entry and no palette row:
#
#   npx tsx packages/take-render/src/timeline.ts <project> [track]
#

