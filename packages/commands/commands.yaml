    en: "Rewind to the start"
    fr: "Revenir au début"
# The stop that stopping did not do: every plugin is told to let go of its notes AND reset,
# which is what kills a tail as well as a held chord. Pressing stop twice sends it.
- command: "transport panic"
  sid: transport.panic
  help: "silence every note and reset every plugin"
  surfaces: [cli]
  readable:
    en: "Silence everything (MIDI panic)"
    fr: "Tout faire taire (panique MIDI)"
# The click plays during playback: same sound each beat, emphasised on the first beat
# of every bar.
- command: "transport metronome"
  sid: transport.metronome
  help: "toggle the metronome (click during playback, bar starts emphasised)"
  surfaces: [cli]
  readable:
    en: "Turn the metronome on or off"
    fr: "Activer ou désactiver le métronome"
# …and how loud it is, kept apart from the switch: turning the click off and back on has to bring
# back the level you had, which one field could not do. A PROJECT setting like the flag, written to
# settings.yaml as `metronome_level` and read by the engine off the compiled document.
#
# The floor is 0.2 rather than 0, and it is Tracktion's rather than ours — `Edit::setClickTrackVolume`
# clamps there, so a smaller number would be written down and then played at 0.2. Silence is the
# switch above, which is a different question.
- command: "transport metronome volume"
  sid: transport.metronomeVolume
  help: "set the metronome's level, 0.2..1 (e.g. transport metronome volume 0.4)"
  surfaces: [cli]
  readable:
    en: "Set the metronome's volume"
    fr: "Régler le volume du métronome"
  args: [{ name: level, type: number, hint: "0.2 … 1 — off is `transport metronome`" }]
# Arming lives HERE and not under `track`. It reads like a track's property and is not one:
# nothing is written to any file, and a reload does not restore it.
# It is a message to the ENGINE, which holds the armed set and reports it back on every state
# frame — the same kind of thing as play and stop, addressed at one lane.
- command: "transport arm"
  sid: transport.arm
  readable:
    en: "Arm a track for recording"
    fr: "Armer une piste pour l'enregistrement"
  help: "toggle a track's record arm (armed tracks record on play)"
  surfaces: [cli]
  menu: [track]
  args: [{ name: track, complete: tracks }]

