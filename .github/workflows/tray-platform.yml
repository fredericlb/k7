# tray-platform.yml — one platform's tray, called once per platform by tray.yml: its engine (engine-platform.yml),
# then apps/k7-tray packaged around that engine's archive. One call per platform, so a platform whose engine fails
# skips its own tray and nothing else. See docs/release.md.

name: tray platform

on:
  workflow_call:
    inputs:
      os: { type: string, required: true }
      label: { type: string, required: true }
      preset: { type: string, required: true }
      stamp: { type: string, required: true }
    # The secrets it reads, named rather than inherited: these jobs run third-party actions.
    secrets:
      COMMONS_TOKEN: { required: false }
      TAURI_SIGNING_PRIVATE_KEY: { required: false }
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: { required: false }

permissions:
  contents: read

jobs:
  engine:
    name: engine
    uses: ./.github/workflows/engine-platform.yml
    secrets:
      COMMONS_TOKEN: ${{ secrets.COMMONS_TOKEN }}
    with:
      os: ${{ inputs.os }}
      label: ${{ inputs.label }}
      preset: ${{ inputs.preset }}
      stamp: ${{ inputs.stamp }}

  tray:
    name: tray
    needs: engine
    runs-on: ${{ inputs.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: commons
        shell: bash
        run: echo "sha=$(git rev-parse HEAD:commons)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: fredericlb/commons
          ref: ${{ steps.commons.outputs.sha }}
          path: commons
          token: ${{ secrets.COMMONS_TOKEN || github.token }}

      - uses: ./.github/actions/node

      # The engine job's binaries for this platform, unpacked where stageEngine takes them from.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: k7-runtime-${{ inputs.label }}
          path: ${{ runner.temp }}/engine-archive
      - name: unpack the engine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/engine"
          for a in "$RUNNER_TEMP"/engine-archive/*; do
            case "$a" in
              *.zip) 7z x -y -o"$RUNNER_TEMP/engine" "$a" > /dev/null ;;
              *) tar -xzf "$a" -C "$RUNNER_TEMP/engine" ;;
            esac
          done
          echo "STUDIO_PREBUILT_BIN=$RUNNER_TEMP/engine/k7-runtime" >> "$GITHUB_ENV"

      # What Tauri links against on Linux: the system tray, and WebKitGTK, which Tauri needs even with no window open.
      - name: linux tray deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf

      # k7's backend bundle with the frontend in it, the engine from the job above, and a pinned node (apps/k7-tray/scripts/stage.mjs).
      - name: stage
        run: npm run stage --workspace k7-tray

      # The bundle's version is the root package.json's, a snapshot's stamp added as a prerelease, as on the phone.
      # The updater's artifacts are signed only when the key is there; without it the build has no updater at all.
      - name: tray app
        shell: bash
        env:
          STUDIO_RELEASE_STAMP: ${{ inputs.stamp }}
          STAMP: ${{ inputs.stamp }}
          K7_UPDATER_PUBKEY: ${{ vars.K7_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          version=$(node -p 'require("./package.json").version')
          case "$STAMP" in snapshot-*) version="$version-$STAMP" ;; esac
          signed=false
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -n "$K7_UPDATER_PUBKEY" ]; then signed=true
          else echo "::warning::no updater key: this tray build cannot update itself"; unset K7_UPDATER_PUBKEY; fi
          cd apps/k7-tray
          npx tauri build --config "{\"version\":\"$version\",\"bundle\":{\"createUpdaterArtifacts\":$signed}}"

      - name: installer
        shell: bash
        env:
          STAMP: ${{ inputs.stamp }}
        run: node engine/scripts/package-release.mjs --kind tray --stamp "$STAMP"

      # Uploaded whether or not this run publishes: a dispatch on a side branch is how a change gets tested.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: k7-tray-${{ inputs.label }}
          # The installers, renamed, and the updater's fragment for this platform, merged into latest.json at publish.
          path: |
            dist/release/k7-tray*
          if-no-files-found: error
