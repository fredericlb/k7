# desktop-platform.yml — one desktop's two stages, called once per platform by desktop.yml: its engine, then
# its desktop app around that engine's archive. One call per platform, so a platform whose engine fails skips
# its own desktop build and nothing else. See docs/desktop-release.md.

name: desktop platform

on:
  workflow_call:
    inputs:
      os: { type: string, required: true }
      label: { type: string, required: true }
      preset: { type: string, required: true }
      stamp: { type: string, required: true }
    # The one secret it reads, named rather than inherited: these jobs run third-party actions.
    secrets:
      COMMONS_TOKEN: { required: false }

permissions:
  contents: read

jobs:
  # The engine-platform.yml workflow; its archive is the `k7-runtime-<label>` artifact the desktop job unpacks.
  engine:
    name: engine
    uses: ./.github/workflows/engine-platform.yml
    secrets:
      COMMONS_TOKEN: ${{ secrets.COMMONS_TOKEN }}
    with:
      os: ${{ inputs.os }}
      label: ${{ inputs.label }}
      preset: ${{ inputs.preset }}
      stamp: ${{ inputs.stamp }}

  desktop:
    name: desktop
    needs: engine
    runs-on: ${{ inputs.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: commons
        shell: bash
        run: echo "sha=$(git rev-parse HEAD:commons)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: fredericlb/commons
          ref: ${{ steps.commons.outputs.sha }}
          path: commons
          token: ${{ secrets.COMMONS_TOKEN || github.token }}

      - uses: ./.github/actions/node

      # The engines job's binaries for this platform, unpacked where stageEngine takes them from.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: k7-runtime-${{ inputs.label }}
          path: ${{ runner.temp }}/engine-archive
      - name: unpack the engine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/engine"
          for a in "$RUNNER_TEMP"/engine-archive/*; do
            case "$a" in
              *.zip) 7z x -y -o"$RUNNER_TEMP/engine" "$a" > /dev/null ;;
              *) tar -xzf "$a" -C "$RUNNER_TEMP/engine" ;;
            esac
          done
          echo "STUDIO_PREBUILT_BIN=$RUNNER_TEMP/engine/k7-runtime" >> "$GITHUB_ENV"

      # The standalone app: k7's frontend and backend bundled, the engine beside them (apps/k7-standalone/docs/standalone.md).
      - name: desktop app
        env:
          # Inlined as the app's release, shown in About and compared with GitHub's releases (apps/k7-standalone/docs/menu.md).
          STUDIO_RELEASE_STAMP: ${{ inputs.stamp }}
        run: npm run package --workspace k7-standalone

      # Ubuntu 24.04 refuses Chromium's sandbox its user namespaces, and a runner has no display and no sound card (apps/k7-standalone/docs/e2e.md).
      - name: end-to-end environment
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb pulseaudio pulseaudio-utils libasound2-plugins
          cp engine/docker/asound.conf ~/.asoundrc
          pulseaudio --daemonize=yes --exit-idle-time=-1 -n --load="module-null-sink sink_name=k7 rate=48000 channels=2" --load="module-native-protocol-unix"
          until pactl info >/dev/null 2>&1; do sleep 0.2; done

      # The packaged app under out/, booted for real; informational until it has proven itself on all three runners.
      - name: end-to-end
        continue-on-error: true
        shell: bash
        working-directory: apps/k7-standalone
        env:
          K7_E2E_ENGINE: "1"
        run: |
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a npm run e2e; else npm run e2e; fi
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: k7-e2e-${{ inputs.label }}
          path: apps/k7-standalone/test-results
          if-no-files-found: ignore

      - name: installer
        shell: bash
        env:
          STAMP: ${{ inputs.stamp }}
        run: node engine/scripts/package-release.mjs --kind desktop --stamp "$STAMP"

      # Uploaded whether or not this run publishes: a dispatch on a side branch is how a change gets tested.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: k7-desktop-${{ inputs.label }}
          # The installers and their blockmaps, and latest*.yml, which the app updates from (docs/app-downloads.md).
          path: |
            dist/release/k7_*
            dist/release/latest*.yml
          if-no-files-found: error

