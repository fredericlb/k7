# The desktop release — the half of the repo the hosted image never carries.
#
# `docker/` ships the four web apps; these ship to a musician's machine: engine/st0-engine and
# engine/st0-supervisor (C++, CMake) and the tray that runs them, engine/st0-tray (Electron). One
# job per desktop, each producing ONE archive — the engine binary beside the tray's installer.
#
# It is the only workflow here that compiles the C++ engine. st0.yml deliberately does not:
# a cold configure fetches JUCE, Tracktion, Faust, Eigen and NAM, so this is tens of minutes
# per platform and belongs on a release cadence, not on every push. Hence the `decide` gate
# below — a main push that touched only apps/ or docs/ does not pay for three native builds.
#
# What it does NOT do is SIGN anything. The macOS .dmg is unsigned and unnotarised, the
# Windows installer unsigned; both warn on first launch. See docs/desktop-release.md.

name: desktop

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

# Three native builds are far too expensive to leave a superseded one running.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # the release and its assets

jobs:
  decide:
    name: what to build
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      publish: ${{ steps.plan.outputs.publish }}
      channel: ${{ steps.plan.outputs.channel }}
      tag: ${{ steps.plan.outputs.tag }}
      stamp: ${{ steps.plan.outputs.stamp }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the push's `before` commit, to diff against

      # A `paths:` filter would have done this, except that it is also applied to TAG pushes,
      # where the push carries no commit list and therefore matches nothing — the release
      # would silently never run. So the filter is a diff here, and tags skip it entirely.
      - id: plan
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/*)
              channel=release; tag="${GITHUB_REF#refs/tags/}"; stamp="$tag" ;;
            *)
              channel=snapshot; tag=snapshot
              stamp="snapshot-$(git rev-parse --short HEAD)" ;;
          esac

          build=yes
          if [ "$channel" = snapshot ] && [ "$GITHUB_EVENT_NAME" = push ] \
             && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            git diff --name-only "$BEFORE" HEAD > changed.txt
            # packages/ in full: both bundled .mjs are esbuilt out of most of that tier; commons, for the Electron shell in it.
            grep -qE '^(engine/|packages/|commons$|package-lock\.json|\.github/workflows/desktop\.yml)' \
              changed.txt || build=no
          fi

          # A dispatch on a side branch still builds, so it can be tested — it just publishes nothing.
          publish=no
          if [ "$build" = yes ] && { [ "$channel" = release ] || [ "$GITHUB_REF" = refs/heads/main ]; }; then
            publish=yes
          fi

          printf '%s\n' "build=$build" "publish=$publish" "channel=$channel" \
                        "tag=$tag" "stamp=$stamp" | tee -a "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.label }}
    needs: decide
    if: needs.decide.outputs.build == 'yes'
    runs-on: ${{ matrix.os }}
    # One platform's toolchain failing must not throw away the two archives that did build.
    strategy:
      fail-fast: false
      matrix:
        include:
          # windows-latest is the windows-2025-vs2026 image: the dev machine's compiler, under Ninja so
          # the compiler cache below applies (the Visual Studio generator ignores a launcher).
          - os: windows-latest
            label: windows-x64
            preset: windows-msvc-ninja
          # macos-latest is arm64. An Intel build is one more entry here (preset macos-clang,
          # os macos-13); nobody has asked for one, and a macOS runner minute is the dearest.
          - os: macos-latest
            label: macos-arm64
            preset: macos-clang
          - os: ubuntu-latest
            label: linux-x64
            preset: release-gcc
    steps:
      - uses: actions/checkout@v4
      # commons is a private repository: read with COMMONS_TOKEN, at the commit st0 pins — docs/desktop-release.md.
      - id: commons
        shell: bash
        run: echo "sha=$(git rev-parse HEAD:commons)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: fredericlb/commons
          ref: ${{ steps.commons.outputs.sha }}
          path: commons
          token: ${{ secrets.COMMONS_TOKEN || github.token }}

      - uses: ./.github/actions/node

      # What JUCE needs for ALSA/JACK audio and X11, absent from the runner image. Electron
      # brings its own GTK at run time and needs none of it to package.
      - name: linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            libssl-dev \
            libasound2-dev libjack-jackd2-dev libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libglu1-mesa-dev mesa-common-dev \
            libcurl4-openssl-dev ladspa-sdk

      # The macos-clang preset generates Ninja; cmake may or may not be on the image already.
      - name: macos build deps
        if: runner.os == 'macOS'
        run: |
          for f in cmake ninja; do
            brew list --formula "$f" >/dev/null 2>&1 || brew install "$f"
          done


      # cl.exe and ninja for the Ninja preset: what a Visual Studio developer prompt puts on PATH.
      - name: msvc environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Every run compiled ~1,070 files from nothing; this keeps the objects between runs, one cache
      # per platform. sccache rather than ccache because it caches MSVC too — docs/desktop-release.md.
      - name: compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          variant: sccache
          key: engine-${{ matrix.label }}
          max-size: 2G

      # The engine, the supervisor and the tray's installer, in one script — the same one a
      # developer runs. See engine/st0-tray/scripts/docs/buildEngine.md.
      - name: engine + supervisor + tray
        env:
          STUDIO_ENGINE_PRESET: ${{ matrix.preset }}
          STUDIO_SUPERVISOR_PRESET: ${{ matrix.preset }}
          CMAKE_C_COMPILER_LAUNCHER: sccache
          CMAKE_CXX_COMPILER_LAUNCHER: sccache
        run: node engine/st0-tray/scripts/build-engine.mjs

      - name: compiler cache stats
        if: always()
        shell: bash
        run: sccache --show-stats || true

      - name: archive
        run: >
          node engine/st0-tray/scripts/package-release.mjs
          --stamp ${{ needs.decide.outputs.stamp }}

      # Uploaded whether or not this run publishes: a dispatch on a side branch is how a
      # toolchain change gets tested, and the archive is the only thing worth looking at.
      - uses: actions/upload-artifact@v4
        with:
          name: st0-desktop-${{ matrix.label }}
          path: |
            dist/release/*.zip
            dist/release/*.tar.gz
          if-no-files-found: error

  publish:
    name: publish
    needs: [decide, build]
    if: needs.decide.outputs.publish == 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true # one flat directory, three archives

      # `gh` rather than an action: no checkout is needed and nothing third-party signs off
      # on what reaches the release page.
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.decide.outputs.tag }}
          STAMP: ${{ needs.decide.outputs.stamp }}
        run: |
          set -euo pipefail
          ls -l dist
          if [ '${{ needs.decide.outputs.channel }}' = snapshot ]; then
            # Deleted and recreated rather than edited: `snapshot` is a MOVING tag, and an
            # existing release keeps its own commit however its assets are replaced.
            gh release delete "$TAG" --yes --cleanup-tag || true
            gh release create "$TAG" --prerelease --target "$GITHUB_SHA" \
              --title "snapshot $STAMP" \
              --notes "Unsigned build of master ($GITHUB_SHA). Replaced by the next one." \
              dist/*
          else
            gh release create "$TAG" --title "$TAG" --generate-notes dist/*
          fi
