# The desktop release — the half of the repo the hosted image never carries.
#
# `docker/` ships the hosted apps; these ship to a musician's machine, in two stages. `engines` compiles
# engine/st0-engine and engine/st0-supervisor (C++, CMake) per desktop and publishes them as the
# command-line engine; `desktop` then packages apps/st0-standalone around THOSE binaries, compiling nothing.
#
# It is the only workflow here that compiles the C++ engine. st0.yml deliberately does not: a cold
# build is tens of minutes per platform, a cached one several. Hence the `decide` gate below — a main
# push that touched only docs/ does not pay for three native builds.
#
# What it does NOT do is SIGN anything. The macOS .dmg is unsigned and unnotarised, the
# Windows installer unsigned; both warn on first launch. See docs/desktop-release.md.

name: desktop

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

# Three native builds are far too expensive to leave a superseded one running.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # the release and its assets

jobs:
  decide:
    name: what to build
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      publish: ${{ steps.plan.outputs.publish }}
      channel: ${{ steps.plan.outputs.channel }}
      tag: ${{ steps.plan.outputs.tag }}
      stamp: ${{ steps.plan.outputs.stamp }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the push's `before` commit, to diff against

      # A `paths:` filter would have done this, except that it is also applied to TAG pushes,
      # where the push carries no commit list and therefore matches nothing — the release
      # would silently never run. So the filter is a diff here, and tags skip it entirely.
      - id: plan
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/*)
              channel=release; tag="${GITHUB_REF#refs/tags/}"; stamp="$tag" ;;
            *)
              channel=snapshot; tag=snapshot
              stamp="snapshot-$(git rev-parse --short HEAD)" ;;
          esac

          build=yes
          if [ "$channel" = snapshot ] && [ "$GITHUB_EVENT_NAME" = push ] \
             && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            git diff --name-only "$BEFORE" HEAD > changed.txt
            # apps/ and packages/ in full: the desktop app bundles st0 and most of that tier; commons, for its Electron shell.
            grep -qE '^(engine/|apps/|packages/|commons$|package-lock\.json|\.github/workflows/desktop\.yml)' \
              changed.txt || build=no
          fi

          # A dispatch on a side branch still builds, so it can be tested — it just publishes nothing.
          publish=no
          if [ "$build" = yes ] && { [ "$channel" = release ] || [ "$GITHUB_REF" = refs/heads/main ]; }; then
            publish=yes
          fi

          printf '%s\n' "build=$build" "publish=$publish" "channel=$channel" \
                        "tag=$tag" "stamp=$stamp" | tee -a "$GITHUB_OUTPUT"

  engines:
    name: engine ${{ matrix.label }}
    needs: decide
    if: needs.decide.outputs.build == 'yes'
    runs-on: ${{ matrix.os }}
    # One platform's toolchain failing must not throw away the two archives that did build.
    strategy:
      fail-fast: false
      matrix:
        include:
          # windows-latest is the windows-2025-vs2026 image: the dev machine's compiler, under Ninja so
          # the compiler cache below applies (the Visual Studio generator ignores a launcher).
          - os: windows-latest
            label: windows-x64
            preset: windows-msvc-ninja
          # macos-latest is arm64. An Intel build is one more entry here (preset macos-clang,
          # os macos-13); nobody has asked for one, and a macOS runner minute is the dearest.
          - os: macos-latest
            label: macos-arm64
            preset: macos-clang
          - os: ubuntu-latest
            label: linux-x64
            preset: release-gcc
    steps:
      - uses: actions/checkout@v4
      # commons is a private repository: read with COMMONS_TOKEN, at the commit st0 pins — docs/desktop-release.md.
      - id: commons
        shell: bash
        run: echo "sha=$(git rev-parse HEAD:commons)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: fredericlb/commons
          ref: ${{ steps.commons.outputs.sha }}
          path: commons
          token: ${{ secrets.COMMONS_TOKEN || github.token }}

      - uses: ./.github/actions/node

      # What JUCE needs for ALSA/JACK audio and X11, absent from the runner image. Electron
      # brings its own GTK at run time and needs none of it to package.
      - name: linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            libssl-dev \
            libasound2-dev libjack-jackd2-dev libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libglu1-mesa-dev mesa-common-dev \
            libcurl4-openssl-dev ladspa-sdk

      # The macos-clang preset generates Ninja; cmake may or may not be on the image already.
      - name: macos build deps
        if: runner.os == 'macOS'
        run: |
          for f in cmake ninja; do
            brew list --formula "$f" >/dev/null 2>&1 || brew install "$f"
          done


      # cl.exe and ninja for the Ninja preset: what a Visual Studio developer prompt puts on PATH.
      - name: msvc environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Defender scans every file cl.exe opens, which a cold Windows build mostly waits on; the runner is discarded after the job.
      - name: defender off the build
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, $env:LOCALAPPDATA
          Add-MpPreference -ExclusionProcess cl.exe, link.exe, ninja.exe, sccache.exe, cmake.exe
          Set-MpPreference -DisableRealtimeMonitoring $true

      # Every core: the build script leaves two free outside Windows, for a developer's machine, which
      # on a 4-core runner is half of them (engine/st0-engine/scripts/buildLock.mjs).
      - name: every core to the compiler
        if: runner.os != 'Windows'
        shell: bash
        run: echo "CMAKE_BUILD_PARALLEL_LEVEL=$(getconf _NPROCESSORS_ONLN)" >> "$GITHUB_ENV"

      # Every run compiled ~1,070 files from nothing; this keeps the objects between runs, one cache
      # per platform. sccache rather than ccache because it caches MSVC too — docs/desktop-release.md.
      - name: compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          variant: sccache
          key: engine-${{ matrix.label }}
          max-size: 2G

      # The engine and the supervisor, staged as the command-line engine — the script a developer runs.
      # See engine/scripts/docs/buildEngine.md.
      - name: engine + supervisor
        env:
          STUDIO_ENGINE_PRESET: ${{ matrix.preset }}
          STUDIO_SUPERVISOR_PRESET: ${{ matrix.preset }}
          # Read by the presets, not CMAKE_<LANG>_COMPILER_LAUNCHER: that one reaches JUCE's nested juceaide build too.
          STUDIO_COMPILER_LAUNCHER: sccache
        run: node engine/scripts/build-engine.mjs

      - name: compiler cache stats
        if: always()
        shell: bash
        run: sccache --show-stats || true

      - name: archive
        run: >
          node engine/scripts/package-release.mjs --kind engine
          --stamp ${{ needs.decide.outputs.stamp }}

      # An archive, not the folder: an artifact keeps no executable bit, and the desktop job unpacks this one.
      - uses: actions/upload-artifact@v4
        with:
          name: st0-engine-${{ matrix.label }}
          path: |
            dist/release/*.zip
            dist/release/*.tar.gz
          if-no-files-found: error

  desktop:
    name: desktop ${{ matrix.label }}
    needs: [decide, engines]
    # Not skipped when one engine leg failed: each platform waits for its own archive, and fails at its download.
    if: ${{ !cancelled() && needs.decide.outputs.build == 'yes' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, label: windows-x64 }
          - { os: macos-latest, label: macos-arm64 }
          - { os: ubuntu-latest, label: linux-x64 }
    steps:
      - uses: actions/checkout@v4
      - id: commons
        shell: bash
        run: echo "sha=$(git rev-parse HEAD:commons)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: fredericlb/commons
          ref: ${{ steps.commons.outputs.sha }}
          path: commons
          token: ${{ secrets.COMMONS_TOKEN || github.token }}

      - uses: ./.github/actions/node

      # The engines job's binaries for this platform, unpacked where stageEngine takes them from.
      - uses: actions/download-artifact@v4
        with:
          name: st0-engine-${{ matrix.label }}
          path: ${{ runner.temp }}/engine-archive
      - name: unpack the engine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/engine"
          for a in "$RUNNER_TEMP"/engine-archive/*; do
            case "$a" in
              *.zip) 7z x -y -o"$RUNNER_TEMP/engine" "$a" > /dev/null ;;
              *) tar -xzf "$a" -C "$RUNNER_TEMP/engine" ;;
            esac
          done
          echo "STUDIO_PREBUILT_BIN=$RUNNER_TEMP/engine/st0-engine" >> "$GITHUB_ENV"

      # The standalone app: st0's frontend and backend bundled, the engine beside them (apps/st0-standalone/docs/standalone.md).
      - name: desktop app
        run: npm run package --workspace st0-standalone

      - name: installer
        run: >
          node engine/scripts/package-release.mjs --kind desktop
          --stamp ${{ needs.decide.outputs.stamp }}

      # Uploaded whether or not this run publishes: a dispatch on a side branch is how a change gets tested.
      - uses: actions/upload-artifact@v4
        with:
          name: st0-desktop-${{ matrix.label }}
          path: dist/release/st0_*
          if-no-files-found: error

  publish:
    name: publish
    needs: [decide, engines, desktop]
    if: needs.decide.outputs.publish == 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true # one flat directory: three engine archives, three installers

      # `gh` rather than an action: no checkout is needed and nothing third-party signs off
      # on what reaches the release page.
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.decide.outputs.tag }}
          STAMP: ${{ needs.decide.outputs.stamp }}
        run: |
          set -euo pipefail
          ls -l dist
          if [ '${{ needs.decide.outputs.channel }}' = snapshot ]; then
            # Deleted and recreated rather than edited: `snapshot` is a MOVING tag, and an
            # existing release keeps its own commit however its assets are replaced.
            gh release delete "$TAG" --yes --cleanup-tag || true
            gh release create "$TAG" --prerelease --target "$GITHUB_SHA" \
              --title "snapshot $STAMP" \
              --notes "Unsigned build of master ($GITHUB_SHA). Replaced by the next one." \
              dist/*
          else
            gh release create "$TAG" --title "$TAG" --generate-notes dist/*
          fi
