# The desktop release — the half of the repo the hosted image never carries.
#
# `docker/` ships the hosted apps; these ship to a musician's machine, in two stages per desktop
# (desktop-platform.yml): `engine` compiles engine/st0-engine and engine/st0-supervisor (C++, CMake) and
# publishes them as the command-line engine; `desktop` then packages apps/st0-standalone around THOSE
# binaries, compiling nothing, and only when that platform's engine built. Beside them, `android`
# builds the phone's APK, whose arm64 engine and supervisor Gradle compiles itself.
#
# It is the only workflow here that compiles the C++ engine. st0.yml deliberately does not: a cold
# build is tens of minutes per platform, a cached one several. Hence the `decide` gate below — a main
# push that touched only docs/ does not pay for three native builds.
#
# What it does NOT do is SIGN anything. The macOS .dmg is unsigned and unnotarised, the
# Windows installer unsigned; both warn on first launch. See docs/desktop-release.md.

name: desktop

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

# Three native builds are far too expensive to leave a superseded one running.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # the release and its assets

jobs:
  decide:
    name: what to build
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      publish: ${{ steps.plan.outputs.publish }}
      channel: ${{ steps.plan.outputs.channel }}
      tag: ${{ steps.plan.outputs.tag }}
      stamp: ${{ steps.plan.outputs.stamp }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the push's `before` commit, to diff against

      # A `paths:` filter would have done this, except that it is also applied to TAG pushes,
      # where the push carries no commit list and therefore matches nothing — the release
      # would silently never run. So the filter is a diff here, and tags skip it entirely.
      - id: plan
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/*)
              channel=release; tag="${GITHUB_REF#refs/tags/}"; stamp="$tag" ;;
            *)
              channel=snapshot; tag=snapshot
              stamp="snapshot-$(git rev-parse --short HEAD)" ;;
          esac

          build=yes
          if [ "$channel" = snapshot ] && [ "$GITHUB_EVENT_NAME" = push ] \
             && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            git diff --name-only "$BEFORE" HEAD > changed.txt
            # apps/ and packages/ in full: the desktop app bundles st0 and most of that tier; commons, for its Electron shell.
            grep -qE '^(engine/|apps/|packages/|commons$|package-lock\.json|\.github/workflows/desktop(-platform)?\.yml)' \
              changed.txt || build=no
          fi

          # A dispatch on a side branch still builds, so it can be tested — it just publishes nothing.
          publish=no
          if [ "$build" = yes ] && { [ "$channel" = release ] || [ "$GITHUB_REF" = refs/heads/main ]; }; then
            publish=yes
          fi

          printf '%s\n' "build=$build" "publish=$publish" "channel=$channel" \
                        "tag=$tag" "stamp=$stamp" | tee -a "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.label }}
    needs: decide
    if: needs.decide.outputs.build == 'yes'
    strategy:
      fail-fast: false
      matrix:
        include:
          # windows-latest is the windows-2025-vs2026 image: the dev machine's compiler, under Ninja so
          # the compiler cache below applies (the Visual Studio generator ignores a launcher).
          - os: windows-latest
            label: windows-x64
            preset: windows-msvc-ninja
          # macos-latest is arm64. An Intel build is one more entry here (preset macos-clang,
          # os macos-13); nobody has asked for one, and a macOS runner minute is the dearest.
          - os: macos-latest
            label: macos-arm64
            preset: macos-clang
          - os: ubuntu-latest
            label: linux-x64
            preset: release-gcc
    uses: ./.github/workflows/desktop-platform.yml
    secrets: inherit
    with:
      os: ${{ matrix.os }}
      label: ${{ matrix.label }}
      preset: ${{ matrix.preset }}
      stamp: ${{ needs.decide.outputs.stamp }}

  # The phone: engine/st0-android's debug-signed APK, its own arm64 engine and supervisor built by Gradle,
  # as OneDev's nightly job builds it (engine/st0-engine/docs/android.md).
  android:
    name: android
    needs: decide
    if: needs.decide.outputs.build == 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: commons
        shell: bash
        run: echo "sha=$(git rev-parse HEAD:commons)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: fredericlb/commons
          ref: ${{ steps.commons.outputs.sha }}
          path: commons
          token: ${{ secrets.COMMONS_TOKEN || github.token }}

      # The app's page is a workspace, and Capacitor's Android runtime, which settings.gradle.kts includes, is a package.
      - uses: ./.github/actions/node

      # JDK 21, which AGP runs on and the app's Java and Kotlin target; Gradle's downloads cached by setup-java.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # The HOST half of the build: JUCE compiles juceaide, its GUI module included, for the runner itself.
      - name: build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build \
            libfreetype-dev libfontconfig-dev libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev

      # The image carries the SDK and its sdkmanager; these are the versions app/build.gradle.kts names.
      - name: android sdk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"

      # Their own keys, never the desktop legs': the same sources compile to arm64 here.
      - name: dependency sources
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/st0-fetch
          key: fetch-android-${{ hashFiles('engine/st0-engine/CMakeLists.txt', 'engine/st0-supervisor/CMakeLists.txt', 'engine/st0-engine/engine/patches/**', 'engine/st0-engine/engine/eurorack/patches/**', 'engine/st0-supervisor/cmake/**') }}
      - name: compiler cache
        id: cache
        continue-on-error: true
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          variant: sccache
          key: engine-android-arm64
          max-size: 2G

      # One debug key across runs: a fresh runner makes a new one, and Android refuses an update signed by another.
      # ANDROID_USER_HOME pins where the build creates it, so the cache saves the file it restores.
      - name: debug signing key
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/android-user
          key: android-debug-keystore

      # Gradle hands its environment to both CMake projects, whose presets read the launcher (docs/desktop-release.md).
      - name: apk
        env:
          STUDIO_COMPILER_LAUNCHER: ${{ steps.cache.outcome == 'success' && 'sccache' || '' }}
          STUDIO_FETCHCONTENT_DIR: ${{ runner.temp }}/st0-fetch
          ANDROID_USER_HOME: ${{ runner.temp }}/android-user
        run: |
          # Every core: the engine's build script leaves two free for a developer's machine.
          export CMAKE_BUILD_PARALLEL_LEVEL=$(getconf _NPROCESSORS_ONLN)
          mkdir -p "$ANDROID_USER_HOME"
          cd engine/st0-android
          ./gradlew --no-daemon assembleDebug
          mkdir -p ../../dist/release
          cp app/build/outputs/apk/debug/app-debug.apk "../../dist/release/st0-android_${{ needs.decide.outputs.stamp }}_arm64.apk"

      - name: sources only in the fetch cache
        if: always()
        shell: bash
        run: |
          d="$RUNNER_TEMP/st0-fetch"
          [ -d "$d" ] || exit 0
          find "$d" -mindepth 2 -maxdepth 2 -type d -name '*-build' -exec rm -rf {} +
          rm -rf "$d/st0-engine/faust-src/build/lib"

      - name: compiler cache stats
        if: always()
        run: sccache --show-stats 2>/dev/null || echo 'no compiler cache this run'

      - uses: actions/upload-artifact@v4
        with:
          name: st0-android-arm64
          path: dist/release/*.apk
          if-no-files-found: error

  publish:
    name: publish
    needs: [decide, build, android]
    if: needs.decide.outputs.publish == 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true # one flat directory: three engine archives, three installers, the APK

      # `gh` rather than an action: no checkout is needed and nothing third-party signs off
      # on what reaches the release page.
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.decide.outputs.tag }}
          STAMP: ${{ needs.decide.outputs.stamp }}
        run: |
          set -euo pipefail
          ls -l dist
          if [ '${{ needs.decide.outputs.channel }}' = snapshot ]; then
            # Deleted and recreated rather than edited: `snapshot` is a MOVING tag, and an
            # existing release keeps its own commit however its assets are replaced.
            gh release delete "$TAG" --yes --cleanup-tag || true
            gh release create "$TAG" --prerelease --target "$GITHUB_SHA" \
              --title "snapshot $STAMP" \
              --notes "Unsigned build of master ($GITHUB_SHA). Replaced by the next one." \
              dist/*
          else
            gh release create "$TAG" --title "$TAG" --generate-notes dist/*
          fi
