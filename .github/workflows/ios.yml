# The iPhone app: engine/k7-ios built for a device, its engine and supervisor compiled from the ios-arm64
# presets by engine/k7-ios/scripts/stage.mjs, the script a developer runs, then Xcode. UNSIGNED: signing is the
# developer's own team for now, so the artifact is an .ipa to sign before it installs (engine/k7-runtime/docs/ios.md).
# A workflow of its own rather than a job of desktop.yml: an iOS failure must not hold the desktop snapshot back.
# On a vX.Y.Z tag the .ipa is attached to that release once desktop.yml has made it; snapshots never carry one.

name: ios

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

# A native build is far too expensive to leave a superseded one running.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  decide:
    name: what to build
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      stamp: ${{ steps.plan.outputs.stamp }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # the push's `before` commit, to diff against
      # A diff rather than a `paths:` filter, which GitHub applies to tag pushes too and which then matches nothing — as in desktop.yml.
      - id: plan
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/*) release=yes; stamp="${GITHUB_REF#refs/tags/}" ;;
            *) release=no; stamp="snapshot-$(git rev-parse --short HEAD)" ;;
          esac
          # The stamp names a file and reaches shell commands downstream: only these two shapes pass.
          if ! [[ "$stamp" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ || "$stamp" =~ ^snapshot-[0-9a-f]{7,40}$ ]]; then
            echo "::error::refusing stamp '$stamp': expected vX.Y.Z or snapshot-<commit>"
            exit 1
          fi
          build=yes
          if [ "$release" = no ] && [ "$GITHUB_EVENT_NAME" = push ] \
             && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            git diff --name-only "$BEFORE" HEAD > changed.txt
            grep -qE '^(engine/|apps/k7/|packages/|commons$|package-lock\.json|\.github/workflows/ios\.yml)' \
              changed.txt || build=no
          fi
          printf '%s\n' "build=$build" "stamp=$stamp" "release=$release" | tee -a "$GITHUB_OUTPUT"

  ios:
    name: ios
    needs: decide
    if: needs.decide.outputs.build == 'yes'
    # The Xcode 26 line the project is written for, rather than whichever image macos-latest names this month.
    runs-on: macos-26
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The whole history without its files: the build number is the commit count (docs/versioning.md).
          fetch-depth: 0
          filter: blob:none
      # commons is a private repository: read with COMMONS_TOKEN, at the commit k7 pins — docs/desktop-release.md.
      - id: commons
        shell: bash
        run: echo "sha=$(git rev-parse HEAD:commons)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: fredericlb/commons
          ref: ${{ steps.commons.outputs.sha }}
          path: commons
          token: ${{ secrets.COMMONS_TOKEN || github.token }}

      # The shell page and the backend bundle are workspaces of the repository.
      - uses: ./.github/actions/node

      # The presets generate Ninja; cmake may or may not be on the image already. The Xcode in use goes in the log.
      - name: build deps
        shell: bash
        run: |
          for f in cmake ninja; do
            brew list --formula "$f" >/dev/null 2>&1 || brew install "$f"
          done
          xcodebuild -version

      # Every core: the build script leaves two free for a developer's machine (engine/k7-runtime/scripts/buildLock.mjs).
      - name: every core to the compiler
        shell: bash
        run: echo "CMAKE_BUILD_PARALLEL_LEVEL=$(getconf _NPROCESSORS_ONLN)" >> "$GITHUB_ENV"

      # Not fatal: a runner that cannot download sccache builds uncached rather than not at all. Saved from main alone.
      - name: compiler cache
        id: cache
        continue-on-error: true
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          variant: sccache
          key: engine-ios-arm64
          max-size: 1G
          save: ${{ github.ref == 'refs/heads/main' }}

      # The k7x reader's Node-API addon, which the stage cross-compiles for the device (packages/k7x/docs/rust.md).
      - name: rust for the device
        run: rustup target add aarch64-apple-ios

      # Engine, supervisor, NodeMobile, the k7x addon and the CA bundle as pinned, Faust's libraries, the shell page, the backend.
      - name: stage
        env:
          # Read by the presets, not CMAKE_<LANG>_COMPILER_LAUNCHER: that one reaches JUCE's nested juceaide build too.
          STUDIO_COMPILER_LAUNCHER: ${{ steps.cache.outcome == 'success' && 'sccache' || '' }}
        run: node engine/k7-ios/scripts/stage.mjs

      # A generic device and no -sdk: naming both leaves the asset catalogue's unthinned half empty.
      # The version is the root package.json's, the build number the commit count, as on Android (docs/versioning.md).
      - name: app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project engine/k7-ios/k7.xcodeproj -scheme k7 -configuration Release \
            -destination "generic/platform=iOS" -derivedDataPath "$RUNNER_TEMP/k7-ios" \
            MARKETING_VERSION="$(node -p 'require("./package.json").version')" \
            CURRENT_PROJECT_VERSION="$(git rev-list --count HEAD)" \
            CODE_SIGNING_ALLOWED=NO build

      # The three frameworks inside, each an arm64 device binary, before anything is uploaded.
      - name: unsigned ipa
        shell: bash
        env:
          STAMP: ${{ needs.decide.outputs.stamp }}
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/k7-ios/Build/Products/Release-iphoneos/k7.app"
          for f in k7runtime k7supervisor NodeMobile; do
            bin="$app/Frameworks/$f.framework/$f"
            test -f "$bin" || { echo "::error::$f.framework is missing from the app"; exit 1; }
            lipo -archs "$bin" | grep -qx arm64 || { echo "::error::$f is not arm64"; exit 1; }
          done
          mkdir -p "$RUNNER_TEMP/ipa/Payload" dist
          cp -R "$app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/dist/k7-ios_${STAMP}_arm64-unsigned.ipa" Payload)
          ls -l dist

      - name: compiler cache stats
        if: always()
        shell: bash
        run: sccache --show-stats 2>/dev/null || echo 'no compiler cache this run'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: k7-ios-arm64-unsigned
          path: dist/*.ipa
          if-no-files-found: error

  # A version tag's release gets the .ipa; a snapshot does not. The release is desktop.yml's to make, after
  # k7.yml passed and every desktop built, so this waits for it rather than racing it — no release, no upload.
  publish:
    name: attach to the release
    needs: [decide, ios]
    if: needs.decide.outputs.release == 'yes'
    runs-on: ubuntu-latest
    # Long enough for desktop.yml's three native builds behind the tests; past it, the release is not coming.
    timeout-minutes: 120
    permissions:
      contents: write # the release's assets
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: k7-ios-arm64-unsigned
          path: dist

      - name: wait for the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.decide.outputs.stamp }}
        run: |
          set -euo pipefail
          until gh release view "$TAG" --json tagName >/dev/null 2>&1; do
            echo "no release $TAG yet — desktop.yml makes it once its builds are done"
            sleep 60
          done

      # The .ipa beside the desktops, and its line in the release's SHA256SUMS so one check covers every file.
      - name: attach
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.decide.outputs.stamp }}
        run: |
          set -euo pipefail
          cd dist
          ipa=$(ls *.ipa)
          gh release upload "$TAG" "$ipa" --clobber
          gh release download "$TAG" --pattern SHA256SUMS --clobber
          # Re-runs replace the .ipa's line rather than adding a second one.
          grep -v "  $ipa\$" SHA256SUMS > sums.tmp || true
          sha256sum -- "$ipa" >> sums.tmp
          mv sums.tmp SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --clobber
