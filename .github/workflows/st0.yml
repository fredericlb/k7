# st0 CI.
#
# Scoped to the st0 side of the repo deliberately — apps/st0 plus the two native
# halves it owns, engine/moteur (C++) and apps/st0-desktop (the desktop app). `turbo run test`
# across the whole repo is 62 tasks over eight apps; this is 14. A CI that is red on
# arrival for reasons nobody on this change caused is a CI people learn to ignore — so
# it starts narrow and green. Widening it is one filter per job.
#
# The file name and the three job `name:` fields are load-bearing: they are what branch
# protection matches on. Renaming them is its own change, made with that setting.
#
# Three jobs, and only two of them can fail the build:
#
#   js    — the 272 vitest tests plus typechecking. The reason this file exists.
#   capot — typecheck + tests on the desktop app. Needs NO C++ engine and no Electron
#           runtime: the package ships its .d.ts, so ELECTRON_SKIP_BINARY_DOWNLOAD is
#           enough. It replaced a `cargo check`/`cargo test` job on windows-latest, which
#           the port to Electron made unnecessary along with the MSVC toolchain.
#   lint  — informational. Biome reports a pre-existing backlog of warnings here; gating
#           on it would block every PR on work nobody on the change caused. It runs so the
#           number is visible and can be driven down. Flip `continue-on-error` at zero.
#
# Not included, on purpose: any job that builds the C++ engine — that belongs in a release
# workflow, not on every push. Nor the two SPIKES in apps/st0-desktop/scripts/: the Windows job
# object and a live tray menu have no CI equivalent, and they are run by hand on a real
# desktop (apps/st0-desktop/docs/tray.md).

name: st0

# The two path lists are duplicated rather than shared with a YAML anchor: GitHub
# Actions does not support anchors/aliases in workflow files.
on:
  push:
    branches: [master]
    paths:
      - "apps/st0/**"
      - "engine/moteur/**"
      - "apps/st0-desktop/**"
      - "packages/**"
      - "package-lock.json"
      - "turbo.json"
      - ".github/workflows/st0.yml"
  pull_request:
    paths:
      - "apps/st0/**"
      - "engine/moteur/**"
      - "apps/st0-desktop/**"
      - "packages/**"
      - "package-lock.json"
      - "turbo.json"
      - ".github/workflows/st0.yml"
  workflow_dispatch:

# A second push to the same branch makes the first run pointless.
concurrency:
  group: st0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: tests + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc # 22 — the line the vendored runtime is on (v22.23.1)
          cache: npm

      # The whole monorepo, because turbo needs the workspace links to resolve
      # @studio/* as source. Cached by setup-node on package-lock.json.
      - run: npm ci

      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      # capot is excluded from BOTH turbo steps: it is a workspace, but its
      # `build` is `tauri build` — a full release bundle needing the C++ engine and a
      # vendored Node. The `rust` job below is what covers the tray. `engine/moteur`
      # declares no `build`/`test` script at all, so turbo never tries to compile C++.
      - name: test
        run: npx turbo run test --filter="./apps/st0/**" --filter="./packages/**" --filter="!./apps/st0-desktop"

      # `build` is `tsc --noEmit` for every package; for web/frontend it is a real
      # `vite build && tsc --noEmit`, which is a stronger gate and worth the minute.
      - name: typecheck + build
        run: npx turbo run build --filter="./apps/st0/**" --filter="./packages/**" --filter="!./apps/st0-desktop"

      # the backend has only a `typecheck` script — no `build` — so turbo covers it in
      # neither step. Run it directly rather than adding a script to its package.json
      # purely to satisfy CI.
      - name: typecheck the st0 backend
        working-directory: apps/st0/backend
        run: npx tsc --noEmit

  capot:
    name: desktop app
    # ubuntu-latest now, where the Rust job needed windows-latest for MSVC: the app is
    # TypeScript, so nothing here is platform-specific. The parts that ARE — the Windows job
    # object and the tray itself — have no CI equivalent and are covered by the spikes in
    # apps/st0-desktop/scripts/, run by hand on a real desktop.
    #
    # No Electron runtime is downloaded: electron ships its .d.ts in the package, so a
    # typecheck needs nothing else. See apps/st0-desktop/docs/tray.md.
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: typecheck
        run: npm run typecheck --workspace st0-desktop

      - name: test
        run: npm run test --workspace st0-desktop


  lint:
    name: biome (informational)
    runs-on: ubuntu-latest
    # See the header: 157 pre-existing errors. This reports, it does not gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx biome check apps/st0 apps/st0-desktop packages
