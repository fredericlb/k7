# st0 CI.
#
# Scoped to the st0 side of the repo deliberately — apps/st0 plus the native halves it
# owns, engine/st0-engine (C++), engine/st0-supervisor (C++) and engine/st0-tray (the Tauri tray). `npm run test`
# across the whole repo is 62 tasks over eight apps; this is 14. A CI that is red on
# arrival for reasons nobody on this change caused is a CI people learn to ignore — so
# it starts narrow and green. Widening it is one filter per job.
#
# The file name and the three job `name:` fields are load-bearing: they are what branch
# protection matches on. Renaming them is its own change, made with that setting.
#
# Four jobs, and only three of them can fail the build:
#
#   js         — the vitest tests plus typechecking. The reason this file exists.
#   supervisor — the native supervisor built, its unit tests, and engine-tunnel's suites run
#                again with its agent in them: the wire it shares with the TypeScript hub.
#   rust       — `cargo check`/`cargo test` on the tray. Needs NO C++ build: tauri_build only
#                checks that the sidecar files EXIST, so the job stubs them.
#   lint  — informational. Biome reports a pre-existing backlog of warnings here; gating
#           on it would block every PR on work nobody on the change caused. It runs so the
#           number is visible and can be driven down. Flip `continue-on-error` at zero.
#
# Not included, on purpose: `cargo fmt --check` (pre-existing diffs in build.rs would
# make it red on arrival, same reasoning as lint) and any job that builds the C++ engine
# — that belongs in a release workflow, not on every push.

name: st0

# The two path lists are duplicated rather than shared with a YAML anchor: GitHub
# Actions does not support anchors/aliases in workflow files.
on:
  push:
    branches: [master]
    paths:
      - "apps/st0/**"
      - "engine/st0-engine/**"
      - "engine/st0-supervisor/**"
      - "engine/st0-tray/**"
      - "packages/**"
      - "package-lock.json"
      - ".github/workflows/st0.yml"
  pull_request:
    paths:
      - "apps/st0/**"
      - "engine/st0-engine/**"
      - "engine/st0-supervisor/**"
      - "engine/st0-tray/**"
      - "packages/**"
      - "package-lock.json"
      - ".github/workflows/st0.yml"
  workflow_dispatch:

# A second push to the same branch makes the first run pointless.
concurrency:
  group: st0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: tests + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc # 22 — the line the vendored runtime is on (v22.23.1)
          cache: npm

      # The whole monorepo, so the workspace symlinks resolve @studio/* as source.
      # Cached by setup-node on package-lock.json.
      - run: npm ci

      # capot (engine/st0-tray) is out of scope for both steps below without needing an
      # exclusion: it is a workspace, but neither `--workspace=apps/st0` nor
      # `--workspace=packages` matches it — its `build` is `tauri build`, a full release
      # bundle needing the C++ engine and a vendored Node, and the `rust` job below is what
      # covers it. `engine/st0-engine` declares no `build`/`test` script at all, so neither
      # step below ever tries to compile C++.
      - name: test
        run: npm run test --workspace=apps/st0 --workspace=packages --if-present

      # `build` is `tsc --noEmit` for every package; for web/frontend it is a real
      # `vite build && tsc --noEmit`, which is a stronger gate and worth the minute.
      - name: typecheck + build
        run: npm run build --workspace=apps/st0 --workspace=packages --if-present

      # the backend has only a `typecheck` script — no `build` — so neither step above
      # covers it. Run it directly rather than adding a script to its package.json
      # purely to satisfy CI.
      - name: typecheck the st0 backend
        working-directory: apps/st0/backend
        run: npx tsc --noEmit

  supervisor:
    name: supervisor (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: build
        working-directory: engine/st0-supervisor
        run: |
          cmake --preset dev-gcc
          cmake --build --preset dev-gcc

      - name: unit tests
        run: engine/st0-supervisor/build/dev-gcc/st0_supervisor_tests

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # The suites find the built `tunnel_harness` and run every case against it as well as the Node agent.
      - name: tunnel conformance
        working-directory: packages/engine-tunnel
        run: npx vitest run

  rust:
    name: tray (cargo)
    # windows-latest, not ubuntu: this app ships on Windows, the toolchain it needs is
    # MSVC (never -gnu), and a Linux runner would additionally need the whole webkit2gtk
    # apt set for a tray app that draws no web content.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine/st0-tray/src-tauri

      # tauri_build refuses to build when an `externalBin` sidecar is missing, errors on a
      # `resources` glob that matches nothing, and requires `frontendDist` to exist. All
      # three checks are existence-only, so empty files satisfy them — which is what lets
      # this job skip the C++ engine and supervisor builds.
      #
      # Nothing here is executed. The real artifacts are staged by
      # `node scripts/build-engine.mjs --sidecar-only`, which is what a developer and the
      # release build run.
      #
      # `engine/st0-tray/dist/index.html` is the odd one out: a 4-line placeholder page (the
      # tray opens no windows). It IS tracked — force-un-ignored in .gitignore — so the
      # guard below is a no-op on a normal checkout and only covers a stripped one.
      - name: stub the sidecars, resources and frontendDist
        shell: bash
        working-directory: engine/st0-tray
        run: |
          set -euo pipefail
          mkdir -p src-tauri/binaries src-tauri/resources dist
          mkdir -p src-tauri/resources/faust-libs src-tauri/resources/onnxruntime
          for name in st0-engine st0-supervisor; do
            : > "src-tauri/binaries/${name}-x86_64-pc-windows-msvc.exe"
          done
          [ -f dist/index.html ] || printf '<!doctype html><html><head><title>studio-capot</title></head><body></body></html>\n' > dist/index.html

      - name: cargo check
        working-directory: engine/st0-tray/src-tauri
        run: cargo check --all-targets

      - name: cargo test
        working-directory: engine/st0-tray/src-tauri
        run: cargo test

  lint:
    name: biome (informational)
    runs-on: ubuntu-latest
    # See the header: 157 pre-existing errors. This reports, it does not gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx biome check apps/st0 engine/st0-tray packages
