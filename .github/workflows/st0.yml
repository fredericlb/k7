# st0 CI.
#
# Scoped to the st0 side of the repo deliberately — apps/st0 plus the native halves it
# owns, engine/st0-engine (C++), engine/st0-supervisor (C++) and engine/st0-tray (the Electron tray). `npm run test`
# across the whole repo is 62 tasks over eight apps; this is 14. A CI that is red on
# arrival for reasons nobody on this change caused is a CI people learn to ignore — so
# it starts narrow and green. Widening it is one filter per job.
#
# The file name and the two gating job `name:` fields are load-bearing: they are what branch
# protection matches on. Renaming them is its own change, made with that setting.
#
# Three jobs, and only two of them can fail the build:
#
#   js         — the vitest tests plus typechecking, the tray's included. The reason this file exists.
#   supervisor — the native supervisor built, its unit tests, and engine-tunnel's suites run
#                again with its agent in them: the wire it shares with the TypeScript hub.
#   lint  — informational. Biome reports a pre-existing backlog of warnings here; gating
#           on it would block every PR on work nobody on the change caused. It runs so the
#           number is visible and can be driven down. Flip `continue-on-error` at zero.
#
# Not included, on purpose: any job that builds the C++ engine — that belongs in a release
# workflow, not on every push.

name: st0

# The two path lists are duplicated rather than shared with a YAML anchor: GitHub
# Actions does not support anchors/aliases in workflow files.
on:
  push:
    branches: [master]
    paths:
      - "apps/st0/**"
      - "engine/st0-engine/**"
      - "engine/st0-supervisor/**"
      - "engine/st0-tray/**"
      - "packages/**"
      - "package-lock.json"
      - ".github/workflows/st0.yml"
  pull_request:
    paths:
      - "apps/st0/**"
      - "engine/st0-engine/**"
      - "engine/st0-supervisor/**"
      - "engine/st0-tray/**"
      - "packages/**"
      - "package-lock.json"
      - ".github/workflows/st0.yml"
  workflow_dispatch:

# A second push to the same branch makes the first run pointless.
concurrency:
  group: st0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: tests + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # commons is the one submodule; st0-library is a plain folder of this repository.
      - run: git submodule update --init commons

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc # 22 — the line the vendored runtime is on (v22.23.1)
          cache: npm

      # The whole monorepo, so the workspace symlinks resolve @studio/* as source.
      # Cached by setup-node on package-lock.json.
      - run: npm ci

      # The tray is tested here but not built: its `package` needs the C++ engine, and
      # `engine/st0-engine` declares no `build`/`test` script at all, so nothing below
      # ever tries to compile C++.
      - name: test
        run: npm run test --workspace=apps/st0 --workspace=packages --workspace=engine/st0-tray --if-present

      # `build` is `tsc --noEmit` for every package; for web/frontend it is a real
      # `vite build && tsc --noEmit`, which is a stronger gate and worth the minute.
      - name: typecheck + build
        run: npm run build --workspace=apps/st0 --workspace=packages --if-present

      # the backend has only a `typecheck` script — no `build` — so neither step above
      # covers it. Run it directly rather than adding a script to its package.json
      # purely to satisfy CI.
      - name: typecheck the st0 backend
        working-directory: apps/st0/backend
        run: npx tsc --noEmit

      - name: typecheck the tray
        working-directory: engine/st0-tray
        run: npx tsc --noEmit

      # The rehearsal server mounted by that backend has its own, laxer tsconfig and only a `typecheck` script too.
      - name: typecheck the rehearsal server
        working-directory: packages/rehearsal-server
        run: npx tsc --noEmit

  supervisor:
    name: supervisor (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # commons is the one submodule; st0-library is a plain folder of this repository.
      - run: git submodule update --init commons

      - run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: build
        working-directory: engine/st0-supervisor
        run: |
          cmake --preset dev-gcc
          cmake --build --preset dev-gcc

      - name: unit tests
        run: engine/st0-supervisor/build/dev-gcc/st0_supervisor_tests

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # The suites find the built `tunnel_harness` and run every case against it as well as the Node agent.
      - name: tunnel conformance
        working-directory: packages/engine-tunnel
        run: npx vitest run

  lint:
    name: biome (informational)
    runs-on: ubuntu-latest
    # See the header: 157 pre-existing errors. This reports, it does not gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      # commons is the one submodule; st0-library is a plain folder of this repository.
      - run: git submodule update --init commons
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx biome check apps/st0 engine/st0-tray packages
