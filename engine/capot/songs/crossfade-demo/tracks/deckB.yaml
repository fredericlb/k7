type: single
contentType: audio
# MUTED on purpose, and this is the one thing about the demo worth reading twice.
#
# `out` compiles as a PARALLEL path in this compiler — that is what makes a send a send, the
# dry signal carrying on to the master beside it. A deck feeding only a crossfade's second port
# gets the same treatment, so unmuted you hear deck B twice: once raw, once through the module,
# and pushing Mix to 0 does not take it away.
#
# Mute is what says "this lane is not heard on its own". It works because Tracktion's muting
# node deliberately still lets clips through to aux sends and sidechains — so the crossfade
# keeps its second signal while the master stops getting a duplicate. Measured: with this mute,
# Mix 0 is the kick alone, Mix 1 the snare alone; without it, the snare is there at every
# setting. See packages/song/docs/ports.md.
mute: true
clips:
  - { ref: snare, start: "1:2:1" }
  - { ref: snare, start: "1:4:1" }
docs: The B deck — backbeat. It lands on the crossfade's `b` port, which is why its chain ends there and it runs no modules of its own. Muted so it is heard through the crossfade only.
todos:
  - Try automating Mix so the two decks trade places over a bar
