# The signal graph, as SEGMENTS: each module says where its signal goes next. The chains are
# DERIVED by following the arrows — a run breaks where the signal splits, and where two signals
# meet (which is what a bus is).
#
# The LANES are here too ("melody", "pad"): a lane is a module like any other, and a run is
# named after the lane that starts it. One map, one name space — which is why the pad's synth
# is "synth-pad" rather than sharing its lane's name.
#
# `bypassed` lists the modules the signal passes through untouched, and on a lane — which
# produces rather than passes — that is its mute.

# A lane offers TWO outputs, `audio` and `midi`, and is not typed by what it holds — so the
# key names the one a run leaves by whenever there is anything to say. "melody" holds only
# sequences, so its bare key is unambiguous; "pad" streams from a pattern and holds nothing
# until the transport rolls, so nothing but this line can say its events are notes for the
# synth. See packages/song/docs/trackModules.md.

modules:
  melody: [ lead ]
  pad#midi: [ synth-pad ]
  lead: [ OUT ]
  synth-pad: [ OUT ]
